            - type: "null"
        account:
          oneOf:
            - $ref: "#/components/schemas/FinanceRef"
            - type: "null"
        description: { type: string }
        has_document: { type: boolean }
        reversed: { type: boolean }
        reservation_uuid: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    FinanceLedgerPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceLedgerRow" }
