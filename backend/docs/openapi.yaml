  /v1/tenant/search:
    get:
      tags: [Tenant, Search]
      operationId: getTenantSearch
      summary: Search the organization's records (Cmd+K)
      description: |
        Hits are filtered by `organization_id` in the index; Meilisearch is
        never exposed to the browser. Branch-bound specs match the caller's
        branch scope, and a member holding only the own slug of a spec
        (`tenant.reservations.own`) matches only its own records.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: q
