        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/branches/import:
    post:
      tags: [Tenant]
      operationId: postTenantBranchesImport
      summary: Upload a branches import file
      description: |
        Creates an import job (`tenant.branches.import`). Rows create new
        branches or update the branch with the same `code`. Continue with
        `/v1/tenant/imports/{uuid}/mapping`, `/preview` and `/confirm`.
