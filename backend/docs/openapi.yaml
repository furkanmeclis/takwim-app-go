      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/organization/logo:
    put:
      tags: [Tenant]
      operationId: putTenantOrganizationLogo
      summary: Upload the organization logo
      description: "`tenant.settings.write`. Multipart field `logo` (PNG, JPEG, WebP or SVG, at most 2 MB). The response carries the new API-owned `logo_url`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantOrganizationLogo
      summary: Remove the organization logo
      description: "`tenant.settings.write`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationProfile"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/roles/meta:
    get:
      tags: [Tenant]
      operationId: getTenantRolesMeta
      summary: Tenant roles list metadata
