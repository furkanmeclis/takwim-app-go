        fri: { type: array, items: { $ref: "#/components/schemas/StaffShift" } }
        sat: { type: array, items: { $ref: "#/components/schemas/StaffShift" } }
        sun: { type: array, items: { $ref: "#/components/schemas/StaffShift" } }

