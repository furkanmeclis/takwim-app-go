              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationItems"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/{uuid}:
    get:
      tags: [Notifications]
      operationId: getNotificationByUUID
      summary: Get own notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
