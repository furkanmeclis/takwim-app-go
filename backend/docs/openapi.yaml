      responses:
        "201":
          description: Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/invitations/{uuid}/revoke:
    post:
      tags: [Tenant]
      operationId: postTenantInvitationRevoke
      summary: Revoke an invitation
      description: "`tenant.members.write`; only invitations the caller could have granted. A closed invitation answers `409`."
      security:
        - bearerAuth: []
