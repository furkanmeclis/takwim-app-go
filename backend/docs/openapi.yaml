  /v1/platform/organizations:
    get:
      tags: [Platform]
      operationId: getPlatformOrganizations
      summary: List platform organizations
      description: |
        Organizations with their longest-standing owner and member, branch,
        vehicle and pending invitation counts (`platform.organizations.read`).
        `q` searches name, slug and owner e-mail. Faceted filters take comma
        separated values. Live updates on `resource:platform.organizations`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `slug`, `status`, `member_count`, `branch_count`, `access_ends_at`, `created_at`, `updated_at`; prefix `-` for descending. Default `-created_at`."
          schema: { type: string, example: "-created_at" }
        - name: status
          in: query
          description: "`active`, `suspended` (comma separated)"
          schema: { type: string, example: "active" }
        - name: access
          in: query
          description: "Access window state: `open`, `upcoming` (before access_starts_at), `expired` (after access_ends_at); comma separated"
          schema: { type: string, example: "open,upcoming" }
        - name: window
          in: query
          description: "`unlimited` (no access_ends_at) or `limited`; comma separated"
          schema: { type: string, example: "limited" }
      responses:
        "200":
          description: Organization page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationSummaryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Platform]
      operationId: postPlatformOrganization
      summary: Create organization
      description: |
        Creates the organization and runs the organization hooks in the same
        transaction (default branch "Merkez"). The owner is either an
        existing account (`owner_user_uuid`, default: the caller) or a new
        e-mail (`owner_email`): the organization then starts without members
        and an owner invitation is e-mailed (same flow as staff invitations).
        The slug is derived from the name with Turkish folding when omitted.
        `plan`, `addons` and `access_ends_at` set the starting entitlements
        and access window in the same transaction (TEC-927).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created organization (and the owner invitation, if any)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCreateOrganizationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/platform/organizations/export:
    post:
      tags: [Platform]
      operationId: postPlatformOrganizationsExport
      summary: Export organizations
      description: |
        Queues an export of the organizations list (`platform.organizations.export`,
        step-up like the other platform exports). `query` honours `q`, `status`,
        `access`, `window` and `sort`. Poll `GET /v1/platform/exports/{uuid}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
