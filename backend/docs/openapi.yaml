    EnvelopeTOTPSetup:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPSetup" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTOTPConfirm:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPConfirm" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    CreatePlatformUserRequest:
      type: object
      required: [email, password, name, surname]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        surname: { type: string }
        status: { type: string, examples: [active, pending, disabled] }
        role_uuids:
          type: array
          items: { type: string, format: uuid }

    PatchPlatformUserRequest:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        status: { type: string }
        role_uuids:
          type: array
          items: { type: string, format: uuid }

    SetPlatformUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }

    Organization:
      type: object
      required: [uuid, slug, name, status, timezone, currency, sector, plan, addons, branch_limit, staff_limit, access_starts_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url:
          type: [string, "null"]
          description: "API-owned logo stream (`/v1/organizations/{uuid}/logo?v=...`)"
        status: { type: string, enum: [active, suspended] }
        timezone: { type: string, description: "IANA zone for calendar decisions; instants stay UTC", example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code of every amount of the organization, example: TRY }
        sector: { $ref: "#/components/schemas/SectorCode" }
        plan: { $ref: "#/components/schemas/PlanCode" }
        addons:
          type: array
          items: { $ref: "#/components/schemas/Addon" }
        branch_limit: { type: [integer, "null"], description: "Stored override; `null` = plan default" }
        staff_limit: { type: [integer, "null"], description: "Stored override; `null` = plan default" }
        access_starts_at: { type: string, format: date-time }
        access_ends_at: { type: [string, "null"], format: date-time }
        settings:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }
        slug: { type: string, description: Derived from the name (Turkish folding) when empty }
        owner_user_uuid:
          type: string
          format: uuid
          description: Existing owner account; defaults to the caller. Not together with `owner_email`.
        owner_email:
          type: string
          format: email
          description: Invite this e-mail as owner instead (the organization starts without members).
        sector:
          allOf: [{ $ref: "#/components/schemas/SectorCode" }]
          description: Defaults to `hairdresser`
        plan:
          allOf: [{ $ref: "#/components/schemas/PlanCode" }]
          description: Starting plan; defaults to `starter`
        addons:
          type: array
          description: Add-on modules granted from the start
          items: { $ref: "#/components/schemas/Addon" }
        access_ends_at:
          type: [string, "null"]
          format: date-time
          description: End of the access window (must be in the future); omitted = open ended

    PatchOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        slug: { type: string }
        timezone: { type: string, description: IANA zone name, example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: TRY }
        sector: { $ref: "#/components/schemas/SectorCode" }
        settings:
          type: object
          additionalProperties: true

    SetOrganizationStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, suspended] }

    SetOrganizationAccessRequest:
      type: object
      additionalProperties: false
      properties:
        access_starts_at: { type: [string, "null"], format: date-time }
        access_ends_at: { type: [string, "null"], format: date-time }

    RoleSummary:
      type: object
      required: [uuid, name, slug]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }

    PlatformUserDetail:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
