        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUnreadCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: postNotificationsReadAll
