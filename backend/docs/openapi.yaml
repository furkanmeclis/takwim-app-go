  /v1/tenant/resources:
    get:
      tags: [Tenant]
      operationId: getTenantResources
      summary: List resources of the organization
      description: |
        Bookable resources (chair, table, area, room, device, bay) of the
        `X-Organization` organization (`tenant.resources.read`). `q` searches
        name, zone, description and the branch name. A member with
        `branch_scope` = `selected` only sees resources of its branches.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `kind`, `zone`, `capacity`, `sort_order`, `is_active`, `created_at`, `updated_at`; prefix `-` for descending. Default: branch, `sort_order`, name."
          schema: { type: string, example: name }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat (see `/v1/tenant/resources/facets`)"
          schema: { type: string }
        - name: kind
          in: query
          description: "Kinds; comma-separate or repeat"
          schema: { type: string }
        - name: zone
          in: query
          description: "Zones; comma-separate or repeat"
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: show_online
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantResourcePage"
