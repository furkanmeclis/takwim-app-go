        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Platform]
      operationId: putPlatformOrganizationEntitlements
      summary: Assign plan, add-ons and limit overrides
      description: |
        Replaces the plan, the granted add-ons and the limit overrides
        (`null` = plan default). Takes effect at once (scope cache
        invalidated). Limits are checked when something is added: lowering a
        limit below the current use blocks new branches / seats, it removes
        nothing.
      security:
        - bearerAuth: []
      parameters:
