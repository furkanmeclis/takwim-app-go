        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/settings:
    get:
      tags: [Tenant]
      operationId: getTenantSettings
      summary: Current organization settings
      description: |
        The highest stored version (`tenant.settings.read`). Before the first
        save the response is version `0` with defaults. `ready_for_online_sales`
        is false while any of `missing` (reservation approval mode, staff
        review window, payment hold and quote validity) is unset.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationSettingsVersion"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    put:
      tags: [Tenant]
      operationId: putTenantSettings
      summary: Save organization settings (new version)
      description: |
        `tenant.settings.write` (no step-up). Validates and stores the full
        document as version `current + 1`; stored versions never change.
        Validation errors use the document's dot paths
        (`company.tax_number`, `reservation.payment_hold_minutes`, …): the tax
        number must be a checksum-valid VKN (10 digits) or TCKN (11 digits).
        With `base_version`, a save on top of a newer version answers
        `409 CONFLICT` (detail `base_version`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettingsSaveRequest"
      responses:
        "200":
          description: Stored version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganizationSettingsVersion"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/settings/versions/meta:
    get:
      tags: [Tenant]
