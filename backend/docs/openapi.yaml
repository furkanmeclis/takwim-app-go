        title: { type: string, example: Kuaför }
        bio: { type: string }
        phone: { type: string }
        email: { type: string }
        color: { type: string, description: Calendar color `#RRGGBB`, example: "#2563EB" }
        show_online: { type: boolean, description: Bookable on the customer booking screens }
        is_active: { type: boolean }
        account:
