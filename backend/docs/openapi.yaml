        - name: channel
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: "me (default) or all (requires read_all)"
          schema:
            type: string
            enum: [me, all]
        - name: user_uuid
          in: query
          description: "Filter to one user (requires read_all)"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notifications/meta:
    get:
      tags: [Platform]
      operationId: getPlatformNotificationsMeta
      summary: Platform notifications meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/app/config:
