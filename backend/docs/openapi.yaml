  /v1/notifications/{uuid}/action:
    get:
      tags: [Notifications]
      operationId: getNotificationAction
      summary: Redeem a signed notification action
      description: >
        Verifies `exp` + `sig`, marks the in-app notification read, and returns
        the stored destination. Requires `notifications.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: exp
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action destination and updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/{uuid}/read:
    post:
      tags: [Notifications]
      operationId: postNotificationRead
      summary: Mark notification read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get own preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      summary: Update own preferences
      description: |
        Security emails (password reset / email verification) ignore `email_enabled`.
        Web push requires `push_enabled` and an active browser subscription; it follows in-app delivery.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/push-devices:
    post:
      tags: [Notifications]
      operationId: registerPushDevice
      summary: Register a mobile push device (Expo)
      description: |
        Upserts the caller's Expo push token (call after login and on app start).
        The token is unique: a token already registered by another account on the
        same phone moves to the caller. Refreshes `locale`, `app_version`,
        `device_name` and `last_seen_at`, and re-enables a token that Expo had
        reported as `DeviceNotRegistered`.

        Devices are **user-level**: every in-app
        notification of the user is mirrored as a push to all active devices,
        in addition to browser Web Push. The first registration creates the
        user's preference row with `push_enabled=true`; an existing preference
        is left untouched and returned as `push_enabled` (toggle it with
        `PUT /v1/notification-preferences`).

        Push payload (Expo message) — lock-screen safe (fixed texts per
        notification kind, only whitelisted variables); rendered in the user's locale (`users.locale`,
        falling back to the device `locale`):
        `{ "title": "...", "body": "...", "sound": "default", "priority": "high",
        "data": { "url": "/platform/exports/{uuid}", "notification_uuid": "uuid", "kind": "exports.ready" } }`.
        `data.url` is the same relative web path the in-app notification links to
        (omitted when the notification has no link); `kind` is the
        notification kind or template code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDeviceRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/push-devices/{token}:
    delete:
      tags: [Notifications]
      operationId: deletePushDevice
      summary: Unregister a mobile push device
      description: |
        Removes the caller's device (call on logout, before dropping the access
        token). The token must be URL-encoded (`ExponentPushToken%5B...%5D`).
        Idempotent: unknown tokens or tokens of another user return 200 and
        change nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          description: Expo push token, URL-encoded
          schema: { type: string, example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]" }
      responses:
        "200":
          description: Removed (or nothing to remove)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatusOK"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/platform/notifications:
    get:
      tags: [Platform]
      operationId: getPlatformNotifications
      summary: List platform notifications
      description: |
        Defaults to the caller's own notifications (`scope=me`).
        `platform.notifications.read_all` is required for `scope=all` or `user_uuid`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: "me (default) or all (requires read_all)"
          schema:
            type: string
            enum: [me, all]
        - name: user_uuid
          in: query
          description: "Filter to one user (requires read_all)"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notifications/meta:
    get:
      tags: [Platform]
      operationId: getPlatformNotificationsMeta
      summary: Platform notifications meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/app/config:
    get:
      tags: [Health]
      operationId: getAppConfig
      summary: Public app config
      description: Unauthenticated bootstrap payload (auth methods, branding).
      security: []
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listAuthSessions
      summary: List active sessions
      description: Refresh-token sessions for the current user. `current` is the session bound to this access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      operationId: revokeOtherAuthSessions
      summary: Revoke other sessions
      description: Signs out every session except the current one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remaining current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions/{uuid}:
    delete:
      tags: [Auth]
      operationId: revokeAuthSession
      summary: Revoke a session
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sectors:
    get:
      tags: [Tenant]
      operationId: listSectors
      summary: Sector catalog
      description: |
        The six business sectors with their default booking flow, the
        capacity a reservation holds, the panel's terms and the visible /
        highlighted modules (TEC-882). The catalog lives in code; a
        business stores only its sector code. Any signed-in user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sectors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSectorList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/entitlements:
    get:
      tags: [Tenant]
      operationId: getTenantEntitlements
      summary: Plan, add-ons, limits and usage of the organization
      description: |
        Read-only for the organization (`tenant.settings.read`); Takwim
        assigns plans and add-ons. Adding a branch or a staff seat over the
        limit answers `409 PLAN_LIMIT_REACHED` with `{kind, limit, used}`; a
        module route of a module the organization may not use answers
        `403 MODULE_NOT_ENABLED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEntitlementSummary"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/overview:
    get:
      tags: [Tenant]
      operationId: getTenantOverview
      summary: Central panel of the organization
      description: |
        The branches the caller sees (`tenant.branches.read`, branch scope),
        one by one and in total: active and online branches, which are open
        now (today's hours in each branch's time zone, dated exceptions
        first) and how many members can work in each. `X-Branch` narrows it
        to one branch. `totals.members` counts each member once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantOverview"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/activity/facets:
    get:
      tags: [Tenant]
      operationId: getTenantActivityFacets
      summary: Activity history faceted filter options
      description: Resources and actions (with row counts) present in the caller's branch scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantActivityFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/activity:
    get:
      tags: [Tenant]
      operationId: getTenantActivity
      summary: Activity history of the organization
      description: |
        Who changed what and when (`tenant.activity.read`). Updates carry the
        before / after of each changed field in `payload.changes`. A member
        limited to some branches (or with `X-Branch` set) only sees events of
        those branches; business-wide events are hidden from them. `q`
        searches the action, the actor and the branch name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "`created_at` or `-created_at` (default)."
          schema: { type: string, example: "-created_at" }
        - name: resource
          in: query
          description: "Resource; comma-separate for several (see `/v1/tenant/activity/facets`)"
          schema: { type: string }
        - name: action
          in: query
          description: "Action; comma-separate for several"
          schema: { type: string }
        - name: resource_uuid
          in: query
          description: History of one record.
          schema: { type: string, format: uuid }
        - name: actor_uuid
          in: query
          description: Events of one user.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: "RFC 3339 time, inclusive"
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "RFC 3339 time, exclusive"
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantActivityPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/context:
    get:
      tags: [Tenant]
      operationId: getTenantContext
      summary: Current organization scope
      description: |
        Resolves the organization named by `X-Organization` and the caller's
        membership in it, and returns what tenant routes see: the organization,
        the caller's tenant role and its `tenant.*` permissions in this
        organization only. Mounted only when `TENANCY_ENABLED=true`.

        Errors: missing header → `400 ORGANIZATION_REQUIRED`; unknown
        organization or no membership → `403 NO_TENANT_MEMBERSHIP` (same
        answer for both; `super_admin` is not exempt); suspended →
        `403 ORGANIZATION_SUSPENDED`; outside the access window →
        `403 ORGANIZATION_ACCESS_EXPIRED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Organization scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantContext"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/members/meta:
    get:
      tags: [Tenant]
      operationId: getTenantMembersMeta
      summary: Members list metadata
      description: Table contract of `GET /v1/tenant/members` (`tenant.members.read`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/members:
    get:
      tags: [Tenant]
      operationId: getTenantMembers
      summary: List members of the organization
      description: |
        Members of the `X-Organization` organization with all their roles and
        their branch access (`tenant.members.read`). `q` searches name,
        surname and email. Invitations are managed separately.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `email`, `branch_scope`, `last_login_at`, `created_at`; prefix `-` for descending. Default `created_at`."
          schema: { type: string, example: "name" }
        - name: role
          in: query
          description: Tenant role uuid; comma-separate or repeat for several (any of them)
          schema: { type: string }
        - name: branch_scope
          in: query
          schema: { type: string, enum: [all, selected] }
      responses:
        "200":
          description: Member page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMemberPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/members/{userUuid}:
    parameters:
      - name: userUuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tenant]
      operationId: getTenantMember
      summary: Get a member
      description: "`tenant.members.read`. A user who is not a member answers `404`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantMember
      summary: Change a member's roles and branch access
      description: |
        `tenant.members.write`. `role_uuids` replaces every role of the member
        (at least one; template or organization roles). `branch_scope`
        `selected` needs `branch_uuids` (at least one live branch of the
        organization); `all` clears the selection. The change invalidates the
        cached organization scope immediately.

        Guards (`403 FORBIDDEN`): only owners grant or revoke `owner`; a
        non-owner can only grant roles whose permissions it holds itself; a
        branch-restricted caller can only manage members inside its own
        branches and cannot grant `all`. Demoting the last owner answers
        `409 LAST_ORGANIZATION_OWNER`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantMemberPatchRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantMember
      summary: Remove a member from the organization
      description: "`tenant.members.write`. Only owners remove an owner; the last owner cannot be removed (`409 LAST_ORGANIZATION_OWNER`)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/invitations/meta:
    get:
      tags: [Tenant]
      operationId: getTenantInvitationsMeta
      summary: Invitations list metadata
      description: Table contract of `GET /v1/tenant/invitations` (`tenant.members.read`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/invitations:
    get:
      tags: [Tenant]
      operationId: getTenantInvitations
      summary: List staff invitations
      description: |
        Invitations of the organization (`tenant.members.read`), newest first.
        `q` searches the e-mail. Live updates on
        `org:{org_uuid}:resource:tenant.invitations`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/InvitationSort"
        - $ref: "#/components/parameters/InvitationStatus"
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantInvitation
      summary: Invite a staff member
      description: |
        `tenant.members.write`. E-mails a single-use link
        `${PUBLIC_FRONTEND_URL}/invite/{token}` valid for 7 days; the token
        (32 random bytes) is stored as its sha256 hash and never returned.
        Re-inviting an e-mail revokes its open invitation; inviting a member
        answers `409 ALREADY_MEMBER`.

        Same guards as member updates (`403 FORBIDDEN`): only owners invite
        owners; a non-owner can only grant roles whose permissions it holds;
        a branch-restricted caller cannot grant `all` and only its own
        branches. Rate limited per organization (`429 RATE_LIMITED`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenant/invitations/{uuid}/revoke:
    post:
      tags: [Tenant]
      operationId: postTenantInvitationRevoke
      summary: Revoke an invitation
      description: "`tenant.members.write`; only invitations the caller could have granted. A closed invitation answers `409`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/invitations/{uuid}/resend:
    post:
      tags: [Tenant]
      operationId: postTenantInvitationResend
      summary: Resend an invitation
