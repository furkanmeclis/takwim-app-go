        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/confirmations/settings:
    get:
      tags: [Tenant]
      operationId: getTenantConfirmationSettings
      summary: Customer confirmation rules
      description: |
        The confirmation add-on (TEC-921): the business-wide rule (or the
        template when none is saved), every branch the caller may see with
        its effective rule (`custom` = its own rule), the channels with
        whether a provider can deliver now, and the limits
        (`tenant.settings.read`). Without the add-on: `403 MODULE_NOT_ENABLED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationSettings"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Tenant]
      operationId: putTenantConfirmationSettings
      summary: Save the business-wide or a branch's confirmation rule
      description: |
        `tenant.settings.write`. Without `branch_uuid` the business-wide rule
        is replaced (needs access to every branch); with it, that branch's
        own rule. Timings are minutes before the visit start: the first
        request (30 to 10080), the follow-up (0 = none, before the first
        request), the deadline (0 to 10080, at least 30 minutes after the
        last request). `max_attempts` 1 to 5 counts the first request. The
        window (both minutes of the day or both null) is at least 60
        minutes. Saved rules apply to bookings planned from now on.
        Validation: `400 VALIDATION_ERROR` with field codes; unknown branch:
        `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationSaveInput"
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/confirmations/settings/reset:
    post:
      tags: [Tenant]
      operationId: postTenantConfirmationReset
      summary: Remove a saved confirmation rule
      description: |
        `tenant.settings.write`. Without `branch_uuid` the business-wide rule
        goes back to the template; with it, the branch follows the
        business-wide rule again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_uuid: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/confirmations/meta:
    get:
      tags: [Tenant]
      operationId: getTenantConfirmationListMeta
      summary: Confirmation list metadata
      description: Table contract of `GET /v1/tenant/confirmations` (TEC-924).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/confirmations/facets:
    get:
      tags: [Tenant]
      operationId: getTenantConfirmationFacets
      summary: Confirmation list states
      description: |
        Counts per `state` with the `branch`, time and `q` filters, and how
        many of those bookings need a person (`attention`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/ConfirmationBranchFilter"
        - $ref: "#/components/parameters/ConfirmationStartsFrom"
        - $ref: "#/components/parameters/ConfirmationStartsTo"
      responses:
        "200":
          description: State counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationFacets"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/confirmations/summary:
    get:
      tags: [Tenant]
      operationId: getTenantConfirmationSummary
      summary: Confirmation follow-up alerts
      description: |
        Upcoming visits of the caller's branch scope whose confirmation needs
        a person (the nav badge and the panel alert): a change request, no
        answer (`flagged`), no way to reach the customer (`unreachable`) or
        a request no channel could deliver (`send_failed`); `waiting` counts
        the upcoming visits still waiting for an answer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Follow-up counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationSummary"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/confirmations:
    get:
      tags: [Tenant]
      operationId: getTenantConfirmations
      summary: Confirmation list
      description: |
        Every booking with a confirmation task in the caller's branch scope
        (TEC-924, A08): the visit, the business's approval and the customer's
        confirmation side by side, the requests sent and planned, the latest
        request's result, the answer and its channel, and `attention` (the
        visit is ahead and a person has to act). `state` is the task status
        with `change_requested` (an open task the customer asked to move) and
        an expired task split by its outcome (`cancelled`, `flagged`,
        `unreachable`); without a `state` filter `dropped` tasks are left
        out. `q` searches the customer's name or phone or the reservation
        number. Needs the confirmation add-on (`403 MODULE_NOT_ENABLED`)
        and `tenant.reservations.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `starts_at`, `deadline_at`, `number`, `customer`, `updated_at`; prefix `-` for descending. Default: the next visit first."
          schema: { type: string }
        - $ref: "#/components/parameters/ConfirmationBranchFilter"
        - name: state
          in: query
          description: "List states; comma-separate or repeat"
          schema: { type: string }
        - name: attention
          in: query
          description: "`true`: only the bookings that need a person; `false`: the others"
          schema: { type: string, enum: ["true", "false"] }
        - $ref: "#/components/parameters/ConfirmationStartsFrom"
        - $ref: "#/components/parameters/ConfirmationStartsTo"
      responses:
        "200":
          description: Confirmation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationTaskPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/{uuid}/confirmation/attempts:
    get:
      tags: [Tenant]
      operationId: getTenantReservationConfirmationAttempts
      summary: Confirmation requests of a booking
      description: |
        The confirmation requests of the booking, newest first: one row per
        channel tried, with the provider's result, the masked recipient and
        the times (a request no channel took yet has `channel` null).
        `round` / `request` name the planning and the request ("2nd
        request of the 1st planning"). `tenant.reservations.read`; another
        business's or branch's booking: `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationAttempts"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/{uuid}/confirmation/confirm:
    post:
      tags: [Tenant]
      operationId: postTenantReservationConfirmationConfirm
      summary: Record a confirmation given on the phone
      description: |
        The customer confirmed on the phone (TEC-924): the same as the
        customer's "Geleceğim" (no more requests, no automatic cancel), with
        the member and the `note` in the history (channel `phone`). Allowed
        while the task is open or expired without a cancel and the visit is
        ahead; otherwise `409 CONFIRMATION_NOT_OPEN`. `expected_version`
        refuses a stale action (`409` `expected_version` / `stale`).
        `tenant.reservations.write`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationConfirmInput"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConfirmationConfirmResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customer-notifications/settings:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerNotificationSettings
      summary: Customer notification rules and texts
      description: |
        The channels (with whether a provider can deliver now) and every
        customer notification event with the business's rule (on / off,
        ordered channels, fallback, reminder offsets) and texts, next to the
        defaults (`tenant.settings.read`). Works without the confirmation
        add-on (A28).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerNotificationSettings"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Tenant]
      operationId: putTenantCustomerNotificationSettings
      summary: Save one event's rule and texts
      description: |
        `tenant.settings.write`. Replaces the rule of `event`; each text in
        `templates` is stored, and an empty text (or the default) goes back
        to the default. Texts may use only the event's `{{variables}}`
        (`unknown_variable`). Reminder offsets are minutes before the visit
        (15 to 10080, at most 3; only for `reservation.reminder`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerNotificationSaveInput"
      responses:
        "200":
          description: The event with its new rule and texts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerNotificationEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customer-notifications/settings/reset:
    post:
      tags: [Tenant]
      operationId: postTenantCustomerNotificationReset
      summary: Set an event back to the defaults
      description: "`tenant.settings.write`. Removes the business's rule and texts of `event`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, example: reservation.reminder }
      responses:
        "200":
          description: The event with the default rule and texts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerNotificationEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customer-notifications/preview:
    post:
      tags: [Tenant]
      operationId: postTenantCustomerNotificationPreview
      summary: Render a notification text with sample values
      description: "`tenant.settings.read`. Sample customer and visit, the business's own name; `unknown` lists placeholders that are not variables."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, channel, body]
              properties:
                event: { type: string }
                channel: { type: string, enum: [sms, whatsapp, email] }
                subject: { type: string }
                body: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Rendered text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerNotificationPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customer-notifications/deliveries/meta:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerNotificationDeliveriesMeta
      summary: Notification history metadata
      description: Table contract of `GET /v1/tenant/customer-notifications/deliveries` (`tenant.settings.read`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customer-notifications/deliveries:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerNotificationDeliveries
      summary: Customer notification history
      description: |
        One row per channel attempt, newest first (`tenant.settings.read`),
        inside the caller's branch scope. A channel without a ready provider
        is `skipped`, never `sent`. Recipients are masked; the stored text
        never holds a personal sign-in link.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `created_at`, `channel`, `status`, `event`; prefix `-` for descending. Default `-created_at`."
          schema: { type: string, example: -created_at }
        - name: channel
          in: query
          description: "`sms`, `whatsapp`, `email`; comma-separate or repeat"
          schema: { type: string }
        - name: status
          in: query
          description: "`sending`, `sent`, `delivered`, `failed`, `skipped`; comma-separate or repeat"
          schema: { type: string }
        - name: event
          in: query
          description: Event codes; comma-separate or repeat
          schema: { type: string }
        - name: customer_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: reservation_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: History page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerNotificationDeliveryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/cash/accounts:
    get:
      tags: [Tenant]
      operationId: getTenantCashAccounts
      summary: List cash, bank and online accounts
      description: |
        Accounts of the `X-Organization` organization with their balance
        (opening balance + money in - money out, `tenant.cash.read`). A
        member limited to some branches sees the accounts of those branches
        only; business-wide accounts need every branch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `kind`, `balance`, `status`, `sort_order`, `created_at`; prefix `-` for descending. Default: status, branch, `sort_order`, name."
          schema: { type: string, example: name }
        - name: branch
          in: query
          description: "Branch uuids and / or `head_office`; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "`cash`, `bank`, `online`; comma-separate or repeat"
          schema: { type: string }
        - name: status
          in: query
          description: "`active`, `archived`; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashAccountPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantCashAccount
      summary: Open a cash, bank or online account
      description: |
        `tenant.cash.manage`. Without `branch_uuid` the account is
        business-wide (only for members with every branch). A till cannot
        open with a negative balance. Names are unique per branch (`409`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashAccountCreateRequest"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashAccount"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/cash/accounts/export:
    post:
      tags: [Tenant]
      operationId: postTenantCashAccountsExport
      summary: Export cash accounts
      description: |
        Queues an export of the accounts with their balances
        (`tenant.cash.export`). `query` honours `q`, `branch`, `kind` and
        `status`. Poll `GET /v1/tenant/exports/{uuid}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/cash/accounts/bulk:
    post:
      tags: [Tenant]
      operationId: postTenantCashAccountsBulk
      summary: Run a bulk action on cash accounts
      description: |
        Actions `archive` (`tenant.cash.bulk.archive`, zero balance only)
        and `activate` (`tenant.cash.bulk.activate`), both reversible.
        Targets are resolved inside the organization and the caller's
        branch scope only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkExecuteRequest"
      responses:
        "200":
          description: Sync bulk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkSyncResult"
        "202":
          description: Async bulk job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/cash/accounts/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantCashAccount
      summary: Get a cash account
      description: With `has_activity`. A uuid of another organization or outside the caller's branch scope answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashAccountUUID"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashAccount"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantCashAccount
      summary: Update a cash account
      description: |
        `tenant.cash.manage`. Branch and kind are fixed; the opening balance
        and date only change while the account has no movement and no
        closing (`locked`). `status: archived` needs a zero balance (`409`).
      security:
        - bearerAuth: []
      parameters:
