    TenantProductStock:
      type: object
      description: |
        Stock summed over the branches of the caller's scope. `available` =
        `on_hand` − `reserved` (units held for appointments). `status` is
        `out` (nothing available), `low` (at or under the low stock level) or
        `in`.
      required: [on_hand, reserved, available, status]
      properties:
        on_hand: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        status: { type: string, enum: [in, low, out] }

    TenantProductOffer:
      type: object
      description: A branch selling the product. `price` is the branch override (null = catalog price).
      required: [branch_uuid, branch_name, branch_code, price, effective_price, is_active, editable]
      properties:
        branch_uuid: { type: string, format: uuid }
        branch_name: { type: string }
        branch_code: { type: string }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        effective_price: { $ref: "#/components/schemas/MoneyAmount" }
        is_active: { type: boolean }
        editable: { type: boolean, description: "False for branches outside the caller's scope" }

    TenantProductVariant:
      type: object
      required: [uuid, name, sku, barcode, price, cost, effective_price, effective_cost, is_active, sort_order, stock, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        barcode: { type: string }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        cost:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        effective_price: { $ref: "#/components/schemas/MoneyAmount" }
        effective_cost: { $ref: "#/components/schemas/MoneyAmount" }
        is_active: { type: boolean }
        sort_order: { type: integer }
        stock: { $ref: "#/components/schemas/TenantProductStock" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantProductStockLevel:
      type: object
      description: Stock of one stock item (the product, or a variant) in one branch.
      required: [branch_uuid, branch_name, branch_code, variant_uuid, variant_name, variant_sku, on_hand, reserved, available, status, updated_at]
      properties:
        branch_uuid: { type: string, format: uuid }
        branch_name: { type: string }
        branch_code: { type: string }
        variant_uuid: { type: [string, "null"], format: uuid }
        variant_name: { type: string }
        variant_sku: { type: string }
        on_hand: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        status: { type: string, enum: [in, low, out] }
        updated_at: { type: string, format: date-time }

    TenantProduct:
      type: object
      description: |
        A product of the business catalog (TEC-918). `image_url` is the
        API-owned public cover URL. A product with variants keeps its stock
        on the variants.
      required: [uuid, name, description, sku, barcode, unit, price, cost, currency, low_stock_threshold, show_online, is_active, image_url, variants_count, stock, offers, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sku: { type: string }
        barcode: { type: string }
        unit: { type: string, enum: [piece, bottle, box, pack, tube, set] }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        cost: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string, example: TRY }
        low_stock_threshold: { type: integer, minimum: 0 }
        show_online: { type: boolean }
        is_active: { type: boolean }
        image_url: { type: [string, "null"] }
        variants_count: { type: integer, format: int64 }
        stock: { $ref: "#/components/schemas/TenantProductStock" }
        offers:
          type: array
          items: { $ref: "#/components/schemas/TenantProductOffer" }
        variants:
          description: Detail only.
          type: array
          items: { $ref: "#/components/schemas/TenantProductVariant" }
        levels:
          description: Detail only. Branches of the caller's scope with a stock row.
          type: array
          items: { $ref: "#/components/schemas/TenantProductStockLevel" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantProductCreateRequest:
