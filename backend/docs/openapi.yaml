    CashAccountKind:
      type: string
      description: "`cash` = till, `bank` = bank account, `online` = online payment provider receivable"
      enum: [cash, bank, online]

    CashMovementKind:
      type: string
      description: |
        `deposit` / `withdrawal`: manual money in / out. `transfer_in` /
        `transfer_out`: the legs of a transfer. `closing_difference`: over /
        short of a daily closing. `reversal`: the opposite of one movement.
        `collection`, `refund`, `income`, `expense`, `staff_payment`: posted
        by the payment, sales, income / expense and staff payout modules.
      enum: [deposit, withdrawal, transfer_in, transfer_out, closing_difference, reversal, collection, refund, income, expense, staff_payment]

    CashBranchRef:
      type: object
      required: [uuid, name, code]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }

    CashAccountRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CashAccountKind" }

    CashUserRef:
      type: object
      required: [uuid, name, surname]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }

    CashAccount:
      type: object
      description: |
        A till, bank or online account (TEC-914). `branch` null = the whole
        business. `balance` = `opening_balance` + money in - money out.
        Amounts are decimal strings with two fraction digits.
      required: [uuid, branch, kind, name, currency, opening_balance, opening_date, balance, bank_name, iban, provider, note, status, sort_order, last_closed_date, has_activity, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        branch:
          oneOf:
            - $ref: "#/components/schemas/CashBranchRef"
            - type: "null"
        kind: { $ref: "#/components/schemas/CashAccountKind" }
        name: { type: string }
        currency: { type: string, example: TRY }
        opening_balance: { type: string, example: "100.00" }
        opening_date: { type: string, format: date }
        balance: { type: string, example: "1250.00" }
        bank_name: { type: string }
        iban: { type: string }
        provider: { type: string }
        note: { type: string }
        status: { type: string, enum: [active, archived] }
        sort_order: { type: integer }
        last_closed_date:
          description: Latest closed day (tills); movements on or before it are refused.
          oneOf:
            - { type: string, format: date }
            - type: "null"
        has_activity: { type: boolean, description: "Detail only: the account has a movement or a closing" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CashAccountCreateRequest:
      type: object
      required: [kind, name]
      properties: &CashAccountFields
        branch_uuid: { type: string, format: uuid, description: "Omit for a business-wide account" }
        kind: { $ref: "#/components/schemas/CashAccountKind" }
        name: { type: string, maxLength: 120 }
        opening_balance: { type: string, example: "0.00" }
        opening_date: { type: string, format: date, description: "Default today; not in the future" }
        bank_name: { type: string, maxLength: 120 }
        iban: { type: string, description: "Bank accounts only" }
        provider: { type: string, maxLength: 32, description: "Online accounts: the provider code" }
        note: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, archived] }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }

    CashAccountPatchRequest:
      type: object
      properties: *CashAccountFields

    CashAccountPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CashAccount" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    CashFacet:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer, format: int64 }

    CashAccountFacets:
      type: object
      required: [branch]
      properties:
        branch:
          type: array
          items: { $ref: "#/components/schemas/CashFacet" }

    CashAccountOption:
      type: object
      required: [uuid, name, kind, status, currency, branch_name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CashAccountKind" }
        status: { type: string, enum: [active, archived] }
        currency: { type: string }
        branch_name: { type: string, description: "Empty for business-wide accounts" }

    CashAccountOptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CashAccountOption" }

    CashMovement:
      type: object
      description: One append-only row of the cash book.
      required: [uuid, account, kind, direction, amount, currency, movement_date, description, counter_account, transfer_group, reverses_uuid, reversed_by_uuid, closing_uuid, source_type, source_uuid, created_by, created_at]
      properties:
        uuid: { type: string, format: uuid }
        account: { $ref: "#/components/schemas/CashAccountRef" }
        kind: { $ref: "#/components/schemas/CashMovementKind" }
        direction: { type: string, enum: [in, out] }
        amount: { type: string, example: "250.00" }
        currency: { type: string }
        movement_date: { type: string, format: date }
        description: { type: string }
        counter_account:
          oneOf:
            - $ref: "#/components/schemas/CashAccountRef"
            - type: "null"
        transfer_group: { type: [string, "null"], format: uuid }
        reverses_uuid: { type: [string, "null"], format: uuid }
        reversed_by_uuid: { type: [string, "null"], format: uuid }
        closing_uuid: { type: [string, "null"], format: uuid }
        source_type: { type: string, description: "Module that posted it (`payment` …); empty for panel movements" }
        source_uuid: { type: [string, "null"], format: uuid }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/CashUserRef"
            - type: "null"
        balance_after: { type: string, description: "Account movement list only: the balance after this movement" }
        created_at: { type: string, format: date-time }

    CashMovementCreateRequest:
      type: object
      required: [direction, amount, description]
      properties:
        direction: { type: string, enum: [in, out] }
        amount: { type: string, example: "150.00" }
        movement_date: { type: string, format: date }
        description: { type: string, maxLength: 500 }

    CashTransferRequest:
      type: object
      required: [from_account_uuid, to_account_uuid, amount]
      properties:
        from_account_uuid: { type: string, format: uuid }
        to_account_uuid: { type: string, format: uuid }
        amount: { type: string, example: "500.00" }
        movement_date: { type: string, format: date }
        description: { type: string, maxLength: 500 }

    CashTransfer:
      type: object
      required: [transfer_group, out, in]
      properties:
        transfer_group: { type: string, format: uuid }
        out: { $ref: "#/components/schemas/CashMovement" }
        in: { $ref: "#/components/schemas/CashMovement" }

    CashReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    CashMovementPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CashMovement" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    CashMovementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CashMovement" }

    CashMovementFacets:
      type: object
      required: [kind, account]
      properties:
        kind:
          type: array
          items: { $ref: "#/components/schemas/CashFacet" }
        account:
          type: array
          items: { $ref: "#/components/schemas/CashFacet" }

    CashClosing:
      type: object
      description: The daily closing of a till.
      required: [uuid, business_date, currency, opening_amount, total_in, total_out, expected_amount, counted_amount, difference, note, status, closed_by, closed_at, reopened_by, reopened_at, reopen_reason]
      properties:
        uuid: { type: string, format: uuid }
        business_date: { type: string, format: date }
        currency: { type: string }
        opening_amount: { type: string }
        total_in: { type: string }
        total_out: { type: string }
        expected_amount: { type: string }
        counted_amount: { type: string }
        difference: { type: string, description: "counted - expected; negative = short" }
        note: { type: string }
        status: { type: string, enum: [closed, reopened] }
        closed_by:
          oneOf:
            - $ref: "#/components/schemas/CashUserRef"
            - type: "null"
        closed_at: { type: string, format: date-time }
        reopened_by:
          oneOf:
            - $ref: "#/components/schemas/CashUserRef"
            - type: "null"
        reopened_at: { type: [string, "null"], format: date-time }
        reopen_reason: { type: string }

    CashClosingCreateRequest:
      type: object
      required: [counted_amount]
      properties:
        business_date: { type: string, format: date, description: "Default today" }
        counted_amount: { type: string, example: "1250.00" }
        note: { type: string, maxLength: 2000 }

    CashClosingPreview:
      type: object
      required: [business_date, currency, opening_amount, total_in, total_out, expected_amount, movement_count, closed, last_closed_date]
      properties:
        business_date: { type: string, format: date }
        currency: { type: string }
        opening_amount: { type: string }
        total_in: { type: string }
        total_out: { type: string }
        expected_amount: { type: string }
        movement_count: { type: integer, format: int64 }
        closed: { type: boolean, description: "The day is on or before the latest closed day" }
        last_closed_date: { type: [string, "null"], format: date }

    CashClosingPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CashClosing" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    CashDailyAccount:
      type: object
      required: [account, branch, currency, status, opening_amount, money_in, money_out, transfer_in, transfer_out, difference, closing_amount, closed, closing_uuid, closed_at]
      properties:
        account: { $ref: "#/components/schemas/CashAccountRef" }
        branch:
          oneOf:
            - $ref: "#/components/schemas/CashBranchRef"
            - type: "null"
        currency: { type: string }
        status: { type: string, enum: [active, archived] }
        opening_amount: { type: string }
        money_in: { type: string }
        money_out: { type: string }
        transfer_in: { type: string }
        transfer_out: { type: string }
        difference: { type: string }
        closing_amount: { type: string }
        closed: { type: boolean }
        closing_uuid: { type: [string, "null"], format: uuid }
        closed_at: { type: [string, "null"], format: date-time }

    CashDailyTotals:
      type: object
      required: [currency, opening_amount, money_in, money_out, transfer_in, transfer_out, difference, closing_amount]
      properties:
        currency: { type: string }
        opening_amount: { type: string }
        money_in: { type: string }
        money_out: { type: string }
        transfer_in: { type: string }
        transfer_out: { type: string }
        difference: { type: string }
        closing_amount: { type: string }

    CashDailySummary:
      type: object
      required: [date, accounts, totals]
      properties:
        date: { type: string, format: date }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/CashDailyAccount" }
        totals:
          type: array
          items: { $ref: "#/components/schemas/CashDailyTotals" }

    EnvelopeCashAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CashAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CustomerNotificationRule:
      type: object
      required: [enabled, channels, fallback, reminder_offsets]
      properties:
        enabled: { type: boolean }
        channels:
          type: array
          description: Ordered; the next one runs when one fails or is skipped (with `fallback`).
          items: { type: string, enum: [sms, whatsapp, email] }
        fallback: { type: boolean }
        reminder_offsets:
          type: array
          description: Minutes before the visit (reminder only).
          items: { type: integer, format: int32 }

    CustomerNotificationTemplate:
      type: object
      required: [channel, subject, body, custom, default_subject, default_body]
      properties:
        channel: { type: string, enum: [sms, whatsapp, email] }
        subject: { type: string, description: E-mail only }
        body: { type: string }
        custom: { type: boolean }
        default_subject: { type: string }
        default_body: { type: string }

    CustomerNotificationEvent:
      type: object
      required: [code, reminder, variables, rule, default_rule, custom, templates]
      properties:
        code:
          type: string
          enum: [reservation.requested, reservation.accepted, reservation.rejected, reservation.rescheduled, reservation.cancelled, reservation.reminder]
        reminder: { type: boolean }
        variables:
          type: array
          items: { type: string }
        rule: { $ref: "#/components/schemas/CustomerNotificationRule" }
        default_rule: { $ref: "#/components/schemas/CustomerNotificationRule" }
        custom: { type: boolean }
        templates:
          type: array
          items: { $ref: "#/components/schemas/CustomerNotificationTemplate" }
        updated_at: { type: string, format: date-time }

    CustomerNotificationChannel:
      type: object
      required: [name, ready]
      properties:
        name: { type: string, enum: [sms, whatsapp, email] }
        ready: { type: boolean, description: A provider can deliver now; otherwise sends are skipped. }

    ConfirmationRule:
      type: object
      required: [enabled, channels, fallback, first_request_minutes, follow_up_minutes, max_attempts, deadline_minutes,
        window_start_minute, window_end_minute, on_no_answer]
      properties:
        enabled: { type: boolean }
        channels:
          type: array
          description: In order; the first is the primary channel.
          items: { type: string, enum: [sms, whatsapp, email] }
        fallback: { type: boolean, description: Try the next channel when one fails. }
        first_request_minutes: { type: integer, minimum: 30, maximum: 10080, description: Minutes before the start. }
        follow_up_minutes: { type: integer, minimum: 0, maximum: 10080, description: "Minutes before the start; 0 = none." }
        max_attempts: { type: integer, minimum: 1, maximum: 5 }
        deadline_minutes: { type: integer, minimum: 0, maximum: 10080, description: "Last answer: minutes before the start." }
        window_start_minute: { type: [integer, "null"], minimum: 0, maximum: 1439, description: Local minute of the day requests may start. }
        window_end_minute: { type: [integer, "null"], minimum: 1, maximum: 1440 }
        on_no_answer: { type: string, enum: [cancel, flag] }

    ConfirmationSaveInput:
      allOf:
        - $ref: "#/components/schemas/ConfirmationRule"
        - type: object
          properties:
            branch_uuid: { type: [string, "null"], format: uuid, description: Null = the business-wide rule. }

    ConfirmationBranchRule:
      type: object
      required: [branch, custom, rule, updated_at]
      properties:
        branch:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        custom: { type: boolean, description: The branch has its own rule. }
        rule: { $ref: "#/components/schemas/ConfirmationRule" }
        updated_at: { type: [string, "null"], format: date-time }

    ConfirmationSettings:
      type: object
      required: [channels, default, default_custom, default_updated_at, template, branches, limits]
      properties:
        channels:
          type: array
          items:
            type: object
            required: [name, ready]
            properties:
              name: { type: string, enum: [sms, whatsapp, email] }
              ready: { type: boolean }
        default: { $ref: "#/components/schemas/ConfirmationRule" }
        default_custom: { type: boolean }
        default_updated_at: { type: [string, "null"], format: date-time }
        template: { $ref: "#/components/schemas/ConfirmationRule" }
        branches:
          type: array
          items: { $ref: "#/components/schemas/ConfirmationBranchRule" }
        limits:
          type: object
          required: [min_response_minutes, min_first_request_minutes, max_minutes, max_attempts, min_window_minutes]
          properties:
            min_response_minutes: { type: integer }
            min_first_request_minutes: { type: integer }
            max_minutes: { type: integer }
            max_attempts: { type: integer }
            min_window_minutes: { type: integer }

    EnvelopeConfirmationSettings:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ConfirmationSettings" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantReservationConfirmation:
      type: object
      description: The confirmation task of the booking (TEC-921).
      required: [status, channels, on_no_answer, attempt_times, attempts_sent, attempts_planned, next_attempt_at, deadline_at,
        answer, answer_channel, answered_at, change_requested_at, change_note, outcome, last_error, planned_at, closed_at]
      properties:
        status: { type: string, enum: [scheduled, pending, confirmed, declined, expired, dropped] }
        channels:
          type: array
          items: { type: string }
        on_no_answer: { type: string, enum: [cancel, flag] }
        attempt_times:
          type: array
          items: { type: string, format: date-time }
        attempts_sent: { type: integer }
        attempts_planned: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        deadline_at: { type: string, format: date-time }
        answer: { type: [string, "null"], enum: [confirm, cancel, change, null] }
        answer_channel: { type: [string, "null"] }
        answered_at: { type: [string, "null"], format: date-time }
        change_requested_at: { type: [string, "null"], format: date-time }
        change_note: { type: string }
        outcome: { type: [string, "null"], enum: [cancelled, flagged, unreachable, null] }
        last_error: { type: string }
        planned_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }

    ConfirmationState:
      type: string
      description: |
        The list state of a confirmation (TEC-924): the task status, with
        `change_requested` and an expired task split by its outcome.
      enum: [change_requested, unreachable, flagged, pending, scheduled, confirmed, declined, cancelled, dropped]

    ConfirmationTask:
      type: object
      description: One booking of the confirmation list (TEC-924).
      required: [uuid, number, status, approval_status, confirmation_status, version, branch, customer, services, staff,
        starts_at, ends_at, state, task_status, channels, on_no_answer, attempts_sent, attempts_planned, next_attempt_at,
        deadline_at, answer, answer_channel, answered_at, change_requested_at, change_note, outcome, last_error,
        failed_sends, send_failed, last_send, attention, can_confirm, updated_at]
      properties:
        uuid: { type: string, format: uuid, description: The reservation. }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/TenantReservationStatus" }
        approval_status: { $ref: "#/components/schemas/TenantReservationApprovalStatus" }
        confirmation_status: { $ref: "#/components/schemas/TenantReservationConfirmationStatus" }
        version: { type: integer }
        branch:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        customer:
          type: object
          required: [uuid, name, phone]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
            phone: { type: [string, "null"], description: "E.164, for the call link." }
        services: { type: string }
        staff: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/ConfirmationState" }
        task_status: { type: string, enum: [scheduled, pending, confirmed, declined, expired, dropped] }
        channels:
          type: array
          items: { type: string }
        on_no_answer: { type: string, enum: [cancel, flag] }
        attempts_sent: { type: integer }
        attempts_planned: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        deadline_at: { type: string, format: date-time }
        answer: { type: [string, "null"], enum: [confirm, cancel, change, null] }
        answer_channel: { type: [string, "null"], description: "panel, visit_link, phone (recorded by a member); whatsapp / voice later" }
        answered_at: { type: [string, "null"], format: date-time }
        change_requested_at: { type: [string, "null"], format: date-time }
        change_note: { type: string }
        outcome: { type: [string, "null"], enum: [cancelled, flagged, unreachable, null] }
        last_error: { type: string }
        failed_sends: { type: integer, description: Requests of the current planning no channel could deliver. }
        send_failed: { type: boolean, description: An open task with a request no channel could deliver. }
        last_send:
          oneOf:
            - type: object
              required: [status, error, at]
              properties:
                status: { type: string, enum: [pending, sending, delivered, failed, skipped, cancelled] }
                error: { type: string }
                at: { type: string, format: date-time }
            - type: "null"
        attention: { type: boolean, description: The visit is ahead and a person has to act. }
        can_confirm: { type: boolean, description: The booking takes a confirmation given on the phone now. }
        updated_at: { type: string, format: date-time }

    ConfirmationTaskPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfirmationTask" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeConfirmationTaskPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ConfirmationTaskPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ConfirmationFacets:
      type: object
      required: [state, attention]
      properties:
        state:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: { $ref: "#/components/schemas/ConfirmationState" }
              count: { type: integer, format: int64 }
        attention: { type: integer, format: int64 }

    EnvelopeConfirmationFacets:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ConfirmationFacets" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ConfirmationSummary:
      type: object
      required: [attention, change_requested, unreachable, flagged, send_failed, waiting]
      properties:
        attention: { type: integer, format: int64 }
        change_requested: { type: integer, format: int64 }
        unreachable: { type: integer, format: int64 }
        flagged: { type: integer, format: int64 }
        send_failed: { type: integer, format: int64 }
        waiting: { type: integer, format: int64 }

    EnvelopeConfirmationSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ConfirmationSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ConfirmationAttempt:
      type: object
      required: [round, request, status, dispatch_status, channel, try, provider, recipient, error, scheduled_at, sent_at,
        finished_at, created_at, delivery_uuid, dispatch_uuid, dispatch_error]
      properties:
        round: { type: integer }
        request: { type: integer }
        status: { type: string, description: "The channel's result (sending, sent, delivered, failed, skipped) or the request's own status without a channel." }
        dispatch_status: { type: string, enum: [pending, sending, delivered, failed, skipped, cancelled] }
        channel: { type: [string, "null"] }
        try: { type: integer }
        provider: { type: string }
        recipient: { type: string, description: Masked. }
        error: { type: string }
        scheduled_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        delivery_uuid: { type: [string, "null"], format: uuid }
        dispatch_uuid: { type: string, format: uuid }
        dispatch_error: { type: string }

    EnvelopeConfirmationAttempts:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ConfirmationAttempt" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ConfirmationConfirmInput:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
