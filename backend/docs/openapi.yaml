          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashClosingPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/cash/accounts/{uuid}/closings/{closingUuid}/reopen:
    post:
      tags: [Tenant]
      operationId: postTenantCashAccountClosingReopen
      summary: Reopen the latest closed day
      description: |
        `tenant.cash.reopen` and a reason. Only the latest closed day of the
        till reopens (`409 not_latest`); its difference movement is reversed
        on the same day.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashAccountUUID"
        - name: closingUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashReasonRequest"
      responses:
        "200":
          description: Reopened closing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashClosing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

