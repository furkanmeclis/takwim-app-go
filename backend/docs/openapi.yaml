      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        ws_url: { type: string }

    RealtimeSubscriptionTokenRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string }

    RealtimeSubscriptionToken:
      type: object
      required: [token, channel, expires_at]
      properties:
        token: { type: string }
        channel: { type: string }
        expires_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [uuid, channel, status, priority, title, body, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        channel: { type: string }
        status: { type: string }
        priority: { type: string }
        title: { type: string }
        body: { type: string }
        payload: { type: object, additionalProperties: true }
        action_url: { type: string }
        signed_action_url: { type: string }
        recipient: { type: string }
        template_code: { type: string }
        source_event: { type: string }
        sent_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        user:
          $ref: "#/components/schemas/NotificationUser"
        organization_uuid:
          type: string
          format: uuid
          description: >-
            Organization of the notification (tenant engine jobs). Absent for
            platform and personal notifications. A tenant export's
            `action_url` is the tenant page `/t/{slug}/exports/{uuid}/download`.

    NotificationUser:
      type: object
      required: [uuid, name, surname, email]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }

    NotificationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    NotificationPreferences:
      type: object
      required: [email_enabled, inapp_enabled, realtime_enabled, push_enabled]
      properties:
        email_enabled: { type: boolean }
        inapp_enabled: { type: boolean }
        realtime_enabled: { type: boolean }
