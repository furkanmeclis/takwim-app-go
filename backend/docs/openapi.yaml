        - name: channel
          in: query
          schema: { type: string }
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/notifications/unread-count:
