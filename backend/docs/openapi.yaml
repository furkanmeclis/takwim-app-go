    TenantStockMovement:
      type: object
      description: |
        One row of the append-only stock ledger. `quantity` is the signed
        change of the branch stock, `balance_after` the stock right after
        it. `unit_price` is kept on sales and returns, `unit_cost` on
        receipts and sales.
      required: [uuid, kind, quantity, balance_after, product, variant, branch, counterpart_branch, transfer_uuid, unit_price, unit_cost, currency, staff, reason, note, source, returned, occurred_at, created_by, created_at]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [receipt, sale, return, adjustment, transfer_out, transfer_in] }
        returned: { type: boolean, description: "A sale whose product was taken back (`POST /v1/tenant/stock-movements/{uuid}/return`)." }
        quantity: { type: integer }
        balance_after: { type: integer, minimum: 0 }
        product: { $ref: "#/components/schemas/TenantStockRef" }
        variant:
          oneOf:
            - $ref: "#/components/schemas/TenantStockRef"
            - type: "null"
        branch: { $ref: "#/components/schemas/TenantStockRef" }
        counterpart_branch:
          oneOf:
            - $ref: "#/components/schemas/TenantStockRef"
            - type: "null"
        transfer_uuid: { type: [string, "null"], format: uuid }
        unit_price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        unit_cost:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        currency: { type: string, example: TRY }
        staff:
          oneOf:
            - $ref: "#/components/schemas/TenantStockRef"
            - type: "null"
        reason: { type: string }
        note: { type: string }
        source: { type: string, example: manual, description: "`manual`, or `sale_return` for the return of a sale." }
        occurred_at: { type: string, format: date-time }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/TenantStockRef"
            - type: "null"
        created_at: { type: string, format: date-time }

    TenantStockMovementRequest:
      type: object
      required: [kind, branch_uuid, product_uuid]
      properties:
        kind: { type: string, enum: [receipt, sale, return, adjustment, transfer] }
        branch_uuid: { type: string, format: uuid, description: "The branch (source of a transfer)" }
        to_branch_uuid: { type: string, format: uuid, description: "Target branch of a transfer" }
        product_uuid: { type: string, format: uuid }
        variant_uuid: { type: string, format: uuid, description: "Required for products with variants" }
        quantity: { type: integer, minimum: 1, maximum: 100000, description: "Units (every kind except adjustment)" }
        counted_quantity: { type: integer, minimum: 0, maximum: 100000, description: "Counted stock (adjustment)" }
        unit_price: { $ref: "#/components/schemas/MoneyInput" }
        unit_cost: { $ref: "#/components/schemas/MoneyInput" }
        staff_uuid: { type: string, format: uuid, description: "Staff credited with a sale or return" }
        reason: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        occurred_at: { type: string, format: date-time, description: "Defaults to now; never in the future" }

    TenantStockMovementPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantStockMovement" }
