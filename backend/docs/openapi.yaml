      operationId: postTenantProduct
      summary: Create a product
      description: |
        `tenant.products.write`. Stock codes are unique across the products
        and variants of the organization, case-insensitive (`409`).
        `branch_uuids` adds offers at the catalog price; each branch must be
        inside the caller's scope (`branch_uuids.N` `not_found`). Stock
        starts at zero and changes only through stock movements.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantProductCreateRequest"
      responses:
        "201":
          description: Created product
          content:
