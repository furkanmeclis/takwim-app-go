          in: query
          description: "`created_at` or `updated_at`; prefix `-` for descending (default `-created_at`)."
          schema: { type: string }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated job statuses" }
        - { name: kind, in: query, schema: { type: string }, description: "Comma-separated job kinds (sms.send, payment.webhook …)" }
      responses:
        "200":
          description: Job page
