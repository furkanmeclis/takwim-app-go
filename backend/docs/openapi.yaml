      description: Marks notifications without an organization only (platform / account shell).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/test:
    post:
      tags: [Notifications]
      operationId: postNotificationsTest
      summary: Enqueue a test notification to self
      security:
        - bearerAuth: []
