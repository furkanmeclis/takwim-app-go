        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/platform/organizations/bulk:
    post:
      tags: [Platform]
      operationId: postPlatformOrganizationsBulk
      summary: Run a bulk action on organizations
      description: |
        `activate` (`platform.organizations.bulk.activate`) or `suspend`
        (`platform.organizations.bulk.suspend`), both reversible. Target
        `ids` or `query` (same filters as the list).
      security:
