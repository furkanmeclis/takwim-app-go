  /v1/tenant/cash/accounts/{uuid}/closings:
    get:
      tags: [Tenant]
      operationId: getTenantCashAccountClosings
      summary: Daily closings of a till
      description: Newest day first, reopened closings included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashAccountUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Closing page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashClosingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tenant]
      operationId: postTenantCashAccountClosing
      summary: Close a day of a till
      description: |
        `tenant.cash.close`. Only tills (`kind` = `cash`) are closed daily.
        The expected balance (opening + money in - money out of the day) is
        compared with `counted_amount`; the difference is posted as a
        `closing_difference` movement so the book follows the count. The
        day and every earlier day are then locked for movements. The day
        must be after the latest closed day (`409 already_closed`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashAccountUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashClosingCreateRequest"
      responses:
        "201":
          description: Closing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashClosing"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/cash/accounts/{uuid}/closings/preview:
    get:
