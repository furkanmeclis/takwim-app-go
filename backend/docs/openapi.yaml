        requested: { type: integer, format: int64 }
        active: { type: integer, format: int64 }
        in_service: { type: integer, format: int64 }
        completed: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        rejected: { type: integer, format: int64 }
        no_show: { type: integer, format: int64 }
        from_panel: { type: integer, format: int64 }
        from_online: { type: integer, format: int64 }
        from_embed: { type: integer, format: int64 }

    ReportConfirmations:
      type: object
      description: |
        Confirmation tasks of the visits in the range by the state the
        confirmation list shows; cancelled / flagged / unreachable are the
        outcomes of expired tasks, dropped means the visit was cancelled or
        moved first.
      required: [total, scheduled, pending, confirmed, declined, change_requested, cancelled, flagged, unreachable, expired, dropped]
      properties:
        total: { type: integer, format: int64 }
        scheduled: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        confirmed: { type: integer, format: int64 }
        declined: { type: integer, format: int64 }
        change_requested: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
        flagged: { type: integer, format: int64 }
        unreachable: { type: integer, format: int64 }
        expired: { type: integer, format: int64 }
        dropped: { type: integer, format: int64 }

    ReportMoney:
      type: object
      description: |
        The figures of one currency, each from its own record. business_share
        = revenue.net - staff_share; operational_result = revenue.net -
        product_cost - staff_share - expenses (other income, transfers,
        collections and staff payouts are outside it).
      required: [currency, revenue, collections, transfers, staff_share, staff_payments, business_share, product_cost,
        income, expenses, operational_result]
      properties:
        currency: { type: string }
        revenue: { $ref: "#/components/schemas/SalesRevenue" }
        collections: { $ref: "#/components/schemas/SalesCollections" }
        transfers: { type: string, description: "Money moved between accounts (not revenue)" }
        staff_share: { type: string, description: "Calculated staff shares of the sale lines" }
        staff_payments: { type: string, description: "Paid to staff (settles shares; not an expense)" }
        business_share: { type: string }
        product_cost: { type: string, description: "Unit cost of the stock movement, else the current product / variant cost" }
        income: { type: string, description: "Other income from the cash book (not revenue)" }
        expenses: { type: string, description: "Expenses from the cash book (staff payouts excluded)" }
        operational_result: { type: string }

    ReportStock:
      type: object
      description: |
        Units moved in the range (sold and transferred out as positive
        units, adjustments signed) and the stock now (not bound to the
        range); value at the current unit cost in the business currency.
      required: [received, sold, returned, adjusted, transferred_in, transferred_out, movements, on_hand, reserved, items,
        low_items, out_items, value, currency]
      properties:
        received: { type: integer, format: int64 }
        sold: { type: integer, format: int64 }
        returned: { type: integer, format: int64 }
        adjusted: { type: integer, format: int64 }
        transferred_in: { type: integer, format: int64 }
        transferred_out: { type: integer, format: int64 }
        movements: { type: integer, format: int64 }
        on_hand: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        items: { type: integer, format: int64 }
        low_items: { type: integer, format: int64 }
        out_items: { type: integer, format: int64 }
        value: { type: string }
        currency: { type: string }

    ReportFigures:
      type: object
      required: [reservations, confirmations, money]
      properties:
        reservations: { $ref: "#/components/schemas/ReportReservations" }
        confirmations: { $ref: "#/components/schemas/ReportConfirmations" }
        money:
          type: array
          description: One entry per currency; the business currency first and always present.
          items: { $ref: "#/components/schemas/ReportMoney" }

    ReportDay:
      allOf:
        - $ref: "#/components/schemas/ReportFigures"
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }

    ReportBranch:
      allOf:
        - $ref: "#/components/schemas/ReportFigures"
        - type: object
          required: [branch, stock]
          properties:
            branch:
              description: The branch; null on the head office row (records of accounts without a branch).
              type: [object, "null"]
              required: [uuid, code, name, is_active]
              properties:
                uuid: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                is_active: { type: boolean }
            stock: { $ref: "#/components/schemas/ReportStock" }

    Report:
      type: object
      required: [date_from, date_to, scope, totals, days, branches]
      properties:
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        scope:
          type: object
          required: [timezone, currency, branches, head_office, staff, omitted_for_staff]
          properties:
            timezone: { type: string }
            currency: { type: string }
            branches:
              type: array
              description: The branch filter as applied (only branches of this business)
              items: { type: string, format: uuid }
            head_office: { type: boolean, description: "Head office records are included" }
            staff:
              type: array
              description: The staff filter as applied (only staff of this business)
              items: { type: string, format: uuid }
            omitted_for_staff:
              type: array
              description: Money figures left out (zero) because a staff filter cannot narrow them
              items: { type: string, enum: [collections, transfers, income, expenses] }
        totals:
          allOf:
            - $ref: "#/components/schemas/ReportFigures"
            - type: object
              required: [stock]
              properties:
                stock: { $ref: "#/components/schemas/ReportStock" }
        days:
          type: array
          description: Days of the range with any record, oldest first
          items: { $ref: "#/components/schemas/ReportDay" }
        branches:
          type: array
          description: Branch comparison (every active branch in scope, then the head office row when it has records)
          items: { $ref: "#/components/schemas/ReportBranch" }

    EnvelopeReport:
      type: object
      required: [success, data, meta]
      properties:
