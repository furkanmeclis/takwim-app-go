  /v1/tenant/reservations/{uuid}/cancel:
    post:
      tags: [Tenant]
      operationId: postTenantReservationCancel
      summary: Cancel a reservation
      description: |
        A request or an active booking; the capacity is freed. `reason` (at most 32 characters) defaults to `cancelled`. A paid booking moves to `refund_pending`. Any other state is `409` detail `status` / `invalid_transition`;
        `expected_version` refuses a stale action (`expected_version` / `stale`).
        A member with only `tenant.reservations.own` acts on a visit shared with colleagues only when it serves every staffed line (`409` `lines` / `other_staff`).
      security:
        - bearerAuth: []
      parameters:
