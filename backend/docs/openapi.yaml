        logo_url: { type: string }
        status: { type: string, enum: [active, suspended] }
        access_ends_at: { type: [string, "null"], format: date-time }
        role:
          $ref: "#/components/schemas/MeOrganizationRole"
        permissions:
          type: array
          items: { type: string }

    Me:
