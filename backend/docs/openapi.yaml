        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/integrations:
    get:
      tags: [Tenant]
      operationId: getTenantIntegrations
      summary: List integration accounts
      description: "`tenant.integrations.read`. Credentials are never returned (masked hints only)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "`display_name` or `created_at`; prefix `-` for descending."
          schema: { type: string }
        - { name: status, in: query, schema: { type: string }, description: "active, disabled" }
        - { name: kind, in: query, schema: { type: string }, description: "payment, sms, whatsapp, email" }
        - { name: provider, in: query, schema: { type: string }, description: "Provider codes" }
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeIntegrationAccountPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantIntegration
      summary: Connect a provider account
      description: |
        `tenant.integrations.manage`. Stores the organization's own credentials sealed with the field
        cipher (purpose `integration.credentials`, bound to the organization and the account). One active
        account per kind (`409`). Use `/test` to check the connection.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, display_name, credentials]
              properties:
                kind: { type: string, enum: [payment, sms, whatsapp, email], description: "Defaults to the provider's kind." }
                provider: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: "Provider code of a registered adapter (`GET /v1/tenant/integrations/meta`); `log` = development provider (no network call)." }
                display_name: { type: string, maxLength: 120 }
                mode: { type: string, enum: [sandbox, live] }
                credentials:
                  type: object
                  additionalProperties: { type: string }
                  description: "Fields of the provider (`GET /v1/tenant/integrations/meta`); log (development only): `sender`. Never returned: answers carry masked hints only."
      responses:
        "201": { $ref: "#/components/responses/IntegrationAccountOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/integrations/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantIntegration
      summary: Integration account
      description: "`tenant.integrations.read`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200": { $ref: "#/components/responses/IntegrationAccountOK" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantIntegration
      summary: Rename, switch mode, rotate credentials
      description: "`tenant.integrations.manage`. Only the given credential keys are replaced; a rotation or mode change resets the last check."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: [string, "null"], maxLength: 120 }
                mode: { type: [string, "null"], enum: [sandbox, live, null] }
                credentials:
                  type: [object, "null"]
                  additionalProperties: { type: string }
      responses:
        "200": { $ref: "#/components/responses/IntegrationAccountOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/integrations/{uuid}/test:
    post:
      tags: [Tenant]
      operationId: postTenantIntegrationTest
      summary: Test the connection
      description: "`tenant.integrations.manage`. An authenticated provider call that moves no money; the result is stored on the account. A failure answers `422 INTEGRATION_CHECK_FAILED` with the account in `data`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200": { $ref: "#/components/responses/IntegrationAccountOK" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenant/integrations/{uuid}/disable:
    post:
      tags: [Tenant]
      operationId: postTenantIntegrationDisable
