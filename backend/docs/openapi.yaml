        source_uuid: { type: [string, "null"], format: uuid, description: "The reservation or the stock movement" }
        branch: { $ref: "#/components/schemas/SalesRef" }
        customer:
          oneOf:
            - $ref: "#/components/schemas/SalesRef"
            - type: "null"
        reservation:
          oneOf:
            - $ref: "#/components/schemas/SalesReservationRef"
            - type: "null"
        line_index: { type: [integer, "null"] }
        service_uuid: { type: [string, "null"], format: uuid }
        product_uuid: { type: [string, "null"], format: uuid }
        variant_uuid: { type: [string, "null"], format: uuid }
        staff:
          oneOf:
            - $ref: "#/components/schemas/SalesRef"
            - type: "null"
        description: { type: string }
        quantity: { type: integer }
        unit_price: { type: string, example: "100.00" }
        gross_amount: { type: string, example: "100.00", description: "Negative on a reversal" }
        discount_amount: { type: string, example: "0.00" }
        net_amount: { type: string, example: "100.00", description: "gross - discount; the revenue of sale_date" }
        currency: { type: string }
        sale_date: { type: string, format: date }
        generation: { type: integer, description: "0 for the first sale of the item, +1 per correction" }
        reverses_uuid: { type: [string, "null"], format: uuid }
        reversed_by_uuid: { type: [string, "null"], format: uuid }
        replaces_uuid: { type: [string, "null"], format: uuid }
        replaced_by_uuid: { type: [string, "null"], format: uuid }
        reason: { type: string }
        created_by:
          oneOf:
