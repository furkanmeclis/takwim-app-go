    post:
      tags: [Tenant]
      operationId: postTenantResourcesExport
      summary: Export resources
      description: |
        Queues an export of the organization's resources
        (`tenant.resources.export`). `query` honours `q`, `branch`, `kind`,
        `zone`, `is_active` and `show_online`. Poll `GET /v1/tenant/exports/{uuid}`.
