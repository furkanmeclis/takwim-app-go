          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/branches/{uuid}:
