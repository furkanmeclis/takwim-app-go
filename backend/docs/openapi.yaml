    MoneyAmount:
      type: string
      description: Decimal amount with two places, in the organization's currency.
      pattern: "^[0-9]+\\.[0-9]{2}$"
      example: "450.00"

    MoneyInput:
      description: Non-negative amount with at most two decimals, as a string or a number.
      oneOf:
        - type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        - type: number
          minimum: 0
      example: "450.00"

    ServiceCategory:
      type: object
      required: [uuid, name, description, sort_order, services_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        services_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ServiceCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }

    ServiceCategoryPatchRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }

    ServiceCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceCategory" }

    TenantServiceOffer:
      type: object
      description: |
        A branch offering the service. `price` / `duration_minutes` are the
        branch overrides (null = catalog value); `effective_*` are what the
        branch charges and books.
      required: [branch_uuid, branch_name, branch_code, price, duration_minutes, effective_price, effective_duration_minutes, is_active, editable]
      properties:
        branch_uuid: { type: string, format: uuid }
        branch_name: { type: string }
        branch_code: { type: string }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        duration_minutes: { type: [integer, "null"] }
        effective_price: { $ref: "#/components/schemas/MoneyAmount" }
        effective_duration_minutes: { type: integer }
        is_active: { type: boolean }
        editable: { type: boolean, description: "False for branches outside the caller's scope" }

    TenantServiceStaff:
      type: object
      required: [staff_uuid, name, title, color, is_active, price, duration_minutes]
      properties:
        staff_uuid: { type: string, format: uuid }
        name: { type: string }
        title: { type: string }
        color: { type: string }
        is_active: { type: boolean }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        duration_minutes: { type: [integer, "null"] }

    TenantServiceCategoryRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    TenantService:
      type: object
      description: |
        A service of the business catalog (TEC-894). `buffer_*` minutes are
        held around a booking; `resource_kinds` are the kinds a booking needs
        (one of each). `image_url` is the API-owned public cover URL.
        `group_capacity` makes the service a group class (TEC-904): every
        start is one session with that many seats, null = individual.
      required: [uuid, category, name, description, duration_minutes, buffer_before_minutes, buffer_after_minutes, price, currency, payment_mode, staff_mode, resource_kinds, group_capacity, show_online, is_active, sort_order, image_url, offers, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        category:
          oneOf:
            - $ref: "#/components/schemas/TenantServiceCategoryRef"
            - type: "null"
        name: { type: string }
        description: { type: string }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480 }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string, example: TRY }
        payment_mode: { type: string, enum: [on_site, online, both] }
        staff_mode: { type: string, enum: [required, optional, none] }
        resource_kinds:
          type: array
          items: { type: string, enum: [chair, table, area, room, device, bay] }
        group_capacity: { type: [integer, "null"], minimum: 2, maximum: 1000, description: Seats of a group class session; null = individual. }
        show_online: { type: boolean }
        is_active: { type: boolean }
        sort_order: { type: integer }
        image_url: { type: [string, "null"] }
        offers:
          type: array
          items: { $ref: "#/components/schemas/TenantServiceOffer" }
        staff:
          description: Detail only.
          type: array
          items: { $ref: "#/components/schemas/TenantServiceStaff" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantServiceCreateRequest:
      type: object
      required: [name, duration_minutes, price]
      properties:
        category_uuid: { type: [string, "null"], format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        price: { $ref: "#/components/schemas/MoneyInput" }
        payment_mode: { type: string, enum: [on_site, online, both], default: on_site }
        staff_mode: { type: string, enum: [required, optional, none] }
        resource_kinds:
          type: array
          items: { type: string, enum: [chair, table, area, room, device, bay] }
          description: Default follows the sector (a table for restaurants, a wash bay for car washes, none otherwise).
        group_capacity: { type: [integer, "null"], minimum: 2, maximum: 1000, description: Seats of a group class session (gym); null = individual. }
        show_online: { type: boolean, default: true }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }
        branch_uuids:
          type: array
          items: { type: string, format: uuid }

    TenantServicePatchRequest:
      type: object
      properties:
        category_uuid: { type: [string, "null"], format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480 }
        price: { $ref: "#/components/schemas/MoneyInput" }
        payment_mode: { type: string, enum: [on_site, online, both] }
        staff_mode: { type: string, enum: [required, optional, none] }
