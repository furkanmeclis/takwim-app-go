      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantStockMovementResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OrganizationCompanySettings:
      type: object
      required: [legal_name, tax_number, tax_office, address, phone, email, website]
      properties:
        legal_name: { type: string, maxLength: 255 }
        tax_number:
          type: string
          description: Checksum-valid VKN (10 digits) or TCKN (11 digits); empty = not set
          example: "4540536920"
        tax_office: { type: string, maxLength: 128 }
        address: { type: string, maxLength: 1000 }
        phone: { type: string }
        email: { type: string }
        website: { type: string, description: "http(s) address; empty = not set", maxLength: 255 }

    OrganizationReservationSettings:
      type: object
      description: Business-wide default booking rules; null = not configured.
      required:
        - approval_mode
        - staff_review_window_minutes
        - payment_hold_minutes
        - min_lead_minutes
        - max_advance_days
        - cancel_cutoff_minutes
        - change_cutoff_minutes
        - slot_step_minutes
        - max_open_per_customer
        - max_online_per_day
      properties:
        approval_mode:
          type: string
          enum: ["", auto, staff]
          description: "`auto` accepts immediately, `staff` waits for an employee within the review window; empty = not configured"
        staff_review_window_minutes: { type: [integer, "null"], minimum: 1, maximum: 10080 }
        payment_hold_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 10080
          description: How long a booking waiting for online payment holds its capacity
        min_lead_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 43200
          description: Earliest bookable start, in minutes from now
        max_advance_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 730
          description: Latest bookable day, in days from today
        cancel_cutoff_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 43200
          description: Customer cancellation allowed until this many minutes before the start; null = no limit
        change_cutoff_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 43200
          description: Customer change requests allowed until this many minutes before the start; null = no limit
        slot_step_minutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 240
          multipleOf: 5
          description: >-
            Distance between the starts offered online (TEC-905). Online
            availability uses it whatever the request asks and online starts
            off the grid are refused; null = the client's step.
        max_open_per_customer:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: >-
            Most open bookings (waiting, booked or in service, not over) a
            customer may hold when booking online (`customer` / `open_limit`);
            panel bookings are not limited. null = no limit.
        max_online_per_day:
          type: [integer, "null"]
          minimum: 1
          maximum: 10000
          description: >-
            Most online bookings (page, widget, API) a branch takes per local
            day; cancelled and rejected ones do not count (`starts_at` /
            `daily_limit`). null = no limit.

    OrganizationBookingField:
      type: object
      description: >-
        A booking form question (TEC-905). The answer is stored in the
        reservation's `custom_fields` under `key`; the reservation keeps the
        question as answered.
      required: [key, label, type, options, required, online, panel, help]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: Stable answer key; empty on save = derived from the label
        label: { type: string, minLength: 1, maxLength: 80 }
        type:
          type: string
          enum: [text, number, select, checkbox]
        options:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
          description: The choices of a select (2 or more, unique); empty otherwise
        required:
          type: boolean
          description: Must be answered where asked; a required checkbox must be ticked
        online: { type: boolean, description: "Asked on the booking page, the widget and the public API" }
        panel: { type: boolean, description: "Asked in the panel booking form" }
        help: { type: string, maxLength: 200 }

    OrganizationBookingSettings:
      type: object
      description: >-
        Fine-tuning of the sector's booking flow (TEC-905): optional steps the
        customer screens skip and the business's own questions. Capacity and
        availability checks always stay.
      required: [hidden_steps, fields]
      properties:
        hidden_steps:
          type: array
          items:
            type: string
            enum: [staff, products, area]
          description: >-
            `staff`: the engine assigns a free person (a picked one is
            refused); `products`: no products with a booking; `area`: the
            engine picks any table (a zone is refused).
        fields:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/OrganizationBookingField" }

    OrganizationPaymentSettings:
      type: object
      description: At least one option is on. Online payment is the full amount.
      required: [pay_at_venue, pay_online]
      properties:
        pay_at_venue: { type: boolean }
        pay_online: { type: boolean }

    OrganizationPolicySettings:
      type: object
      required: [cancellation, no_show, change]
      properties:
        cancellation: { type: string, maxLength: 5000 }
        no_show: { type: string, maxLength: 5000 }
        change: { type: string, maxLength: 5000 }

    OrganizationSalesChannel:
      type: object
      required: [code, is_active]
      properties:
        code:
          type: string
          enum: [web, widget, api]
          description: "`web` = takwim.link page, `widget` = embedded booking, `api` = public booking API"
        is_active: { type: boolean }

    OrganizationEmbedSettings:
      type: object
      required: [allowed_origins]
      properties:
        allowed_origins:
          type: array
          maxItems: 20
          description: "Sites allowed to embed the booking screen (TEC-908). Saved as origins: `example.com` becomes `https://example.com`, `https://*.example.com` allows every subdomain, http only for localhost; duplicates are dropped. An invalid entry answers `embed.allowed_origins.{i}` / `invalid`, more than 20 `too_many`."
          items: { type: string, example: "https://www.example.com" }

    OrganizationInvoiceItemMapping:
      type: object
      required: [item_type, account_code, vat_rate, description]
      properties:
        item_type:
          type: string
          enum: [service, product, package]
        account_code: { type: string }
        vat_rate: { type: string, description: "Percentage; empty = use the default VAT rate" }
        description: { type: string }

    OrganizationTaxSettings:
      type: object
      required: [default_vat_rate, invoice_item_mappings]
      properties:
        default_vat_rate:
          type: string
          description: Percentage; no legal rate is built in, so it stays empty until set
        invoice_item_mappings:
          type: array
          items: { $ref: "#/components/schemas/OrganizationInvoiceItemMapping" }

    OrganizationSettings:
      type: object
      required: [company, reservation, payment, policies, sales_channels, embed, tax, booking]
      properties:
        company: { $ref: "#/components/schemas/OrganizationCompanySettings" }
        reservation: { $ref: "#/components/schemas/OrganizationReservationSettings" }
        payment: { $ref: "#/components/schemas/OrganizationPaymentSettings" }
        policies: { $ref: "#/components/schemas/OrganizationPolicySettings" }
        sales_channels:
          type: array
