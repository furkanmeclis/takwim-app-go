        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tenant]
      operationId: postTenantCashAccountMovement
      summary: Record a manual money in / out
      description: |
        `tenant.cash.write`. `in` is a deposit, `out` a withdrawal. The date
        defaults to today (business time zone), is not before the opening
        date, not in the future and not on a closed day (`409 day_closed`).
        A till never goes below zero (`409 insufficient_funds`); bank and
        online accounts may.
      security:
        - bearerAuth: []
