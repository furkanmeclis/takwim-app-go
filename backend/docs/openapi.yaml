  /v1/tenant/cash/movements:
    get:
      tags: [Tenant]
      operationId: getTenantCashMovements
      summary: The cash book across accounts
      description: |
        Movements of the accounts in the caller's scope (`tenant.cash.read`).
        `q` searches the description and the account name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `movement_date`, `amount`, `kind`, `created_at`; prefix `-` for descending. Default: newest first."
          schema: { type: string }
        - name: account
          in: query
          description: "Account uuids; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "Movement kinds; comma-separate or repeat"
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Movement page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashMovementPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/cash/movements/export:
    post:
      tags: [Tenant]
      operationId: postTenantCashMovementsExport
      summary: Export cash movements
      description: |
        Queues an export of the cash book (`tenant.cash.export`). `query`
        honours `q`, `account`, `kind`, `direction`, `date_from` and
        `date_to`. Poll `GET /v1/tenant/exports/{uuid}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/cash/movements/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantCashMovement
      summary: Get a cash movement
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashMovementUUID"
      responses:
        "200":
          description: Movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashMovement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/cash/movements/{uuid}/reverse:
    post:
      tags: [Tenant]
      operationId: postTenantCashMovementReverse
      summary: Reverse a manual movement
      description: |
        `tenant.cash.write` and a reason. Posts the exact opposite movement
        dated today (both legs of a transfer). Movements are never edited
        or deleted. A movement is reversed once (`409 already_reversed`);
        reversals, closing differences and movements of other modules
        (payments, sales …) are not reversed here (`409 not_reversible`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/CashMovementUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashReasonRequest"
      responses:
        "201":
          description: The reversal movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashMovementList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/cash/transfers:
    post:
      tags: [Tenant]
      operationId: postTenantCashTransfer
      summary: Transfer money between two accounts
      description: |
        `tenant.cash.write`. Writes `transfer_out` on the source and
        `transfer_in` on the target in one transaction with a shared
        `transfer_group`; a transfer is not revenue. Both accounts must be
        active, in the caller's scope (`not_found` otherwise) and in the
        same currency; the source till cannot go below zero. A provider
        payout (online account to bank) is a transfer too.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransferRequest"
      responses:
        "201":
          description: Both legs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashTransfer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/cash/daily-summary:
    get:
      tags: [Tenant]
      operationId: getTenantCashDailySummary
      summary: Daily cash summary (günlük kapanış özeti)
      description: |
        Every account of the caller's scope on one day: opening balance,
        money in / out, transfers in / out (listed apart, not revenue),
        closing difference, closing balance and whether the day is closed;
        plus totals per currency.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: date
          in: query
          description: Business day (default today)
          schema: { type: string, format: date }
        - name: branch
          in: query
          description: "Branch uuids and / or `head_office`; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCashDailySummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/tenant/sales/lines/meta:
    get:
      tags: [Tenant]
      operationId: getTenantSaleLinesMeta
      summary: Sale line list metadata
      description: Table contract of `GET /v1/tenant/sales/lines` (`tenant.finance.read`, `finance` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/sales/lines:
    get:
      tags: [Tenant]
      operationId: getTenantSaleLines
      summary: Sale lines (revenue)
      description: |
        Services delivered (a completed visit, one line per reservation line)
        and products handed over (a stock sale), with their reversals, in the
        caller's branch scope (`tenant.finance.read`). The net amounts of a
        day are its revenue. `q` searches the description, the customer and
        the staff member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `sale_date`, `net_amount`, `kind`, `created_at`; prefix `-` for descending. Default: newest first."
          schema: { type: string }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "`sale` and / or `reversal`; comma-separate or repeat"
          schema: { type: string }
        - name: item_type
          in: query
          description: "`service` and / or `product`; comma-separate or repeat"
          schema: { type: string }
        - name: reservation
          in: query
          schema: { type: string, format: uuid }
        - name: customer
          in: query
          schema: { type: string, format: uuid }
        - name: staff
          in: query
          description: "Staff uuids; comma-separate or repeat"
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Sale line page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSaleLinePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/sales/lines/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantSaleLine
      summary: One sale line
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/SaleLineUUID"
      responses:
        "200":
          description: Sale line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSaleLine"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/sales/lines/{uuid}/reverse:
    post:
      tags: [Tenant]
      operationId: postTenantSaleLineReverse
      summary: Reverse a sale line
      description: |
        `tenant.finance.write` and a reason. Writes the exact negative of a
        live sale line dated today and reverses its ledger debit; the line
        itself stays. A line is reversed once (`409 already_reversed`); a
        reversal is not reversed (`409 not_reversible`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/SaleLineUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesReasonRequest"
      responses:
        "201":
          description: The reversal line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSaleLine"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/sales/lines/{uuid}/correct:
    post:
      tags: [Tenant]
      operationId: postTenantSaleLineCorrect
      summary: Correct a sale line
      description: |
        `tenant.finance.write` and a reason; a new `unit_price` also needs
        `tenant.price.override`, a new `discount_amount` `tenant.discount.apply`.
        The live line is reversed and a replacement for the same item is
        written, both dated today, with their ledger postings: earlier days
        keep their figures. `409 nothing_changed` when the values are the same.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/SaleLineUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleLineCorrectRequest"
      responses:
        "201":
          description: The reversal and the replacement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSaleLineCorrection"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/sales/entries/meta:
    get:
      tags: [Tenant]
      operationId: getTenantLedgerEntriesMeta
      summary: Ledger list metadata
      description: Table contract of `GET /v1/tenant/sales/entries` (`tenant.finance.read`, `finance` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/sales/entries:
    get:
      tags: [Tenant]
      operationId: getTenantLedgerEntries
      summary: Customer ledger
      description: |
        What customers were charged (`sale`, debit), paid (`collection`,
        credit) and paid back (`refund`, debit), with reversals, in the
        caller's branch scope (`tenant.finance.read`). `q` searches the
        description and the customer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `entry_date`, `amount`, `kind`, `created_at`; prefix `-` for descending. Default: newest first."
          schema: { type: string }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "Entry kinds; comma-separate or repeat"
          schema: { type: string }
        - name: reservation
          in: query
          schema: { type: string, format: uuid }
        - name: customer
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Ledger page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLedgerEntryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/sales/entries/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantLedgerEntry
      summary: One ledger entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/LedgerEntryUUID"
      responses:
        "200":
          description: Ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLedgerEntry"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/sales/entries/{uuid}/reverse:
    post:
      tags: [Tenant]
      operationId: postTenantLedgerEntryReverse
      summary: Reverse a collection or refund
      description: |
        `tenant.finance.write` and a reason. Posts the opposite entry and the
        reversal of its cash movement, both dated today. A sale entry is
        reversed through its sale line (`409 reverse_sale_line`); a
        collection with live refunds only after them (`409 has_refunds`);
        an entry is reversed once (`409 already_reversed`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/LedgerEntryUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesReasonRequest"
      responses:
        "201":
          description: The reversal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLedgerEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/sales/summary:
    get:
      tags: [Tenant]
      operationId: getTenantSalesSummary
      summary: Revenue, collections, transfers and staff payouts
      description: |
        The figures of a date range (default today; at most 366 days) per
        currency and per day, each from its own source (A20): revenue from
        the sale lines, collections and refunds from the ledger, transfers
        between accounts and staff payouts from the cash book. A prepayment
        is a collection on the day it was taken; the service is revenue on
        the day it was delivered.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSalesSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/sales/reservations/{uuid}/balance:
    get:
      tags: [Tenant]
      operationId: getTenantReservationBalance
      summary: What a visit costs and what was paid
      description: |
        Before completion the expected amount is the booked total of a
        standing booking (0 once cancelled, rejected or not attended);
        afterwards the net of its live sale lines. Paid = collected -
        refunded; `remaining` is still owed, `credit` paid beyond it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: uuid
          in: path
          required: true
          description: Reservation UUID.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reservation balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReservationBalance"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/sales/customers/{uuid}/balance:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerBalance
      summary: Ledger balance of a customer
      description: Charged, collected, refunded, paid and balance per currency inside the caller's branch scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: uuid
          in: path
          required: true
          description: Customer UUID.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Customer balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerBalance"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/finance/categories:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceCategories
      summary: Income and expense categories
      description: |
        `tenant.finance.read`. The defaults seeded for every business
        (`is_system`, with a `code`) and the business's own categories,
        with the number of records using each.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `sort_order`, `name`, `kind`, `status`, `created_at`; prefix `-` for descending. Default: kind, sort order, name."
          schema: { type: string }
        - name: kind
          in: query
          description: "`income`, `expense`; comma-separate or repeat"
          schema: { type: string }
        - name: status
          in: query
          description: "`active`, `archived`; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Category page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceCategoryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantFinanceCategory
      summary: Create a category
      description: |
        `tenant.finance.write` and every branch. Names are unique per kind
        (`409 name.taken`, case-insensitive).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryCreateRequest"
      responses:
        "201":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceCategory"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/categories/{categoryUuid}:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceCategory
      summary: Get a category
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceCategoryUUID"
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceCategory"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantFinanceCategory
      summary: Rename, reorder or archive a category
      description: |
        `tenant.finance.write` and every branch. The kind is fixed. An
        archived category is no longer offered for new records; its records
        keep it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceCategoryUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceCategoryPatchRequest"
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceCategory"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantFinanceCategory
      summary: Delete an unused category
      description: |
        `tenant.finance.write` and every branch. Default categories and
        categories with records are archived instead (`409 in_use`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceCategoryUUID"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/entries/meta:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntriesMeta
      summary: Income / expense list metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/finance/entries/facets:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntriesFacets
      summary: Income / expense faceted filter options
      description: |
        Categories (with `sale_service` / `sale_product` for the sale rows),
        branches (with `head_office` for business-wide records) and staff
        in use inside the caller's scope, with counts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/finance/entries:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntries
      summary: Income and expenses
      description: |
        `tenant.finance.read`. The business's own records (`source=manual`:
        income, expenses, their reversals and corrections) and the sale
        lines (`source=sale`), which appear here as income automatically.
        Branch-limited members see their branches only; business-wide
        records need every branch. `q` searches the description, category
        and staff names.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `entry_date`, `amount`, `created_at`; prefix `-` for descending. Default: `-entry_date`."
          schema: { type: string }
        - name: source
          in: query
          description: "`manual`, `sale`; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "`income`, `expense`; comma-separate or repeat"
          schema: { type: string }
        - name: category
          in: query
          description: "Category uuids, `sale_service`, `sale_product`; comma-separate or repeat"
          schema: { type: string }
        - name: branch
          in: query
          description: "Branch uuids and / or `head_office`; comma-separate or repeat"
          schema: { type: string }
        - name: staff
          in: query
          description: "Staff uuids; comma-separate or repeat"
          schema: { type: string }
        - name: account
          in: query
          description: "Cash account uuids; comma-separate or repeat"
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Row page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceLedgerPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantFinanceEntry
      summary: Record income or an expense
      description: |
        `tenant.finance.write`. Money in or out outside sales: the amount
        enters or leaves the cash account in the same transaction (an
        `income` / `expense` movement of the cash book). The account must
        be in the caller's scope and belong to the record's branch or be
        business-wide; without `branch_uuid` the record takes the account's
        branch (a business-wide account makes a business-wide record, which
        needs every branch). The day must be open (`409
        entry_date.day_closed`); a till cannot go below zero. The same
        `idempotency_key` with the same body answers the first record; with
        another body `409 idempotency_key.reused`. Staff payouts are not
        recorded here (they come from staff shares).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryCreateRequest"
      responses:
        "201":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/entries/export:
    post:
      tags: [Tenant]
      operationId: postTenantFinanceEntriesExport
      summary: Export income and expenses
      description: |
        Queues an export of the list (`tenant.finance.read` and
        `tenant.report.export`). `query` honours `q`, `source`, `kind`,
        `category`, `branch`, `staff`, `account`, `date_from` and
        `date_to`. Poll `GET /v1/tenant/exports/{uuid}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/finance/entries/{entryUuid}:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntry
      summary: Get an income / expense record
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantFinanceEntry
      summary: Reclassify a record
      description: |
        `tenant.finance.write`. Changes the category (same kind), the
        description and the staff member of a live record; the change is in
        the activity log. Amount, date, account and branch change through a
        correction only. Reversals and reversed records are not edited
        (`409`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryPatchRequest"
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/entries/{entryUuid}/reverse:
    post:
      tags: [Tenant]
      operationId: postTenantFinanceEntryReverse
      summary: Reverse a record
      description: |
        `tenant.finance.write` and a reason. Writes the exact negative of
        the record dated today and reverses its cash movement; the record
        stays and links to the reversal. Records are never deleted. A
        record is reversed once (`409 already_reversed`); a reversal is not
        reversed (`409 not_reversible`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashReasonRequest"
      responses:
        "201":
          description: The reversal record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/entries/{entryUuid}/correct:
    post:
      tags: [Tenant]
      operationId: postTenantFinanceEntryCorrect
      summary: Correct a record
      description: |
        `tenant.finance.write` and a reason. Reverses the record (today)
        and writes its replacement with the given values in one
        transaction; missing values are copied (the date too) and the
        document moves along. Both stay in the history, linked
        (`replaces_uuid` / `replaced_by_uuid`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryCorrectRequest"
      responses:
        "201":
          description: The replacement record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/finance/entries/{entryUuid}/activity:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntryActivity
      summary: Activity of a record
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBranchActivityPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/finance/entries/{entryUuid}/document:
    put:
      tags: [Tenant]
      operationId: putTenantFinanceEntryDocument
      summary: Attach a document (receipt, invoice)
      description: |
        `tenant.finance.write`. Multipart `file`: PDF, JPEG, PNG or WebP
        (sniffed from the content) up to 10 MiB. Replaces the previous
        document of the record; the stored object is kept. Stored under
        the organization's prefix; read it through `GET …/document`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Storage is not configured }
    get:
      tags: [Tenant]
      operationId: getTenantFinanceEntryDocument
      summary: Download the document of a record
      description: "`tenant.finance.read` and `tenant.document.download`. Streams the file (`404` without one)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantFinanceEntryDocument
      summary: Detach the document of a record
      description: "`tenant.finance.write`. The record no longer shows the document; the stored object is kept."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/FinanceEntryUUID"
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/finance/summary:
    get:
      tags: [Tenant]
      operationId: getTenantFinanceSummary
      summary: Income / expense summary of a period
      description: |
        Per currency, kept apart: `revenue` (net of the sale lines),
        `income` and `expenses` recorded here (reversals netted) and
        `staff_payments` from the cash book. `net = revenue + income -
        expenses`; staff payouts, transfers and product costs are outside
        it. Plus the total per category. Default period: the first of the
        month to today (at most 366 days).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reports/summary:
    get:
      tags: [Tenant]
      operationId: getTenantReportSummary
      summary: Business report of a period
      description: |
        Reservations (by status and channel) and confirmation results of the
        visits that start in the range, revenue (sale lines), collections
        and refunds (ledger), transfers between accounts, other income and
        expenses (cash book), staff share and staff payouts, product cost,
        the business share (revenue - staff share) and the operating result
        (revenue - product cost - staff share - expenses), and the stock.
        Each figure comes from its own record, so revenue, collections,
        transfers and staff payouts never mix (A20). Returned in total, per
        day (business day; visits by the local day in the branch time zone)
        and per branch, plus a head office row for the records of accounts
        without a branch. The range defaults to today and is at most 366
        days. Needs the reports module and tenant.finance.read; the caller's
        branch scope (and X-Branch) limits every figure, and a member
        without every branch never sees head office records.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/ReportDateFrom"
        - $ref: "#/components/parameters/ReportDateTo"
        - $ref: "#/components/parameters/ReportBranch"
        - $ref: "#/components/parameters/ReportStaff"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reports/export:
    get:
      tags: [Tenant]
      operationId: exportTenantReport
      summary: Report as CSV
      description: |
        The same report as CSV (UTF-8 with BOM, comma separated): one row per
        day and a total row (section=days, default) or one row per branch,
        the head office row and a total row (section=branches). Amounts use
        a dot as the decimal separator; with several currencies there is one
        row per currency and the counts sit on the first one. Column titles
        follow locale (tr default). Needs tenant.report.export as well; the
        export is written to the activity log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/ReportDateFrom"
        - $ref: "#/components/parameters/ReportDateTo"
        - $ref: "#/components/parameters/ReportBranch"
        - $ref: "#/components/parameters/ReportStaff"
        - name: section
          in: query
          schema: { type: string, enum: [days, branches], default: days }
        - name: locale
          in: query
          schema: { type: string, enum: [tr, en], default: tr }
      responses:
        "200":
          description: CSV file
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "attachment; filename=rapor_{section}_{from}_{to}.csv"
          content:
            text/csv:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/staff-shares/me:
    get:
      tags: [Tenant]
      operationId: getTenantMyStaffShares
      summary: My shares
      description: |
        The signed-in member's own shares (`tenant.earnings.read` or
        `tenant.earnings.own`, `staff_shares` module): today and the period
        (default this month), with the balance (earned, payable, paid,
        remaining) over every branch. `404` when the member has no staff
        record.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Own shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMyStaffShares"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff-shares/summary:
    get:
      tags: [Tenant]
      operationId: getTenantStaffSharesSummary
      summary: Staff shares per staff member and branch
      description: |
        Per staff member and currency for `date_from`–`date_to` (default
        this month, at most 366 days) inside the caller's branch scope:
        sales (net, after discounts), share, pending (waiting for the
        visit's collection), payable, business share (sales - share, before
        costs and expenses), paid in the period; and each person's balance
        over every branch and day. Per branch: revenue, shares and business
        share, with totals. A member with `tenant.earnings.own` only gets
        its own row and no branch figures.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
        - name: staff
          in: query
          description: "Staff uuids; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffSharesSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff-shares/rules:
    get:
      tags: [Tenant]
      operationId: getTenantStaffShareRules
      summary: Staff share rules
      description: The agreed rates (`tenant.earnings.read`; with `tenant.earnings.own` only the caller's own).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: staff
          in: query
          description: "Staff uuids; comma-separate or repeat"
          schema: { type: string }
        - name: item_type
          in: query
          description: "`service` and / or `product`"
          schema: { type: string }
      responses:
        "200":
          description: Rule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffShareRulePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantStaffShareRule
      summary: Add a staff share rule
      description: |
        `tenant.earnings.manage`, every branch. The default rate of an item
        type (`service`, `product`: the product commission is kept apart)
        or, with `service_uuid`, the rate of one service. A percentage of the
        line's net amount or a fixed amount per unit, from `valid_from`
        (default today). A new rate is a new rule with a later
        `valid_from`; shares calculated before keep their values. `409
        rule_taken` for the same staff member, item and day.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffShareRuleInput"
      responses:
        "201":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffShareRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/staff-shares/rules/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantStaffShareRule
      summary: A staff share rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/StaffShareRuleUUID"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffShareRule"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantStaffShareRule
      summary: Change a staff share rule
      description: |
        `tenant.earnings.manage`: basis, rate, fixed amount, start day or
        note (the staff member, item type and service stay). Shares
        calculated before keep their values.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/StaffShareRuleUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffShareRuleInput"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffShareRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantStaffShareRule
      summary: Remove a staff share rule
      description: "`tenant.earnings.manage`. Shares calculated with the rule keep their values."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/StaffShareRuleUUID"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff-shares/lines/meta:
    get:
      tags: [Tenant]
      operationId: getTenantStaffShareLinesMeta
      summary: Staff share list metadata
      description: Table contract of `GET /v1/tenant/staff-shares/lines`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff-shares/lines:
    get:
      tags: [Tenant]
      operationId: getTenantStaffShareLines
      summary: Staff shares
      description: |
        The share of every sale line with a staff member (and the reversal
        of the share of a reversed line), with the rule, rate and base of
        the moment, inside the caller's branch scope; with
        `tenant.earnings.own` only the caller's own. `status`: `pending`
        (the visit is not paid in full yet) or `payable`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `share_date`, `share_amount`, `base_amount`, `created_at`; prefix `-` for descending."
          schema: { type: string }
        - name: branch
          in: query
          schema: { type: string }
        - name: staff
          in: query
          schema: { type: string }
        - name: kind
          in: query
          description: "`share` and / or `reversal`"
          schema: { type: string }
        - name: item_type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, payable] }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffShareLinePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff-shares/payouts/meta:
    get:
      tags: [Tenant]
      operationId: getTenantStaffSharePayoutsMeta
      summary: Share payout list metadata
      description: Table contract of `GET /v1/tenant/staff-shares/payouts`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff-shares/payouts:
    get:
      tags: [Tenant]
      operationId: getTenantStaffSharePayouts
      summary: Share payouts
      description: Payouts and their reversals from the accounts inside the caller's branch scope; with `tenant.earnings.own` the caller's own.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `payout_date`, `amount`, `created_at`; prefix `-` for descending."
          schema: { type: string }
        - name: branch
          in: query
          schema: { type: string }
        - name: staff
          in: query
          schema: { type: string }
        - name: kind
          in: query
          description: "`payout` and / or `reversal`"
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Payout page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffSharePayoutPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantStaffSharePayout
      summary: Pay a staff member's share
      description: |
        `tenant.earnings.pay`. A `staff_payment` movement out of the cash or
        bank account and the payout, in one transaction; not an expense.
        The amount may not exceed what is payable now (`409
        payout_too_large`). A request with an `idempotency_key` used before
        returns the first payout (`409 reused` with another amount or staff
        member). The cash book rules apply (closed day, till floor).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSharePayoutInput"
      responses:
        "201":
          description: The payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffSharePayout"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/staff-shares/payouts/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantStaffSharePayout
      summary: A share payout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/StaffSharePayoutUUID"
      responses:
        "200":
          description: The payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffSharePayout"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff-shares/payouts/{uuid}/reverse:
    post:
      tags: [Tenant]
      operationId: postTenantStaffSharePayoutReverse
      summary: Reverse a share payout
      description: "`tenant.earnings.pay` and a reason. Reverses the cash movement (dated today) and writes a reversal payout; the share is payable again."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/StaffSharePayoutUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesReasonRequest"
      responses:
        "201":
          description: The reversal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffSharePayout"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/resources/meta:
    get:
      tags: [Tenant]
      operationId: getTenantResourcesMeta
      summary: Resource list metadata
      description: Table contract of `GET /v1/tenant/resources` (`tenant.resources.read`, `resources` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/resources/facets:
    get:
      tags: [Tenant]
      operationId: getTenantResourcesFacets
      summary: Resource faceted filter options
      description: Branches, kinds and zones (with counts) for the faceted filters, inside the caller's branch scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantResourceFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/resources:
    get:
      tags: [Tenant]
      operationId: getTenantResources
      summary: List resources of the organization
      description: |
        Bookable resources (chair, table, area, room, device, bay) of the
        `X-Organization` organization (`tenant.resources.read`). `q` searches
        name, zone, description and the branch name. A member with
        `branch_scope` = `selected` only sees resources of its branches.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `kind`, `zone`, `capacity`, `sort_order`, `is_active`, `created_at`, `updated_at`; prefix `-` for descending. Default: branch, `sort_order`, name."
          schema: { type: string, example: name }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat (see `/v1/tenant/resources/facets`)"
          schema: { type: string }
        - name: kind
          in: query
          description: "Kinds; comma-separate or repeat"
          schema: { type: string }
        - name: zone
          in: query
          description: "Zones; comma-separate or repeat"
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: show_online
          in: query
          schema: { type: boolean }
