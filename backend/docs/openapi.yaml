        kind: { type: string, enum: [chair, table, area, room, device, bay] }
        name: { type: string }
        zone: { type: string, description: "Free-text section (iç salon, teras …); empty when none" }
        description: { type: string }
        min_capacity: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1, maximum: 1000 }
        combinable: { type: boolean }
        show_online: { type: boolean }
        is_active: { type: boolean }
        sort_order: { type: integer }
        working_hours:
          oneOf:
            - $ref: "#/components/schemas/WeeklyHours"
