        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePreferences:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/NotificationPreferences" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeResourceMeta:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ResourceMeta" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeUnreadCount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/UnreadCount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    HealthzResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]

    BulkTarget:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [ids, query]
        ids:
          type: array
          items: { type: string, format: uuid }
        query:
          type: object
          additionalProperties: { type: string }

    BulkExecuteRequest:
      type: object
      required: [action, target]
      properties:
        action: { type: string }
        target: { $ref: "#/components/schemas/BulkTarget" }
        locale: { type: string, enum: [tr, en] }

    BulkSummary:
      type: object
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }

    BulkJob:
      type: object
      required: [uuid, resource, action, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        resource: { type: string }
        action: { type: string }
        status: { type: string }
        target: { $ref: "#/components/schemas/BulkTarget" }
        summary: { $ref: "#/components/schemas/BulkSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    EnvelopeBulkJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BulkJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkSyncResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            sync: { type: boolean }
            summary: { $ref: "#/components/schemas/BulkSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkJobPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BulkJob" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ReadyzResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          examples: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
          properties:
            postgres:
              type: string
              examples: [ok, down]
            redis:
              type: string
              examples: [ok, down]
