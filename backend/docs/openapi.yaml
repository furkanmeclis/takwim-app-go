        ready_for_online_sales: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/OrganizationSettingsActor"
            - type: "null"

    OrganizationSettingsVersionPage:
      type: object
