        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/invitations/{uuid}/resend:
    post:
      tags: [Tenant]
      operationId: postTenantInvitationResend
      summary: Resend an invitation
      description: "`tenant.members.write`. New token (the old link stops working), new 7-day expiry, e-mail sent again. Counts towards the rate limit."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Invitation
          content:
            application/json:
