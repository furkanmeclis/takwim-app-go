        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/integrations/{uuid}/jobs:
    get:
      tags: [Tenant]
      operationId: getTenantIntegrationJobs
      summary: Integration jobs of an account
      description: |
        `tenant.integrations.read`. Outbound calls and inbound notifications (idempotency key, attempts,
        deliveries, status). Live list resource `tenant.integration_jobs`.
      security:
