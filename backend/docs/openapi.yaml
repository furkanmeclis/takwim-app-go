      description: One service delivered or product handed over (`sale`), or the exact negative of one (`reversal`). Append-only.
      required: [uuid, kind, item_type, source_type, source_uuid, branch, customer, reservation, line_index, service_uuid, product_uuid, variant_uuid, staff, description, quantity, unit_price, gross_amount, discount_amount, net_amount, currency, sale_date, generation, reverses_uuid, reversed_by_uuid, replaces_uuid, replaced_by_uuid, reason, created_by, created_at]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [sale, reversal] }
        item_type: { type: string, enum: [service, product] }
