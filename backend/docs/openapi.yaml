          schema: { type: string }
        - { name: status, in: query, schema: { type: string }, description: "Comma-separated job statuses" }
        - { name: kind, in: query, schema: { type: string }, description: "Comma-separated job kinds" }
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeIntegrationJobPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

