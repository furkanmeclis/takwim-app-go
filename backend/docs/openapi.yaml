    patch:
      tags: [Tenant]
      operationId: patchTenantOrganizationProfile
      summary: Update the organization profile
      description: "`tenant.settings.write`. Name, time zone and currency; slug, status and access window are platform-managed."
      security:
        - bearerAuth: []
