          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffLinkableMembers"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff:
    get:
      tags: [Tenant]
      operationId: getTenantStaff
      summary: List staff of the organization
      description: |
        Staff of the `X-Organization` organization (`tenant.staff.read`).
        `q` searches name, title, phone, email and the linked account. A member
        with `branch_scope` = `selected` only sees staff assigned to one of its
        branches; anyone else answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `title`, `is_active`, `created_at`, `updated_at`; prefix `-` for descending. Default `-created_at`."
          schema: { type: string, example: name }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat (see `/v1/tenant/staff/facets`)"
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: show_online
          in: query
          schema: { type: boolean }
        - name: has_account
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Staff page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantStaff
      summary: Create a staff member
      description: |
        `tenant.staff.write`. A member limited to some branches must give at
        least one of its branches. Staff without an account take a plan seat
        (`409 LIMIT_REACHED` when the plan is full); an account already linked
        to another staff record answers `409`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateRequest"
      responses:
        "201":
          description: Created staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaff"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/staff/export:
    post:
      tags: [Tenant]
      operationId: postTenantStaffExport
      summary: Export staff
      description: |
        Queues an export of the organization's staff (`tenant.staff.export`).
        `query` honours `q`, `branch`, `is_active`, `show_online` and
        `has_account`. Poll `GET /v1/tenant/exports/{uuid}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff/import:
    post:
      tags: [Tenant]
      operationId: postTenantStaffImport
      summary: Upload a staff import file
      description: |
        Creates an import job (`tenant.staff.import`). A row with a known
        `uuid` updates that person, any other row creates one; branches are
        given as `branch_codes`. Continue with
        `/v1/tenant/imports/{uuid}/mapping`, `/preview` and `/confirm`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUploadForm"
      responses:
        "201":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff/import/sample:
    get:
      tags: [Tenant]
      operationId: getTenantStaffImportSample
      summary: Download a staff import sample
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: format
          in: query
          schema: { type: string, enum: [json, xlsx, csv, tsv], default: xlsx }
        - name: locale
          in: query
          schema: { type: string, enum: [tr, en], default: tr }
      responses:
        "200":
          description: Sample file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff/bulk:
    post:
      tags: [Tenant]
      operationId: postTenantStaffBulk
      summary: Run a bulk action on staff
      description: |
        Actions `activate` (`tenant.staff.bulk.activate`) and `deactivate`
        (`tenant.staff.bulk.deactivate`), both reversible. Targets are resolved
        inside the organization and the caller's branch scope only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkExecuteRequest"
      responses:
        "200":
          description: Sync bulk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkSyncResult"
        "202":
          description: Async bulk job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/staff/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantStaffMember
      summary: Get a staff member
      description: With `assignments` (shifts per branch). A uuid of another organization, or of staff outside the caller's branch scope, answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaff"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantStaffMember
      summary: Update a staff member
      description: |
        `tenant.staff.write`. Omitted fields are unchanged; `account_uuid: null`
        unlinks the account (a seat is then needed). `branch_uuids` replaces the
        branches the caller may manage; assignments outside its scope are kept.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPatchRequest"
      responses:
        "200":
          description: Updated staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaff"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantStaffMember
      summary: Delete a staff member (soft)
      description: "`tenant.staff.write`. A branch-limited caller gets `403` when the person also works in a branch outside its scope."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff/{uuid}/activity:
    get:
      tags: [Tenant]
      operationId: getTenantStaffActivity
      summary: Activity of a staff member
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBranchActivityPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff/{uuid}/branches/{branchUuid}/shifts:
    put:
      tags: [Tenant]
      operationId: putTenantStaffShifts
      summary: Replace the weekly shifts of a person in a branch
      description: |
        `tenant.staff.read` + `tenant.schedules.write`. Times are `HH:MM`
        wall-clock of the branch (`24:00` allowed as an end). Shifts of a day
        must not overlap (`overlap`), breaks must sit inside their shift
        (`outside`) and the same hours in another branch of the person answer
        `branch_overlap`. A branch the person is not assigned to (or outside the
        caller's scope) answers `404`. Returns the person with assignments.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: branchUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffWeeklyShifts"
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaff"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff/{uuid}/time-off:
    get:
      tags: [Tenant]
      operationId: getTenantStaffTimeOff
      summary: Time off of a staff member
      description: Newest first. `from` / `to` keep the entries overlapping that range.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Time off page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffTimeOffPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tenant]
      operationId: postTenantStaffTimeOff
      summary: Add a time off
      description: "`tenant.staff.read` + `tenant.schedules.write`. The person is unavailable in every branch for the period (at most 366 days)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTimeOffCreateRequest"
      responses:
        "201":
          description: Created time off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStaffTimeOff"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/staff/{uuid}/time-off/{timeOffUuid}:
    patch:
      tags: [Tenant]
      operationId: patchTenantStaffTimeOff
