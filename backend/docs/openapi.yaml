        data: { $ref: "#/components/schemas/TenantMemberPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantRole:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantRole" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantRolePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantRolePage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantPermissionList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantPermissionList" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeOrganizationSettingsVersion:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationSettingsVersion" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeOrganizationSettingsVersionPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationSettingsVersionPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantContext:
      type: object
      required: [organization, role, roles, permissions, branch_scope, sector, entitlements]
      properties:
        organization: { $ref: "#/components/schemas/TenantOrganization" }
        sector: { $ref: "#/components/schemas/Sector" }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
        role:
          type: string
          description: Caller's primary tenant role key in this organization (`owner`, `admin`, `member`, a Rentopia template or a custom key)
          example: owner
        roles:
          type: array
          description: Every tenant role key of the caller in this organization
          items: { type: string }
        permissions:
          type: array
          description: "`tenant.*` permission slugs granted in this organization only: the union over `roles`"
          items: { type: string }
        branch_scope:
          type: string
          enum: [all, selected]
          description: "`selected`: branch-bound data (branches and later reservations, vehicles, …) is limited to the caller's branches; other branches answer `404`"

    EnvelopeTenantContext:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantContext" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        scope:
          type: [string, "null"]
          enum: [tenant, null]
          description: "`tenant` specs hold organization records and are served by `/v1/tenant/search` only"

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, description: "Record uuid; tenant hits use `<organization id>_<uuid>`" }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PushDeviceInput:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: Expo push token (`ExponentPushToken[...]` or `ExpoPushToken[...]`)
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
        platform: { type: string, enum: [ios, android] }
        locale:
          type: string
          description: Device locale (`tr`, `en`, `tr-TR`, ...); stored as `tr` | `en` | empty
          example: tr-TR
        app_version: { type: string, maxLength: 32, example: "1.4.0 (57)" }
        device_name: { type: string, maxLength: 120, example: "iPhone 16" }

    PushDevice:
      type: object
      required: [uuid, token, platform, locale, app_version, device_name, last_seen_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string, enum: [ios, android] }
        locale: { type: string, enum: [tr, en, ""] }
        app_version: { type: string }
        device_name: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    PushDeviceRegistration:
      type: object
      required: [device, push_enabled]
      properties:
        device: { $ref: "#/components/schemas/PushDevice" }
        push_enabled:
          type: boolean
          description: Current `push_enabled` preference of the user

    EnvelopePushDeviceRegistration:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PushDeviceRegistration" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeStatusOK:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok] }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
            - MFA_REQUIRED
            - INVALID_MFA_CODE
            - RATE_LIMITED
            - STEP_UP_REQUIRED
            - ACCOUNT_DEACTIVATED
            - INVALID_EMAIL_CODE
            - INVALID_ID_TOKEN
            - OAUTH_ACCOUNT_NOT_LINKED
            - OAUTH_LINK_CHOICE_REQUIRED
            - INVALID_LINK_TICKET
            - OAUTH_PROVIDER_DISABLED
            - ORGANIZATION_REQUIRED
            - NO_TENANT_MEMBERSHIP
            - ORGANIZATION_SUSPENDED
            - ORGANIZATION_ACCESS_EXPIRED
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
