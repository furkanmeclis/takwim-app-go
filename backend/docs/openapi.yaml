              schema:
                $ref: "#/components/schemas/EnvelopeTenantResourceClosure"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantResourceClosure
      summary: Delete a closed period
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: closureUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/notifications:
    get:
      tags: [Tenant]
      operationId: getTenantNotifications
      summary: List own inbox in the organization panel
      description: >-
        Requires `notifications.read` and membership of the `X-Organization`
        organization. Lists the caller's notifications of that organization
        (tenant export / import / bulk jobs) plus the ones without an
        organization; other organizations' notifications never appear. Same
        query parameters as `GET /v1/notifications`.
