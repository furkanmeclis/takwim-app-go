      properties:
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        url: { type: string }

    FinanceEntry:
      type: object
      description: |
        One income / expense record (append-only). `entry_type=reversal` is
        the exact negative of the record in `reverses_uuid`; a correction
        is a reversal plus a replacement (`replaces_uuid`).
      required: [uuid, entry_type, kind, category, branch, staff, account, cash_movement_uuid, amount, currency, entry_date,
        description, reason, document, reverses_uuid, reversed_by_uuid, replaces_uuid, replaced_by_uuid, created_by, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        entry_type: { type: string, enum: [entry, reversal] }
        kind: { $ref: "#/components/schemas/FinanceKind" }
        category: { $ref: "#/components/schemas/FinanceRef" }
        branch:
          oneOf:
            - $ref: "#/components/schemas/FinanceRef"
            - type: "null"
        staff:
          oneOf:
            - $ref: "#/components/schemas/FinanceRef"
            - type: "null"
        account: { $ref: "#/components/schemas/CashAccountRef" }
        cash_movement_uuid: { type: string, format: uuid }
        amount: { type: string, example: "150.00", description: "Signed: negative on a reversal" }
        currency: { type: string }
        entry_date: { type: string, format: date }
        description: { type: string }
        reason: { type: string }
        document:
          oneOf:
            - $ref: "#/components/schemas/FinanceDocument"
            - type: "null"
        reverses_uuid: { type: [string, "null"], format: uuid }
        reversed_by_uuid: { type: [string, "null"], format: uuid }
        replaces_uuid: { type: [string, "null"], format: uuid }
        replaced_by_uuid: { type: [string, "null"], format: uuid }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/CashUserRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FinanceEntryCreateRequest:
      type: object
      required: [kind, category_uuid, cash_account_uuid, amount]
      properties:
        kind: { $ref: "#/components/schemas/FinanceKind" }
        category_uuid: { type: string, format: uuid }
        cash_account_uuid: { type: string, format: uuid }
        branch_uuid: { type: [string, "null"], format: uuid, description: "Default: the account's branch" }
        staff_uuid: { type: [string, "null"], format: uuid }
        amount: { type: string, example: "150.00" }
        entry_date: { type: string, format: date, description: "Default today; never in the future" }
        description: { type: string, maxLength: 500 }
        idempotency_key: { type: string, maxLength: 128 }

    FinanceEntryPatchRequest:
      type: object
      properties:
        category_uuid: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
        staff_uuid: { type: [string, "null"], format: uuid }

    FinanceEntryCorrectRequest:
      type: object
      required: [reason]
      properties:
        category_uuid: { type: string, format: uuid }
        cash_account_uuid: { type: string, format: uuid }
        branch_uuid: { type: [string, "null"], format: uuid }
        staff_uuid: { type: [string, "null"], format: uuid }
        amount: { type: string, example: "120.00" }
        entry_date: { type: string, format: date }
        description: { type: string, maxLength: 500 }
        reason: { type: string, minLength: 3, maxLength: 500 }

