    MoneyAmount:
      type: string
      description: Decimal amount with two places, in the organization's currency.
      pattern: "^[0-9]+\\.[0-9]{2}$"
      example: "450.00"

    MoneyInput:
      description: Non-negative amount with at most two decimals, as a string or a number.
      oneOf:
        - type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        - type: number
          minimum: 0
      example: "450.00"

    ServiceCategory:
      type: object
      required: [uuid, name, description, sort_order, services_count, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        services_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ServiceCategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
