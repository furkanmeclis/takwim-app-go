      description: |
        No authentication. The business page (`takwim.link/{slug}`), the
        embedded widget and the mobile app start here: name, logo, sector
        flow and terms, public contact details, policy texts and whether /
        how the business takes bookings (`booking`). A channel books when
        `booking.ready` and `booking.channels[channel]`. Unknown, suspended
        and expired businesses all answer `404`. Rate limited per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
      responses:
        "200":
          description: Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicBusiness"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/logo:
    get:
      tags: [Public booking]
      operationId: getPublicBusinessLogo
      summary: Business logo
      description: No authentication. Use the `logo_url` of the profile (it carries a version).
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
      responses:
        "200":
          description: Logo image
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/branches:
    get:
      tags: [Public booking]
      operationId: listPublicBranches
      summary: Branches shown online
      description: |
        No authentication. Active branches with `show_online`, with weekly
        hours, today's and later special days and photos (API-owned URLs).
        A single branch means the page skips the branch step.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicBranchList"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/services:
    get:
      tags: [Public booking]
      operationId: listPublicServices
      summary: Bookable services
      description: |
        No authentication. Active services with `show_online` that a public
        branch offers, with their branch prices and durations and the people
        shown online who perform them (personal price / duration when set;
        the booking uses personal › branch › list). With `branch_uuid` only
        that branch's services, priced for it; a hidden branch or another
        business's is `400` detail `branch_uuid` / `not_found`.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - name: branch_uuid
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicServiceList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/staff:
    get:
      tags: [Public booking]
      operationId: listPublicStaff
      summary: Staff shown online
      description: |
        No authentication. Active people with `show_online` working in a
        public branch, with their public branches and bookable services. No
        contact details. Filters `branch_uuid` and `service_uuid` (`400`
        `not_found` for hidden or foreign records).
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - name: branch_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: service_uuid
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicStaffList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/products:
    get:
      tags: [Public booking]
      operationId: listPublicProducts
      summary: Products a customer may add to a booking
      description: |
        No authentication (TEC-919). Active products with `show_online`, sold in the public branch `branch_uuid`
        (required) and with units available; one row per active variant. `max_quantity` is how many the customer may
        take (at most 10); the stock itself is not shown. Empty without the products module.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - name: branch_uuid
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicProductList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/availability:
    post:
      tags: [Public booking]
      operationId: postPublicAvailability
      summary: Bookable start times (online channel)
      description: |
        No authentication. The panel's slot engine on the online channel:
        services, staff and resources shown online, the minimum notice and
        maximum advance of the business settings. Same body and day statuses
        as the panel search, without buffers and resources. `409
        BOOKING_UNAVAILABLE` (detail `channel` / `module_disabled`,
        `online_not_ready` or `channel_disabled`) when the business does not
        take bookings on `channel`. Rate limited per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAvailabilityRequest"
      responses:
        "200":
          description: Days and slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicAvailability"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/checkouts:
    post:
      tags: [Public booking]
      operationId: postPublicCheckout
      summary: Hold the picked slot during checkout
      description: |
        No authentication. Holds the slot for the customer while they fill
        in the contact form (a `checkout` capacity hold of the online
        channel, `booking.checkout_minutes`, 10 by default) and returns the
        checkout `token` with the planned lines (the staff member of each
        line is kept for the booking). `409` detail `starts_at` / `taken`
        when the slot is gone; the gate of `availability` applies. Send an
        `Idempotency-Key` so a retried request does not hold twice. Rate
        limited per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutRequest"
      responses:
        "201":
          description: Checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCheckout"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/checkouts/{token}:
    get:
      tags: [Public booking]
      operationId: getPublicCheckout
      summary: A checkout
      description: |
        No authentication; the token is the secret. `status` is `active`,
        `expired` (its time may still be free), `released` or `booked`
        (with `reservation_uuid`).
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/PublicCheckoutToken"
      responses:
        "200":
          description: Checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCheckout"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [Public booking]
      operationId: deletePublicCheckout
      summary: Release a checkout
      description: |
        No authentication. Frees the held slot when the customer goes back.
        A booked, expired or released checkout is returned as it is.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/PublicCheckoutToken"
      responses:
        "200":
          description: Checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicCheckout"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/reservations:
    post:
      tags: [Public booking]
      operationId: postPublicReservation
      summary: Book a checkout
      description: |
        No authentication. Books the checkout for the customer identified by
        phone (normalized to E.164; numbers without a country code are
        Turkish). The business's live customer record with that phone is
        used as it is; otherwise a new record (source `online`, unverified)
        is created. The checkout's time is freed and booked again in one
        transaction, so an expired checkout still books while its time is
        free (`409` `starts_at` / `taken` otherwise). The business settings
        decide the state: auto approval and payment on site → `active`;
        staff approval → `requested` until the business accepts; online
        payment → `requested` / `online_pending` until paid (`expires_at`).

        A checkout books once: a retry answers `200` with the same
        reservation and `Idempotent-Replayed: true`. The answer carries the
        reservation's `access_token` for the status route; keep it. A filled
        `website` (honeypot) is `400` `website` / `rejected`. Rate limited
        per IP and per phone of the business.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingRequest"
      responses:
        "200":
          description: The reservation the checkout already became (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicReservation"
        "201":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/reservations/{uuid}:
    get:
      tags: [Public booking]
      operationId: getPublicReservation
      summary: Reservation status
      description: |
        No authentication; `X-Reservation-Token` must be the reservation's
        `access_token` from the booking answer. A missing or wrong token, an
        unknown reservation and another business's slug all answer `404`.
        The view has no internal notes, history or resources.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: X-Reservation-Token
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicReservation"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/businesses/{slug}/reservations/{uuid}/payment:
    post:
      tags: [Public booking]
      operationId: startPublicReservationPayment
      summary: Open the online payment page
      description: |
        The holder of the reservation's access token (`X-Reservation-Token`)
        gets the hosted page of the business's own payment provider for the
        full amount of a booking that waits for its online payment (accepted,
        `online_pending`, before `expires_at`). Asking again while the page
        is open returns the same page. The result is recorded only from the
        provider's server notification; returning from the page proves
        nothing, so the status page shows the server's `payment_status`.
        `409 PAYMENT_NOT_AVAILABLE`: nothing to pay (not accepted yet, paid,
        cancelled, window over). `409 PAYMENT_NOT_READY`: the business has no
        working provider account or online cash account. `502
        PAYMENT_PROVIDER_ERROR`: the provider did not open the page. Limit:
        the checkout window per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/PublicBusinessSlug"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: X-Reservation-Token
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { type: string, enum: [tr, en] }
      responses:
        "200":
          description: Payment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOnlinePaymentStart"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/InternalError" }

  /v1/public/payments/paytr/notify:
    post:
      tags: [Payments]
      operationId: postPayTRNotification
      summary: PayTR payment notification
      description: |
        PayTR's server notification (iFrame API step 2), configured as the
        notification URL of the business's merchant panel. The business is
        found from `merchant_oid` (our payment reference); `hash` is checked
        with that business's merchant key and salt (`401` otherwise). A
        notification is applied once (`integration_jobs`, key per payment
        and status): a repeated delivery answers `OK` again without a second
        collection. A success writes the ledger collection into the
        provider's online cash account and confirms the booking; a payment
        for a visit cancelled meanwhile is recorded, the visit is not
        reopened and the payment waits for its refund. The adapter is
        mounted only with `PAYMENTS_PAYTR_ENABLED` (`404` otherwise). Limit:
        600 per minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [merchant_oid, status, total_amount, hash]
              properties:
                merchant_oid: { type: string }
                status: { type: string, enum: [success, failed] }
                total_amount: { type: string }
                payment_amount: { type: string }
                hash: { type: string }
                failed_reason_code: { type: string }
                failed_reason_msg: { type: string }
                test_mode: { type: string }
                payment_type: { type: string }
                currency: { type: string }
      responses:
        "200":
          description: Plain text `OK` (PayTR stops sending the notification)
          content:
            text/plain:
              schema: { type: string, enum: [OK] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/payments/testpay/{ref}:
    get:
      tags: [Payments]
      operationId: getTestPaymentPage
      summary: Development provider's test page
      description: |
        What the test page (`/pay/test/{ref}`) shows. The test provider is
        registered in development and test only; elsewhere every reference
        is `404`. No money moves.
      security: []
      parameters:
        - $ref: "#/components/parameters/PaymentRef"
      responses:
        "200":
          description: Test page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTestPaymentPage"
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/public/payments/testpay/{ref}/complete:
    post:
      tags: [Payments]
      operationId: completeTestPayment
      summary: Pay or decline on the test page
      description: |
        The test page's buttons. The server signs the notification a real
        provider would send with the account's secret and handles it on the
        same verified path as a provider notification (once per outcome).
        Development and test only (`404` elsewhere).
      security: []
      parameters:
        - $ref: "#/components/parameters/PaymentRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [succeeded, failed] }
      responses:
        "200":
          description: What the notification did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePaymentNotifyResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/auth/start:
    post:
      tags: [Customer panel]
      operationId: startCustomerSignIn
      summary: Send a sign-in code
      description: |
        Sends a six-digit code by SMS when a live business keeps a customer
        record with the phone (or the phone was verified before). The answer
        is the same for every valid phone, whether a code went out, the
        60 second cooldown or the hourly cap (5 codes) applied, or the phone
        is unknown. Codes of one phone: 60 second cooldown, 5 an hour and 10
        a day. An address that asked codes for 20 different phones within an
        hour gets no more codes for an hour (same answer). Limits: 10 per IP
        and 5 per phone in 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string, description: "Any spelling; a number without a country code is Turkish.", example: "0532 111 22 33" }
      responses:
        "202":
          description: Code sent if the phone is known
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerSignInStart"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/auth/verify:
    post:
      tags: [Customer panel]
      operationId: verifyCustomerSignIn
      summary: Exchange the code for a panel session
      description: |
        A code works for 5 minutes, once, with 5 attempts. Every failure
        answers `400 OTP_INVALID`. On success the verified phone links the
        person's records in every business (`customer_identity_links`,
        source `panel_login`) and a session opens: `access_token` is a
        customer token (send it as `Authorization: Bearer`) that expires
        with the session's 30 day cap; an idle week also ends it. The web
        BFF moves the token into an httpOnly cookie and drops it from the
        answer. Limits: 30 per IP and 10 per phone in 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              additionalProperties: false
              properties:
                phone: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/auth/logout:
    post:
      tags: [Customer panel]
      operationId: customerLogout
      summary: End the session
      security:
        - customerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                everywhere: { type: boolean, description: "End every session of the person." }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/customer/me:
    get:
      tags: [Customer panel]
      operationId: getCustomerProfile
      summary: The signed-in person
      description: Phone, the businesses that linked it (with the name each keeps) and the sessions.
      security:
        - customerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerProfile"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations:
    get:
      tags: [Customer panel]
      operationId: listCustomerReservations
      summary: The person's visits in every business
      description: |
        Only visits of the records linked to the session's identity. `upcoming`
        is requested, booked or in service and not over (soonest first);
        `past` is everything else (newest first).
      security:
        - customerAuth: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: all }
        - name: business
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Comma-separated reservation statuses
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [starts_at, -starts_at] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations/{uuid}:
    get:
      tags: [Customer panel]
      operationId: getCustomerReservation
      summary: One visit
      description: |
        Lines, place, policy texts, the customer-visible history and the
        actions the business rules allow now. Another person's visit, an
        unknown or a malformed id all answer `404`.
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/customer/reservations/{uuid}/cancel:
    post:
      tags: [Customer panel]
      operationId: cancelCustomerReservation
      summary: Cancel a visit
      description: |
        Allowed for a requested or booked visit until the business's cancel
        cutoff (`cancel_cutoff_minutes` before the start). The capacity is
        freed and the reason is `customer_cancelled`. Not allowed:
        `409 ACTION_NOT_ALLOWED` with detail `cancel` / `status`, `cutoff`
        or `business_unavailable`. Send an `Idempotency-Key`.
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_version: { type: integer }
      responses:
        "200":
          description: Cancelled visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations/{uuid}/confirm:
    post:
      tags: [Customer panel]
      operationId: confirmCustomerReservation
      summary: Confirm a visit ("Geleceğim")
      description: |
        Answers the business's confirmation request (TEC-921): no further
        requests go out and the visit is not cancelled for no answer. Allowed
        while `actions.confirm.allowed` (until the deadline, or until the
        start when the business kept the visit after the deadline). Not
        allowed: `409 ACTION_NOT_ALLOWED` with detail `confirm` /
        `not_requested`, `answered`, `status` or `business_unavailable`.
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Confirmed visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations/{uuid}/change-request:
    post:
      tags: [Customer panel]
      operationId: requestCustomerReservationChange
      summary: Ask the business for another time
      description: |
        Answers the confirmation request with a change request: the visit
        stays booked, no further requests go out and it is not cancelled
        for no answer; the business moves it (or the customer confirms
        later). Once per visit (`409` detail `request_change/answered`).
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Visit with the change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations/{uuid}/availability:
    post:
      tags: [Customer panel]
      operationId: searchCustomerReservationStarts
      summary: Free starts to move a visit to
      description: |
        The same services and staff on the online channel (the business's
        minimum notice, booking window and online visibility apply), local
        dates of the branch. The current start is left out. Not allowed:
        `409 ACTION_NOT_ALLOWED` with detail `reschedule` / reason.
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200":
          description: Free starts per day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerAvailability"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/reservations/{uuid}/reschedule:
    post:
      tags: [Customer panel]
      operationId: rescheduleCustomerReservation
      summary: Move a visit
      description: |
        Allowed until the business's change cutoff, when the business takes
        online bookings. The visit is planned again with the same services
        and staff; a taken start answers `409` `starts_at` / `taken` and
        changes nothing, a stale `expected_version` `409` `expected_version`
        / `stale`. Send an `Idempotency-Key`.
      security:
        - customerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              additionalProperties: false
              properties:
                starts_at: { type: string, format: date-time }
                expected_version: { type: integer }
      responses:
        "200":
          description: Moved visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/payments:
    get:
      tags: [Customer panel]
      operationId: listCustomerPayments
      summary: Visits with money (Ödemelerim)
      description: |
        The visit list without visits that ended with no money moving
        (cancelled or rejected and unpaid). Same filters as the visit list;
        newest first.
      security:
        - customerAuth: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, past, all], default: all }
        - name: business
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [starts_at, -starts_at] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Visits with money
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/customer/payments/summary:
    get:
      tags: [Customer panel]
      operationId: getCustomerPaymentSummary
      summary: Amounts per currency
      description: Currencies are never added together.
      security:
        - customerAuth: []
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerPaymentSummary"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/customer/auth/link:
    post:
      tags: [Customer panel]
      operationId: redeemCustomerPanelLink
      summary: Exchange a panel link for a panel session
      description: |
        The SMS after an online booking carries a single-use panel link,
        `takwim.link/panel/l#<token>`. The token sits after `#`, so it never
        reaches a server log; the page (or the mobile app) sends it here in
        the body. A link works once, for 24 hours; an unknown, expired or
        used link answers `400 LINK_INVALID` and the person signs in with a
        code instead. Only a keyed hash of the token is stored. On success
        the answer is the same as `auth/verify` (session method `link`,
        link source `panel_link`). Limit: 10 per IP in 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/sessions:
    get:
      tags: [Customer panel]
      operationId: listCustomerSessions
      summary: The person's signed-in devices
      description: Live panel sessions of the identity, most recently used first; `current` marks this one.
      security:
        - customerAuth: []
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerDeviceList"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/sessions/{uuid}:
    delete:
      tags: [Customer panel]
      operationId: revokeCustomerSession
      summary: Sign one device out
      description: The session ends at once. Another person's session or an unknown id answers `404`.
      security:
        - customerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/phone/start:
    post:
      tags: [Customer panel]
      operationId: startCustomerPhoneChange
      summary: Send a code to the new number
      description: |
        Number change, step 1. The code is bound to the signed-in profile
        and works only for `phone/verify`. Cooldown and caps of the target
        number apply as in `auth/start`, plus 5 number change codes a day
        per profile (past it the answer is the same, nothing is sent). The
        current number answers `400` with `phone` / `same`.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string }
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerSignInStart"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/phone/verify:
    post:
      tags: [Customer panel]
      operationId: verifyCustomerPhoneChange
      summary: Move the profile to the confirmed number
      description: |
        Number change, step 2. The profile keeps its identity and every
        visit it sees. The old number is released: its next holder starts
        with an empty panel, and the records proven with the old number stop
        showing visits booked after the change. Every other session of the
        profile ends; this one continues on the new number. A number that
        has its own Takwim profile answers `409 PHONE_IN_USE` (profiles are
        never merged on a number). A wrong code answers `400 OTP_INVALID`.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              additionalProperties: false
              properties:
                phone: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Profile on the new number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/phone/reassigned:
    post:
      tags: [Customer panel]
      operationId: reportCustomerNumberReassigned
      summary: Report that this number was recently given to me
      description: |
        For a person who received a recycled number and sees somebody
        else's visits. Every business except `keep_businesses` shows only
        visits booked from now on (its earlier history and the name it
        keeps are hidden); records of the number found later open the same
        way; every other session of the profile (the previous holder's
        devices) ends. Nothing is deleted: the businesses keep their
        records. A business that is not in the profile answers `400` with
        `keep_businesses` / `unknown`.
      security:
        - customerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keep_businesses:
                  type: array
                  description: Businesses whose history is the person's own.
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/visit:
    post:
      tags: [Customer panel]
      operationId: getCustomerVisit
      summary: Open one visit by its visit link
      description: |
        A visit link (`takwim.link/panel/v#<token>`, sent with confirmation
        and cancel messages) opens exactly one reservation: the panel detail
        of it, with `actions.reschedule` refused (`sign_in_required`). It is
        a separate token type: it opens no panel session and no other visit.
        It works until a day after the visit ends. An unknown, expired or
        revoked link answers `400 LINK_INVALID`. Limit: 30 per IP in 10
        minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/visit/cancel:
    post:
      tags: [Customer panel]
      operationId: cancelCustomerVisit
      summary: Cancel the visit of a visit link
      description: The business's cancel rules apply exactly as in the panel (`409 ACTION_NOT_ALLOWED`, `stale`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 32 }
                expected_version: { type: integer }
      responses:
        "200":
          description: Cancelled visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/visit/confirm:
    post:
      tags: [Customer panel]
      operationId: confirmCustomerVisit
      summary: Confirm the visit of a visit link
      description: |
        The "Geleceğim" button of the confirmation message's link (TEC-921).
        Opening the link answers nothing; only this request does. Same rules
        as the panel's confirm (`409 ACTION_NOT_ALLOWED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 32 }
      responses:
        "200":
          description: Confirmed visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/customer/visit/change-request:
    post:
      tags: [Customer panel]
      operationId: requestCustomerVisitChange
      summary: Ask for another time through a visit link
      description: Same rules as the panel's change request (`409 ACTION_NOT_ALLOWED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 32 }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Visit with the change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer panel token (kind `customer`) from `POST /v1/customer/auth/verify`. Staff routes refuse it; customer routes refuse staff tokens.

  parameters:
    PaymentRef:
      name: ref
      in: path
      required: true
      description: Our payment reference at the provider (`order_ref`).
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9]+$" }
    PublicBusinessSlug:
      name: slug
      in: path
      required: true
      description: The business's slug (`takwim.link/{slug}`).
      schema: { type: string, maxLength: 64, example: kuafor-ayse }
    PublicCheckoutToken:
      name: token
      in: path
      required: true
      description: Checkout token from `POST …/checkouts`.
      schema: { type: string, format: uuid }
    InvitationUUID:
      name: invitationUuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      description: Raw invitation token from the e-mail link (43 characters, base64url)
      schema: { type: string }
    InvitationSort:
      name: sort
      in: query
      description: "One of `email`, `expires_at`, `created_at`; prefix `-` for descending. Default `-created_at`."
      schema: { type: string, example: "-created_at" }
    InvitationStatus:
      name: status
      in: query
      description: "`pending`, `expired`, `accepted`, `revoked` (comma separated)"
      schema: { type: string, example: "pending" }
    XOrganization:
      name: X-Organization
      in: header
      required: true
      description: |
        Organization of a `/v1/tenant/*` request: its slug (preferred, readable
        in logs) or uuid. The BFF forwards it on `/api/v1/tenant/*` only.
      schema: { type: string, maxLength: 64, example: acme }
    ReportDateFrom:
      name: date_from
      in: query
      description: First day (default today in the business time zone)
      schema: { type: string, format: date }
    ReportDateTo:
      name: date_to
      in: query
      description: Last day (default date_from, else today; at most 366 days)
      schema: { type: string, format: date }
    ReportBranch:
      name: branch
      in: query
      description: Branch uuids and / or head_office; comma-separate or repeat. Absent = every branch in scope and the head office.
      schema: { type: string }
    ReportStaff:
      name: staff
      in: query
      description: Staff uuids; comma-separate or repeat. Narrows revenue, shares, payouts, visits and confirmations.
      schema: { type: string }
    XBranch:
      name: X-Branch
      in: header
      required: false
      description: |
        Branch picked in the panel header (branch uuid). Narrows branch-bound
        lists, counts, facets, search and the overview to that branch; access
        checks on single records still use the member's branch scope. Absent
        = every branch the caller may access. A branch that is unknown or
        outside the caller's scope answers `403 BRANCH_NOT_ALLOWED`. The BFF
        forwards it on `/api/v1/tenant/*` only.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key (a UUID) for an unsafe request the client may
        retry. Scoped to the caller, `X-Organization`, method and path; kept
        24 hours. Same key + same body replays the first response with
        `Idempotent-Replayed: true`; same key + another body is `422
        IDEMPOTENCY_KEY_REUSED`; while the first request runs a retry gets
        `409 IDEMPOTENCY_IN_PROGRESS`. 5xx outcomes are not kept.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[!-~]+$" }
    QRSessionID:
      name: id
      in: path
      required: true
      description: QR sign-in session id (from the QR URL)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    ConfirmationBranchFilter:
      name: branch
      in: query
      description: "Branch uuids; comma-separate or repeat"
      schema: { type: string }
    ConfirmationStartsFrom:
      name: starts_from
      in: query
      description: "Visits starting at or after this RFC 3339 time"
      schema: { type: string, format: date-time }
    ConfirmationStartsTo:
      name: starts_to
      in: query
      description: "Visits starting before this RFC 3339 time"
      schema: { type: string, format: date-time }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    CashAccountUUID:
      name: uuid
      in: path
      required: true
      description: Cash account UUID.
      schema:
        type: string
        format: uuid
    SaleLineUUID:
      name: uuid
      in: path
      required: true
      description: Sale line UUID.
      schema:
        type: string
        format: uuid
    StaffShareRuleUUID:
      name: uuid
      in: path
      required: true
      description: Staff share rule UUID.
      schema:
        type: string
        format: uuid
    StaffSharePayoutUUID:
      name: uuid
      in: path
      required: true
      description: Staff share payout UUID.
      schema:
        type: string
        format: uuid
    LedgerEntryUUID:
      name: uuid
      in: path
      required: true
      description: Ledger entry UUID.
      schema:
        type: string
        format: uuid
    FinanceEntryUUID:
      name: entryUuid
      in: path
      required: true
      description: Income / expense record UUID.
      schema:
        type: string
        format: uuid
    FinanceCategoryUUID:
      name: categoryUuid
      in: path
      required: true
      description: Income / expense category UUID.
      schema:
        type: string
        format: uuid
    CashMovementUUID:
      name: uuid
      in: path
      required: true
      description: Cash movement UUID.
      schema:
        type: string
        format: uuid
    UserUUID:
      name: userUuid
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    PointUUID:
      name: pointUuid
      in: path
      required: true
      description: Service point UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    IntegrationAccountOK:
      description: Integration account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeIntegrationAccount"
    UnprocessableEntity:
      description: The request is well-formed but cannot be applied (e.g. the provider rejected the connection test)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: "`INVITATION_EXPIRED`, `INVITATION_USED` or `INVITATION_REVOKED`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrganizationRequired:
      description: "`ORGANIZATION_REQUIRED`: the `X-Organization` header is missing or empty"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TenantForbidden:
      description: |
        `NO_TENANT_MEMBERSHIP` (unknown organization or not a member),
        `ORGANIZATION_SUSPENDED`, `ORGANIZATION_ACCESS_EXPIRED`,
        `BRANCH_NOT_ALLOWED` (`X-Branch` names a branch outside the caller's
        scope), or `FORBIDDEN` (tenant permission missing in this organization)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    OwnerRef:
      type: object
      required: [uuid, email, name, surname]
      properties:
        uuid: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        surname: { type: string }

    OrganizationSummary:
      type: object
      required: [uuid, slug, name, status, access_starts_at, created_at, updated_at, owner, access_state, member_count, branch_count, pending_invitation_count]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url:
          type: [string, "null"]
          description: "API-owned logo stream (`/v1/organizations/{uuid}/logo?v=...`)"
        status: { type: string, enum: [active, suspended] }
        timezone: { type: string, example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: TRY }
        sector: { $ref: "#/components/schemas/SectorCode" }
        access_starts_at: { type: string, format: date-time }
        access_ends_at: { type: [string, "null"], format: date-time }
        settings:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        owner:
          description: Longest-standing owner; `null` while the owner invitation is pending
          oneOf:
            - $ref: "#/components/schemas/OwnerRef"
            - type: "null"
        access_state: { type: string, enum: [open, upcoming, expired] }
        member_count: { type: integer, format: int64 }
        branch_count: { type: integer, format: int64 }
        pending_invitation_count: { type: integer, format: int64 }

    OrganizationSummaryPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSummary" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeOrganizationSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeOrganizationSummaryPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationSummaryPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CreateOrganizationResult:
      type: object
      required: [organization, owner_invitation]
      properties:
        organization: { $ref: "#/components/schemas/OrganizationSummary" }
        owner_invitation:
          description: Set when the owner was invited by e-mail
          oneOf:
            - $ref: "#/components/schemas/Invitation"
            - type: "null"

    EnvelopeCreateOrganizationResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CreateOrganizationResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OrganizationActivityEntry:
      type: object
      required: [uuid, action, resource, resource_uuid, payload, actor, created_at]
      properties:
        uuid: { type: string, format: uuid }
        action: { type: string, example: organizations.status_updated }
        resource: { type: string, example: platform.organizations }
        resource_uuid: { type: [string, "null"], format: uuid }
        payload: { type: object, additionalProperties: true }
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at: { type: string, format: date-time }

    OrganizationActivityPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationActivityEntry" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeOrganizationActivityPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationActivityPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantRoleItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantRole" }

    EnvelopeTenantRoleItems:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantRoleItems" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    BranchOption:
      type: object
      required: [uuid, code, name, is_active]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string, example: MRK }
        name: { type: string, example: Merkez }
        is_active: { type: boolean }

    BranchOptionItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BranchOption" }

    EnvelopeBranchOptionItems:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchOptionItems" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PlatformMemberRequest:
      type: object
      required: [user_uuid]
      additionalProperties: false
      properties:
        user_uuid: { type: string, format: uuid }
        role_key:
          type: string
          description: Legacy single role (default `member`); ignored when `role_uuids` is set
          examples: [member]
        role_uuids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        branch_scope: { type: string, enum: [all, selected] }
        branch_uuids:
          type: array
          items: { type: string, format: uuid }

    PlatformMemberPatchRequest:
      type: object
      additionalProperties: false
      properties:
        role_key: { type: string, description: Legacy single-role replace, examples: [admin] }
        role_uuids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        branch_scope: { type: string, enum: [all, selected] }
        branch_uuids:
          type: array
          items: { type: string, format: uuid }

    UserRef:
      type: object
      required: [uuid, email, name, surname]
      properties:
        uuid: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        surname: { type: string }

    Invitation:
      type: object
      required: [uuid, email, status, roles, branch_scope, branches, invited_by, expires_at, accepted_at, revoked_at, last_sent_at, send_count, created_at]
      properties:
        uuid: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, expired, accepted, revoked] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/TenantRoleRef" }
        branch_scope: { type: string, enum: [all, selected] }
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchRef" }
        invited_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_sent_at: { type: string, format: date-time }
        send_count: { type: integer }
        created_at: { type: string, format: date-time }

    InvitationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopeInvitation:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Invitation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeInvitationPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/InvitationPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CreateInvitationRequest:
      type: object
      required: [email, role_uuids]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        role_uuids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        branch_scope: { type: string, enum: [all, selected], default: all }
        branch_uuids:
          type: array
          description: Required with `branch_scope` = `selected`
          items: { type: string, format: uuid }

    InvitationPreviewOrganization:
      type: object
      required: [uuid, slug, name, logo_url]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url: { type: [string, "null"] }

    InvitationPreview:
      type: object
      required: [organization, inviter_name, email_masked, status, expires_at]
      properties:
        organization: { $ref: "#/components/schemas/InvitationPreviewOrganization" }
        inviter_name: { type: string, example: Ayşe Kaya }
        email_masked: { type: string, example: "m****@e******.com" }
        status: { type: string, enum: [pending, expired, accepted, revoked] }
        expires_at: { type: string, format: date-time }

    EnvelopeInvitationPreview:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/InvitationPreview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AcceptInvitationResult:
      type: object
      required: [organization_uuid, organization_slug, already_member, email]
      properties:
        organization_uuid: { type: string, format: uuid }
        organization_slug: { type: string }
        already_member: { type: boolean }
        email: { type: string, format: email, description: The account e-mail (for signing in after registration) }

    EnvelopeAcceptInvitationResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AcceptInvitationResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    RegisterInvitedRequest:
      type: object
      required: [name, surname, password]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }

    OrganizationProfile:
      type: object
      required: [uuid, slug, name, logo_url, status, timezone, currency, sector, access_starts_at, access_ends_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url: { type: [string, "null"], description: API-owned logo stream; never an object key }
        status: { type: string, enum: [active, suspended] }
        timezone: { type: string, description: "IANA zone for calendar decisions; instants stay UTC", example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code of every amount of the organization, example: TRY }
        sector: { $ref: "#/components/schemas/SectorCode" }
        access_starts_at: { type: string, format: date-time }
        access_ends_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    EnvelopeOrganizationProfile:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationProfile" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OrganizationProfilePatchRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        timezone: { type: string, description: IANA zone name, example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: TRY }


    DayHours:
      type: object
      required: [closed, open, close]
      properties:
        closed: { type: boolean }
        open: { type: string, description: "HH:MM (24h); empty when closed", example: "09:00" }
        close: { type: string, description: "HH:MM (24h), after open; empty when closed", example: "18:00" }

    WeeklyHours:
      type: object
      description: Weekly schedule, Monday first.
      required: [mon, tue, wed, thu, fri, sat, sun]
      properties:
        mon: { $ref: "#/components/schemas/DayHours" }
        tue: { $ref: "#/components/schemas/DayHours" }
        wed: { $ref: "#/components/schemas/DayHours" }
        thu: { $ref: "#/components/schemas/DayHours" }
        fri: { $ref: "#/components/schemas/DayHours" }
        sat: { $ref: "#/components/schemas/DayHours" }
        sun: { $ref: "#/components/schemas/DayHours" }

    HolidayException:
      type: object
      description: Overrides the weekly schedule on one date.
      required: [date, closed, open, close, note]
      properties:
        date: { type: string, format: date, example: "2026-01-01" }
        closed: { type: boolean }
        open: { type: string, example: "" }
        close: { type: string, example: "" }
        note: { type: string, example: Yılbaşı }

    Branch:
      type: object
      required:
        - uuid
        - code
        - name
        - address
        - city
        - district
        - latitude
        - longitude
        - phone
        - email
        - working_hours
        - holiday_exceptions
        - prep_minutes
        - is_active
        - slug
        - description
        - timezone
        - effective_timezone
        - show_online
        - cover_url
        - service_points_count
        - created_at
        - updated_at
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string, example: MRK }
        name: { type: string, example: Merkez }
        slug: { type: string, description: "URL name on the booking page; unique in the business", example: merkez }
        description: { type: string }
        timezone:
          type: [string, "null"]
          description: The branch's own IANA zone; `null` follows the business zone
          example: Europe/Istanbul
        effective_timezone: { type: string, description: Zone calendar decisions use (own or business), example: Europe/Istanbul }
        show_online: { type: boolean, description: Listed on the customer booking screens }
        cover_url:
          type: [string, "null"]
          description: API-owned public URL of the first gallery image
        images:
          type: array
          description: Gallery in display order (detail response only); the first image is the cover
          items: { $ref: "#/components/schemas/BranchImage" }
        address: { type: string }
        city: { type: string, example: İstanbul }
        district: { type: string, example: Kadıköy }
        latitude: { type: [number, "null"], format: double }
        longitude: { type: [number, "null"], format: double }
        phone: { type: string }
        email: { type: string }
        working_hours: { $ref: "#/components/schemas/WeeklyHours" }
        holiday_exceptions:
          type: array
          items: { $ref: "#/components/schemas/HolidayException" }
        prep_minutes: { type: integer, description: Preparation / cleanup buffer in minutes, example: 60 }
        is_active: { type: boolean }
        service_points_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BranchPatchRequest:
      type: object
      additionalProperties: false
      properties: &branchWriteProperties
        code: { type: string, maxLength: 32, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$" }
        name: { type: string, maxLength: 255 }
        address: { type: string, maxLength: 1000 }
        city: { type: string, maxLength: 128 }
        district: { type: string, maxLength: 128 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, maxLength: 255 }
        working_hours: { $ref: "#/components/schemas/WeeklyHours" }
        holiday_exceptions:
          type: array
          maxItems: 366
          items: { $ref: "#/components/schemas/HolidayException" }
        prep_minutes: { type: integer, minimum: 0, maximum: 10080 }
        is_active: { type: boolean }
        slug:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$|^$"
          description: Empty on create = generated from the name (with -2, -3 … on a clash)
        description: { type: string, maxLength: 2000 }
        timezone:
          type: [string, "null"]
          maxLength: 64
          description: IANA zone; `null` or empty follows the business zone
        show_online: { type: boolean }

    BranchImage:
      type: object
      required: [uuid, public_url, filename, content_type, size_bytes, sort_order, created_at]
      properties:
        uuid: { type: string, format: uuid }
        public_url: { type: string, description: API-owned public URL; clients use it as is }
        filename: { type: string }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size_bytes: { type: integer, format: int64 }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }

    BranchImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BranchImage" }

    BranchImageOrderRequest:
      type: object
      additionalProperties: false
      required: [image_uuids]
      properties:
        image_uuids:
          type: array
          description: Every image of the branch once, in the new order
          items: { type: string, format: uuid }

    BranchCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties: *branchWriteProperties

    BranchPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    Facet:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, format: int64 }

    BranchFacets:
      type: object
      required: [city]
      properties:
        city:
          type: array
          items: { $ref: "#/components/schemas/Facet" }

    ServicePoint:
      type: object
      required: [uuid, branch_uuid, type, name, description, extra_fee, working_hours, online_selectable, is_active, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        branch_uuid: { type: string, format: uuid }
        type: { type: string, enum: [office, airport, address_zone, hotel] }
        name: { type: string }
        description: { type: string, description: "Street address, or the zone description of an address_zone point" }
        extra_fee: { type: string, description: Decimal with two fraction digits, example: "150.00" }
        working_hours:
          description: "`null` = the branch working hours apply"
          oneOf:
            - $ref: "#/components/schemas/WeeklyHours"
            - type: "null"
        online_selectable: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ServicePointPatchRequest:
      type: object
      additionalProperties: false
      properties: &servicePointWriteProperties
        type: { type: string, enum: [office, airport, address_zone, hotel] }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 2000 }
        extra_fee:
          description: Non-negative amount, at most 2 decimals (number or decimal string)
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
        working_hours:
          oneOf:
            - $ref: "#/components/schemas/WeeklyHours"
            - type: "null"
        online_selectable: { type: boolean }
        is_active: { type: boolean }

    ServicePointCreateRequest:
      type: object
      additionalProperties: false
      required: [type, name]
      properties: *servicePointWriteProperties

    ServicePointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServicePoint" }

    BranchActivityActor:
      type: object
      required: [uuid, name, surname, email]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: string }

    BranchActivityEntry:
      type: object
      required: [uuid, action, payload, actor, created_at]
      properties:
        uuid: { type: string, format: uuid }
        action: { type: string, example: branches.updated }
        payload: { type: object, additionalProperties: true }
        actor:
          oneOf:
            - $ref: "#/components/schemas/BranchActivityActor"
            - type: "null"
        created_at: { type: string, format: date-time }

    BranchActivityPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BranchActivityEntry" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    ExportRequest:
      type: object
      required: [format]
      properties:
        format: { type: string, enum: [pdf, xlsx, csv, json] }
        query:
          type: object
          description: List filters of the resource (for branches `q`, `city`, `is_active`)
          additionalProperties: { type: string }
        locale: { type: string, enum: [tr, en], default: tr }

    ExportJob:
      type: object
      required: [uuid, resource, format, status, row_count, created_at]
      properties:
        uuid: { type: string, format: uuid }
        resource: { type: string, example: tenant.branches }
        format: { type: string, enum: [pdf, xlsx, csv, json] }
        status: { type: string, enum: [queued, processing, completed, failed] }
        row_count: { type: integer }
        error: { type: [string, "null"] }
        download_url: { type: [string, "null"], example: /v1/tenant/exports/00000000-0000-0000-0000-000000000000/download }
        created_at: { type: string, format: date-time }

    ImportUploadForm:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        format: { type: string, enum: [json, xlsx, csv, tsv], default: csv }
        locale: { type: string, enum: [tr, en], default: tr }

    ImportMappingRequest:
      type: object
      required: [mapping]
      properties:
        mapping:
          type: object
          description: Source column → field key
          additionalProperties: { type: string }
        defaults:
          type: object
          additionalProperties: { type: string }

    ImportPreviewSummary:
      type: object
      required: [total, valid, invalid]
      properties:
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        rows:
          type: [array, "null"]
          items:
            type: object
            required: [index, data]
            properties:
              index: { type: integer }
              data: { type: object, additionalProperties: true }
        errors:
          type: [array, "null"]
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer }
              field: { type: string }
              error: { type: string }

    ImportJob:
      type: object
      required: [uuid, resource, format, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        resource: { type: string, example: tenant.branches }
        format: { type: string, enum: [json, xlsx, csv, tsv] }
        status: { type: string, enum: [uploaded, mapped, previewed, queued, applying, applied, failed, rolled_back] }
        mapping: { type: object, additionalProperties: { type: string } }
        defaults: { type: object, additionalProperties: { type: string } }
        preview_summary: { $ref: "#/components/schemas/ImportPreviewSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    EnvelopeBranch:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Branch" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBranchPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBranchFacets:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchFacets" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServicePoint:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ServicePoint" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServicePointList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ServicePointList" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBranchImage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchImage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBranchImageList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchImageList" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBranchActivityPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BranchActivityPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeExportJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ExportJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeImportJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ImportJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    IntegrationField:
      type: object
      required: [key, label_key, secret, required]
      properties:
        key: { type: string }
        label_key: { type: string }
        secret: { type: boolean }
        required: { type: boolean }

    IntegrationProvider:
      type: object
      required: [kind, provider, fields, modes]
      properties:
        kind: { type: string, enum: [payment, sms, whatsapp, email] }
        provider: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IntegrationField" }
        modes:
          type: array
          items: { type: string, enum: [sandbox, live] }

    EnvelopeIntegrationsMeta:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              items: { $ref: "#/components/schemas/IntegrationProvider" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    IntegrationAccount:
      type: object
      description: "Never carries secrets: `credentials_hint` holds masked values."
      required: [uuid, kind, provider, display_name, mode, status, credentials_hint, last_checked_at, last_check_status, last_check_error, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [payment, sms, whatsapp, email] }
        provider: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        display_name: { type: string }
        mode: { type: string, enum: [sandbox, live] }
        status: { type: string, enum: [active, disabled] }
        credentials_hint:
          type: object
          additionalProperties: { type: string }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_check_status: { type: string, enum: ["", ok, failed] }
        last_check_error: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IntegrationField" }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/IntegrationActor"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnvelopeIntegrationAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/IntegrationAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeIntegrationAccountPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/IntegrationAccount" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    IntegrationJobStatus:
      type: string
      description: |
        `pending` = pending_submit, `submitted` = accepted by the provider (final state from CheckStatus),
        `needs_verification` = outcome unknown (only CheckStatus moves it on), `processing` = held by a
        worker (payments), `ignored` = a notification that needs no action. Held (the runner never calls the
        provider): `blocked` = required data is missing, `waiting_dependency` = no working adapter. Staff
        resolutions (final): `reported_manually`, `reconciled`.
      enum: [pending, processing, submitted, succeeded, failed, ignored, needs_verification, blocked, waiting_dependency, reported_manually, reconciled]

    IntegrationJob:
      type: object
      required: [uuid, direction, provider, kind, status, priority, attempts, max_attempts, deliveries, last_error, ref_type, ref_uuid, next_attempt_at, submitted_at, completed_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        provider: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/IntegrationJobStatus" }
        priority: { type: string, enum: [critical, normal] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        deliveries: { type: integer }
        last_error: { type: string }
        ref_type: { type: string }
        ref_uuid: { type: [string, "null"], format: uuid }
        next_attempt_at: { type: [string, "null"], format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IntegrationAttempt:
      type: object
      required: [uuid, attempt_no, operation, trigger, outcome, request_summary, response_summary, error, started_at, finished_at, duration_ms]
      properties:
        uuid: { type: string, format: uuid }
        attempt_no: { type: integer }
        operation: { type: string, enum: [submit, check_status] }
        trigger: { type: string, enum: [worker, sweep, retry, inline] }
        outcome: { type: string, enum: [succeeded, accepted, pending, failed, not_found, uncertain, unsupported] }
        request_summary: { type: object, additionalProperties: true }
        response_summary: { type: object, additionalProperties: true }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer }

    IntegrationJobDetail:
      type: object
      required: [uuid, account_uuid, direction, provider, kind, status, priority, attempts, max_attempts, deliveries, last_error, provider_ref, payload, result, ref_type, ref_uuid, next_attempt_at, submitted_at, completed_at, created_at, updated_at, retryable, attempt_log]
      properties:
        uuid: { type: string, format: uuid }
        account_uuid: { type: [string, "null"], format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        provider: { type: string }
        kind: { type: string }
        status: { $ref: "#/components/schemas/IntegrationJobStatus" }
        priority: { type: string, enum: [critical, normal] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        deliveries: { type: integer }
        last_error: { type: string }
        provider_ref: { type: string }
        payload: { type: object, additionalProperties: true, description: "References and non-secret facts only." }
        result: { type: object, additionalProperties: true }
        ref_type: { type: string }
        ref_uuid: { type: [string, "null"], format: uuid }
        next_attempt_at: { type: [string, "null"], format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        retryable: { type: boolean, description: "A staff retry applies (outbound, not a payment refund, not succeeded)." }
        attempt_log:
          type: array
          items: { $ref: "#/components/schemas/IntegrationAttempt" }

    EnvelopeIntegrationJobDetail:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/IntegrationJobDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeIntegrationJobRetry:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [action, job]
          properties:
            action: { type: string, enum: [already_done, in_progress, resubmitted] }
            job: { $ref: "#/components/schemas/IntegrationJobDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeIntegrationJobPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/IntegrationJob" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    IntegrationActor:
      type: object
      required: [uuid, name, surname, email]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: string }

    TenantOrganization:
      type: object
      required: [uuid, slug, name, status, access_ends_at, sector, timezone, currency]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string, example: acme }
        name: { type: string, example: Acme }
        status: { type: string, enum: [active, suspended] }
        access_ends_at:
          type: [string, "null"]
          format: date-time
          description: End of the access window; `null` = no end
        sector: { $ref: "#/components/schemas/SectorCode" }
        timezone: { type: string, example: Europe/Istanbul }
        currency: { type: string, pattern: "^[A-Z]{3}$", example: TRY }

    SectorCode:
      type: string
      enum: [hairdresser, restaurant, gym, car_wash, clinic, beauty_salon]
      description: Business sector (TEC-882); the catalog is `GET /v1/sectors`

    SectorModule:
      type: string
      enum: [reservations, calendar, customers, services, packages, products, staff, staff_shares, resources, classes, vehicles, cash, finance, reports, confirmation, booking_page]

    Sector:
      type: object
      description: "What a sector changes: default booking flow, capacity a reservation holds, the panel's words and visible modules"
      required: [code, flow, capacity, terms, modules, highlights]
      properties:
        code: { $ref: "#/components/schemas/SectorCode" }
        flow:
          type: array
          description: Default customer booking flow
          items:
            type: string
            enum: [branch, service, staff, party_size, session_type, class, vehicle, appointment_type, datetime, area, products, contact, summary, payment]
        capacity:
          type: object
          required: [staff, resources, resource_required, group_sessions, party_size]
          properties:
            staff: { type: string, enum: [required, optional, none] }
            resources:
              type: array
              items: { type: string, enum: [chair, table, area, room, device, bay] }
            resource_required: { type: boolean }
            group_sessions: { type: boolean }
            party_size: { type: boolean }
        terms:
          type: object
          description: Term codes the clients translate (`sectors.terms.<code>`)
          required: [staff, resource, booking]
          properties:
            staff: { type: string, example: specialist }
            resource: { type: string, example: room_device }
            booking: { type: string, example: appointment }
        modules:
          type: array
          description: Visible panel modules in display order
          items: { $ref: "#/components/schemas/SectorModule" }
        highlights:
          type: array
          description: Modules the panel puts first (subset of `modules`)
          items: { $ref: "#/components/schemas/SectorModule" }

    PlanCode:
      type: string
      enum: [starter, growth, enterprise]
      description: Plan (TEC-883); a set of default limits, no price

    Addon:
      type: string
      enum: [confirmation]
      description: Module sold on top of the plan (Konfirmasyon)

    Plan:
      type: object
      required: [code, branch_limit, staff_limit]
      properties:
        code: { $ref: "#/components/schemas/PlanCode" }
        branch_limit: { type: [integer, "null"], description: "`null` = unlimited" }
        staff_limit: { type: [integer, "null"], description: "`null` = unlimited" }

    Entitlements:
      type: object
      required: [plan, addons, branch_limit, staff_limit, modules]
      properties:
        plan: { $ref: "#/components/schemas/PlanCode" }
        addons:
          type: array
          items: { $ref: "#/components/schemas/Addon" }
        branch_limit: { type: [integer, "null"], description: "Effective limit (override, else plan); `null` = unlimited" }
        staff_limit: { type: [integer, "null"], description: "Staff seats: members plus open invitations; `null` = unlimited" }
        modules:
          type: array
          description: Modules the organization may use (the sector's modules minus add-ons not granted)
          items: { $ref: "#/components/schemas/SectorModule" }

    EntitlementSummary:
      allOf:
        - $ref: "#/components/schemas/Entitlements"
        - type: object
          required: [used, period, usage]
          properties:
            used:
              type: object
              required: [branches, staff]
              properties:
                branches: { type: integer }
                staff: { type: integer }
            period: { type: string, example: "2026-10", description: Current month in the organization time zone }
            usage:
              type: array
              items:
                type: object
                required: [metric, quantity]
                properties:
                  metric: { type: string, enum: [sms, whatsapp, email, voice_call] }
                  quantity: { type: integer }

    PlatformEntitlements:
      allOf:
        - $ref: "#/components/schemas/EntitlementSummary"
        - type: object
          required: [overrides, catalog]
          properties:
            overrides:
              type: object
              required: [branch_limit, staff_limit]
              properties:
                branch_limit: { type: [integer, "null"] }
                staff_limit: { type: [integer, "null"] }
            catalog:
              type: object
              required: [plans, addons]
              properties:
                plans:
                  type: array
                  items: { $ref: "#/components/schemas/Plan" }
                addons:
                  type: array
                  items: { $ref: "#/components/schemas/Addon" }

    SetEntitlementsRequest:
      type: object
      required: [plan, addons, branch_limit, staff_limit]
      additionalProperties: false
      properties:
        plan: { $ref: "#/components/schemas/PlanCode" }
        addons:
          type: array
          items: { $ref: "#/components/schemas/Addon" }
        branch_limit: { type: [integer, "null"], minimum: 1, description: "Override; `null` = plan default" }
        staff_limit: { type: [integer, "null"], minimum: 1, description: "Override; `null` = plan default" }

    UsageCounter:
      type: object
      required: [metric, quantity]
      properties:
        metric: { type: string, enum: [sms, whatsapp, email, voice_call] }
        quantity: { type: integer }

    OverviewAccount:
      type: object
      description: A connected provider account of the business (no secrets)
      required: [uuid, provider, display_name, mode, status, last_check_status, last_checked_at]
      properties:
        uuid: { type: string, format: uuid }
        provider: { type: string, example: netgsm }
        display_name: { type: string }
        mode: { type: string, enum: [sandbox, live] }
        status: { type: string, enum: [active, disabled] }
        last_check_status: { type: string, enum: ["", ok, failed] }
        last_checked_at: { type: [string, "null"], format: date-time }

    OverviewChannel:
      type: object
      required: [channel, status, account, usage, sent, failed, skipped]
      properties:
        channel: { type: string, enum: [sms, whatsapp, email, voice_call] }
        status:
          type: string
          enum: [ready, not_ready, unavailable]
          description: "`ready`: a provider delivers now; `not_ready`: sends are recorded as skipped; `unavailable`: no adapter in this version"
        account:
          description: The business's own account of the channel, if any (active first)
          oneOf:
            - $ref: "#/components/schemas/OverviewAccount"
            - type: "null"
        usage: { type: integer, description: Counted use this month }
        sent: { type: integer, description: Customer notifications sent or delivered this month }
        failed: { type: integer }
        skipped: { type: integer, description: "Not sent (channel not ready, no address)" }

    OrganizationOverview:
      type: object
      required: [period, previous_period, entitlements, previous_usage, catalogue, reservations, confirmation, channels, payment]
      properties:
        period: { type: string, example: "2026-10" }
        previous_period: { type: string, example: "2026-09" }
        entitlements: { $ref: "#/components/schemas/EntitlementSummary" }
        previous_usage:
          type: array
          items: { $ref: "#/components/schemas/UsageCounter" }
        catalogue:
          type: object
          required: [customers, services]
          properties:
            customers: { type: integer }
            services: { type: integer }
        reservations:
          type: object
          required: [total, this_month, previous_month, cancelled_this_month, upcoming, monthly]
          properties:
            total: { type: integer }
            this_month: { type: integer }
            previous_month: { type: integer }
            cancelled_this_month: { type: integer, description: "Cancelled, rejected or no-show bookings taken this month" }
            upcoming: { type: integer, description: Requested or active visits that start after now }
            monthly:
              type: array
              description: The last six months, oldest first
              items:
                type: object
                required: [period, reservations]
                properties:
                  period: { type: string, example: "2026-10" }
                  reservations: { type: integer }
        confirmation:
          type: object
          description: The Konfirmasyon right; its channel use is counted under `channels`
          required: [sector_offers, granted, active, total, confirmed, declined, expired, open]
          properties:
            sector_offers: { type: boolean }
            granted: { type: boolean, description: The add-on is assigned }
            active: { type: boolean, description: Sector offers it and the add-on is granted }
            total: { type: integer, description: Confirmation tasks planned this month }
            confirmed: { type: integer }
            declined: { type: integer }
            expired: { type: integer }
            open: { type: integer }
        channels:
          type: array
          items: { $ref: "#/components/schemas/OverviewChannel" }
        payment:
          type: object
          required: [status, account, online_cash_accounts]
          properties:
            status:
              type: string
              enum: [ready, not_connected, no_cash_account, provider_unavailable]
            account:
              oneOf:
                - $ref: "#/components/schemas/OverviewAccount"
                - type: "null"
            online_cash_accounts: { type: integer }

    EnvelopeOrganizationOverview:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OrganizationOverview" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeEntitlementSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/EntitlementSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePlatformEntitlements:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PlatformEntitlements" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSectorList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Sector" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantRoleRef:
      type: object
      required: [uuid, key, name, is_template]
      properties:
        uuid: { type: string, format: uuid }
        key: { type: string, example: sube_yoneticisi }
        name: { type: string, example: Şube Yöneticisi }
        is_template: { type: boolean }

    BranchRef:
      type: object
      required: [uuid, code, name]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string, example: MRK }
        name: { type: string, example: Merkez }

    TenantMemberUser:
      type: object
      required: [uuid, email, name, surname, status]
      properties:
        uuid: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        surname: { type: string }
        status: { type: string }

    TenantMember:
      type: object
      required: [user, roles, branch_scope, branches, last_login_at, created_at, updated_at]
      properties:
        user: { $ref: "#/components/schemas/TenantMemberUser" }
        roles:
          type: array
          description: Every role of the member; permissions are their union
          items: { $ref: "#/components/schemas/TenantRoleRef" }
        branch_scope:
          type: string
          enum: [all, selected]
          description: "`all` = every branch; `selected` = only `branches`"
        branches:
          type: array
          description: Granted branches (empty unless `branch_scope` is `selected`)
          items: { $ref: "#/components/schemas/BranchRef" }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantMemberPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantMember" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    TenantMemberPatchRequest:
      type: object
      additionalProperties: false
      properties:
        role_uuids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        branch_scope: { type: string, enum: [all, selected] }
        branch_uuids:
          type: array
          description: Required with `branch_scope` = `selected`
          items: { type: string, format: uuid }

    TenantRole:
      type: object
      required: [uuid, key, name, description, is_template, member_count, permissions, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        key: { type: string, example: gece_vardiyasi }
        name: { type: string }
        description: { type: string }
        is_template:
          type: boolean
          description: Template roles are shared by every organization and read-only
        member_count: { type: integer, format: int64 }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantRolePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantRole" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    TenantRoleRequest:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          description: "Create only: `^[a-z][a-z0-9_]{1,63}$`; defaults to the slugified name"
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          items: { type: string, example: tenant.branches.read }

    TenantPermission:
      type: object
      required: [slug, name]
      properties:
