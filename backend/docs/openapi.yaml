          items: { type: string, example: reservation.payment_hold_minutes }
        created_at: { type: [string, "null"], format: date-time }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/OrganizationSettingsActor"
            - type: "null"

    OrganizationSettingsVersionSummary:
