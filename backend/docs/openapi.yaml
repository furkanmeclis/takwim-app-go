        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/products/{uuid}/image:
    put:
      tags: [Tenant]
      operationId: putTenantProductImage
      summary: Upload the cover image of a product
      description: "`tenant.products.write`. JPEG, PNG or WebP up to 5 MiB (sniffed); replaces the previous cover."
