      properties:
        product_uuid: { type: string, format: uuid }
        variant_uuid: { type: [string, "null"], format: uuid, description: Required when the product has variants. }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        staff_uuid: { type: [string, "null"], format: uuid, description: "Credited with the sale; default: the person of the first line." }

    TenantReservationProductRequest:
      type: object
      additionalProperties: false
      required: [product_uuid, quantity]
      properties:
        product_uuid: { type: string, format: uuid }
        variant_uuid: { type: [string, "null"], format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        staff_uuid: { type: [string, "null"], format: uuid }
        expected_version: { type: integer }

    TenantReservationProduct:
      type: object
      required: [uuid, product, variant, sku, quantity, unit_price, total, staff, status, release_reason, source, delivered_at, released_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        product: { $ref: "#/components/schemas/TenantAvailabilityRef" }
        variant:
          oneOf:
            - $ref: "#/components/schemas/TenantAvailabilityRef"
            - type: "null"
        sku: { type: string }
        quantity: { type: integer }
        unit_price: { $ref: "#/components/schemas/MoneyAmount" }
        total: { $ref: "#/components/schemas/MoneyAmount" }
        staff:
          oneOf:
            - $ref: "#/components/schemas/TenantAvailabilityRef"
            - type: "null"
        status:
          type: string
          enum: [held, delivered, released]
          description: "held: units reserved in the branch; delivered: handed over on completion (stock sale + product sale line); released: free again."
        release_reason: { type: [string, "null"], enum: [removed, cancelled, rejected, expired, no_show, null] }
        source: { type: string, enum: [panel, online, embed] }
        delivered_at: { type: [string, "null"], format: date-time }
        released_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    TenantReservationProductOption:
      type: object
      required: [product_uuid, product_name, sku, variant_uuid, variant_name, price, available]
      properties:
        product_uuid: { type: string, format: uuid }
        product_name: { type: string }
        sku: { type: string }
        variant_uuid: { type: [string, "null"], format: uuid }
        variant_name: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        available: { type: integer, format: int64, description: Units on hand minus reserved in the visit's branch. }

    EnvelopeTenantReservationProductOptions:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TenantReservationProductOption" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantReservation:
      type: object
      required: [uuid, number, status, approval_mode, approval_status, confirmation_status, payment_status, source, branch, customer, starts_at, ends_at, total_price, currency, custom_fields, custom_answers, settings_version, customer_note, internal_note, version, cancel_reason, hold_expires_at, lines, products, events, created_at, updated_at, party_size, zone, vehicle]
      properties:
        party_size: { type: [integer, "null"], description: Number of people (restaurant) or seats of a group class. }
        zone: { type: string, description: Area asked for; empty = any. }
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/ReservationVehicle"
            - type: "null"
        uuid: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/TenantReservationStatus" }
        approval_mode: { type: string, enum: [auto, staff, panel] }
        approval_status: { $ref: "#/components/schemas/TenantReservationApprovalStatus" }
        confirmation_status: { $ref: "#/components/schemas/TenantReservationConfirmationStatus" }
        payment_status: { $ref: "#/components/schemas/TenantReservationPaymentStatus" }
        source: { $ref: "#/components/schemas/TenantReservationSource" }
        branch: { $ref: "#/components/schemas/TenantAvailabilityRef" }
        customer: { $ref: "#/components/schemas/TenantAvailabilityRef" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        total_price: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        custom_fields: { type: object, additionalProperties: true }
        custom_answers:
          type: array
          description: The answers with the question each was answered under, in the form's order.
          items: { $ref: "#/components/schemas/TenantReservationAnswer" }
        settings_version:
          type: [integer, "null"]
          description: The business settings version the booking was made under (null before TEC-905).
        customer_note: { type: string }
        internal_note: { type: string }
        version: { type: integer }
        cancel_reason: { type: [string, "null"] }
        hold_expires_at: { type: [string, "null"], format: date-time, description: When a waiting request lets its capacity go. }
        confirmation:
          oneOf:
            - $ref: "#/components/schemas/TenantReservationConfirmation"
            - type: "null"
        lines:
          type: array
          items:
            type: object
            required: [index, service_uuid, service_name, staff, resources, starts_at, ends_at, duration_minutes, buffer_before_minutes, buffer_after_minutes, unit_price]
            properties:
              index: { type: integer }
              service_uuid: { type: [string, "null"], format: uuid, description: Null when the service was deleted (the name stays). }
              service_name: { type: string }
              staff:
                oneOf:
                  - type: object
                    required: [uuid, name]
                    properties:
                      uuid: { type: [string, "null"], format: uuid }
                      name: { type: string }
                  - type: "null"
              resources:
                type: array
                items: { $ref: "#/components/schemas/TenantAvailabilityResourceRef" }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              duration_minutes: { type: integer }
              buffer_before_minutes: { type: integer }
              buffer_after_minutes: { type: integer }
              unit_price: { $ref: "#/components/schemas/MoneyAmount" }
        products:
          type: array
          items: { $ref: "#/components/schemas/TenantReservationProduct" }
        events:
          type: array
          items:
            type: object
            required: [version, type, from_status, to_status, actor, note, created_at]
            properties:
              version: { type: integer }
              type:
                type: string
                enum: [created, accepted, rejected, cancelled, started, completed, no_show, paid, expired, rescheduled, notes_updated,
                  payment_recorded, late_payment, product_added, product_removed,
                  confirmation_scheduled, confirmation_requested, confirmation_confirmed, confirmation_declined,
                  confirmation_change_requested, confirmation_expired, confirmation_dropped]
              from_status: { type: [string, "null"] }
              to_status: { type: [string, "null"] }
              actor: { type: [string, "null"] }
              note: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnvelopeTenantReservation:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantReservation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantReservationPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantReservationPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantReservationCalendar:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantReservationCalendar" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantReservationAgenda:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantReservationAgenda" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantReservationForm:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [fields, hidden_steps]
          properties:
            fields:
              type: array
              items: { $ref: "#/components/schemas/OrganizationBookingField" }
            hidden_steps:
              type: array
              items: { type: string, enum: [staff, products, area] }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TenantReservationAnswer:
      type: object
      description: >-
        A booking form answer with its question as it was answered (TEC-905).
        An older answer without a stored question has its key as label.
      required: [key, label, type, value, online]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, select, checkbox] }
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        online: { type: boolean, description: The question is asked on the customer screens. }

    EnvelopeTenantReservationFacets:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantReservationFacets" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantCustomer:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantCustomer" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantCustomerPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantCustomerPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTenantCustomerFacets:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantCustomerFacets" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeResourceMeta:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ResourceMeta" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeUnreadCount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/UnreadCount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    HealthzResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]

    BulkTarget:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [ids, query]
        ids:
          type: array
          items: { type: string, format: uuid }
        query:
          type: object
          additionalProperties: { type: string }
        params:
          type: object
          description: Arguments of a parameterised action (for example `tag` of the customer `add_tag` action).
          additionalProperties: { type: string }

    BulkExecuteRequest:
      type: object
      required: [action, target]
      properties:
        action: { type: string }
        target: { $ref: "#/components/schemas/BulkTarget" }
        locale: { type: string, enum: [tr, en] }

    BulkSummary:
      type: object
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        skipped:
          type: integer
          description: Items left as they were because the action does not apply to them (not counted in `failed`).
        issues:
          type: array
          description: The first 200 skipped or failed items the caller can see (named by `label`); unknown ids are only counted.
          items: { $ref: "#/components/schemas/BulkIssue" }

    BulkIssue:
      type: object
      required: [entity_uuid, error]
      properties:
        entity_uuid: { type: string, format: uuid }
        label: { type: string, description: "How the item is shown in the report (for example `#42`)." }
        error: { type: string, description: "Reason code, for example `invalid_transition`, `stale`, `not_found`." }
        skipped: { type: boolean }

    BulkJob:
      type: object
      required: [uuid, resource, action, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        resource: { type: string }
        action: { type: string }
        status: { type: string }
        target: { $ref: "#/components/schemas/BulkTarget" }
        summary: { $ref: "#/components/schemas/BulkSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    EnvelopeBulkJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/BulkJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkSyncResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            sync: { type: boolean }
            summary: { $ref: "#/components/schemas/BulkSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeBulkJobPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BulkJob" }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ReadyzResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          examples: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
          properties:
            postgres:
              type: string
              examples: [ok, down]
            redis:
              type: string
              examples: [ok, down]

    # --- Public booking API (TEC-906) ----------------------------------------

    PublicRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    PublicChannel:
      type: string
      enum: [web, widget, api]
      default: web
      description: Sales channel of the caller (business settings `sales_channels`); the mobile app and partners use `api`.

    PublicBusiness:
      type: object
      required: [uuid, slug, name, logo_url, sector, timezone, currency, flow, terms, contact, policies, booking, branch_count, embed]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        logo_url: { type: [string, "null"], description: "API-owned logo URL (versioned)." }
        sector: { type: string, enum: [hairdresser, restaurant, gym, car_wash, clinic, beauty_salon] }
        timezone: { type: string, example: Europe/Istanbul }
        currency: { type: string, example: TRY }
        flow:
          type: array
          description: The customer booking steps, the sector's flow without the optional steps the business hides (TEC-905).
          items: { type: string }
        terms:
          type: object
          description: Sector term codes (`staff`, `resource`, `booking`).
          additionalProperties: { type: string }
        contact:
          type: object
          required: [phone, email, website, address]
          properties:
            phone: { type: string }
            email: { type: string }
            website: { type: string }
            address: { type: string }
        policies:
          type: object
          required: [cancellation, change, no_show]
          properties:
            cancellation: { type: string }
            change: { type: string }
            no_show: { type: string }
        booking:
          type: object
          required: [channels, ready, unavailable, approval_mode, min_lead_minutes, max_advance_days, cancel_cutoff_minutes, change_cutoff_minutes, payment_methods, online_payment_ready, checkout_minutes, slot_step_minutes, max_open_per_customer, hidden_steps, fields]
          properties:
            channels:
              type: object
              additionalProperties: { type: boolean }
              description: "`web`, `widget`, `api` switched on or off."
            ready: { type: boolean, description: "Booking rules complete and the plan includes the booking page." }
            unavailable:
              type: array
              items: { type: string, enum: [module_disabled, online_not_ready] }
            approval_mode: { type: string, enum: ["", auto, staff] }
            min_lead_minutes: { type: [integer, "null"] }
            max_advance_days: { type: [integer, "null"] }
            cancel_cutoff_minutes: { type: [integer, "null"] }
            change_cutoff_minutes: { type: [integer, "null"] }
            payment_methods:
              type: array
              items: { type: string, enum: [on_site, online] }
            online_payment_ready:
              type: boolean
              description: Online payment is offered and the business has a working payment provider and an online cash account; the customer pays on the provider's page after booking.
            checkout_minutes: { type: integer }
            slot_step_minutes:
              type: [integer, "null"]
              description: Distance between the starts offered online; availability uses it whatever the request asks (null = the client's step).
            max_open_per_customer:
              type: [integer, "null"]
              description: Most open bookings a customer may hold; a booking over it is 400 `customer` / `open_limit` (null = no limit).
            hidden_steps:
              type: array
              items: { type: string, enum: [staff, products, area] }
              description: >-
                Optional steps the business hides (already left out of `flow`).
                A person on a line is then 400 `lines.N.staff_uuid` / `not_offered`,
                products `products` / `not_offered`, a zone `zone` / `not_offered`.
            fields:
              type: array
              description: The booking form questions asked online, in order; answers go in the booking's `custom_fields` by key.
              items: { $ref: "#/components/schemas/PublicBookingField" }
        branch_count: { type: integer }
        embed:
          type: object
          required: [allowed_origins]
          description: The embedded booking screen (`/embed/{slug}`, TEC-908).
          properties:
            allowed_origins:
              type: array
              description: Sites allowed to frame the booking screen (its `frame-ancestors` policy and the only targets of its height messages). Empty = no other site.
              items: { type: string, example: "https://www.example.com" }

    PublicBookingField:
      type: object
      required: [key, label, help, type, options, required]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        type: { type: string, enum: [text, number, select, checkbox] }
        options: { type: array, items: { type: string } }
        required: { type: boolean, description: A required checkbox must be true. }

    PublicBookingAnswer:
      type: object
      required: [key, label, type, value]
      properties:
        key: { type: string }
        label: { type: string, description: The question as it was when answered. }
        type: { type: string, enum: [text, number, select, checkbox] }
        value:
          description: Text, number or boolean answer.
          oneOf:
            - type: string
            - type: number
            - type: boolean

    PublicBranch:
      type: object
      required: [uuid, slug, name, description, address, city, district, latitude, longitude, phone, email, timezone, working_hours, special_days, images, zones]
      properties:
        zones:
          type: array
          description: Areas a party may ask for (zones of the online tables and areas), for the restaurant flow's area step.
          items: { type: string }
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        district: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        phone: { type: string }
        email: { type: string }
        timezone: { type: string }
        working_hours:
          type: object
          description: "Weekday key (`mon` … `sun`) → hours."
          additionalProperties:
            type: object
            required: [closed, open, close]
            properties:
              closed: { type: boolean }
              open: { type: string, example: "09:00" }
              close: { type: string, example: "18:00" }
        special_days:
          type: array
          items:
            type: object
            required: [date, closed, open, close, note]
            properties:
              date: { type: string, format: date }
              closed: { type: boolean }
              open: { type: string }
              close: { type: string }
              note: { type: string }
        images:
          type: array
          items:
            type: object
            required: [uuid, url]
            properties:
              uuid: { type: string, format: uuid }
              url: { type: string }

    PublicService:
      type: object
      required: [uuid, name, description, category, duration_minutes, price, currency, payment_mode, staff_mode, image_url, branches, staff]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category:
          oneOf:
            - $ref: "#/components/schemas/PublicRef"
            - type: "null"
        duration_minutes: { type: integer, description: "The branch's with a branch filter, else the list value." }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        payment_mode: { type: string, enum: [on_site, online, both] }
        staff_mode: { type: string, enum: [required, optional, none] }
        image_url: { type: [string, "null"] }
        branches:
          type: array
          items:
            type: object
            required: [branch_uuid, price, duration_minutes]
            properties:
              branch_uuid: { type: string, format: uuid }
              price: { $ref: "#/components/schemas/MoneyAmount" }
              duration_minutes: { type: integer }
        staff:
          type: array
          items:
            type: object
            required: [staff_uuid, price, duration_minutes]
            properties:
              staff_uuid: { type: string, format: uuid }
              price:
                oneOf:
                  - $ref: "#/components/schemas/MoneyAmount"
                  - type: "null"
              duration_minutes: { type: [integer, "null"] }

    PublicStaff:
      type: object
      required: [uuid, name, title, bio, branch_uuids, service_uuids]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        title: { type: string }
        bio: { type: string }
        branch_uuids:
          type: array
          items: { type: string, format: uuid }
        service_uuids:
          type: array
          items: { type: string, format: uuid }

    PublicLineInput:
      type: object
      additionalProperties: false
      required: [service_uuid]
      properties:
        service_uuid: { type: string, format: uuid }
        staff_uuid:
          type: [string, "null"]
          format: uuid
          description: A person shown online who performs the service in the branch; null = anyone free.

    PublicAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [branch_uuid, lines]
      properties:
        party_size:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
          description: Number of people (restaurant; required when the sector books by party and a service takes a resource). Every resource must seat the party.
        zone:
          type: string
          maxLength: 64
          description: Area of the branch (resource zone) the resources must be in; empty = any.
        branch_uuid: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/PublicLineInput" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        step_minutes: { type: integer, minimum: 5, maximum: 240, multipleOf: 5, default: 15 }
        channel: { $ref: "#/components/schemas/PublicChannel" }

    PublicSlotLine:
      type: object
      required: [service_uuid, starts_at, ends_at, staff, seats_left]
      properties:
        service_uuid: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        staff:
          oneOf:
            - $ref: "#/components/schemas/PublicRef"
            - type: "null"
        seats_left: { type: [integer, "null"], description: Free seats of a group class session; null for an individual service. }

    PublicAvailability:
      type: object
      required: [branch, timezone, earliest_start, latest_date, step_minutes, lines, days]
      properties:
        branch: { $ref: "#/components/schemas/PublicRef" }
        timezone: { type: string }
        earliest_start: { type: string, format: date-time }
        latest_date: { type: [string, "null"], format: date }
        step_minutes: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [service_uuid, service_name, duration_minutes, staff_mode, staff, group_capacity]
            properties:
              service_uuid: { type: string, format: uuid }
              service_name: { type: string }
              duration_minutes: { type: integer }
              staff_mode: { type: string, enum: [required, optional, none] }
              staff:
                type: array
                items: { $ref: "#/components/schemas/PublicRef" }
              group_capacity: { type: [integer, "null"], description: Seats of a group class session; null = individual. }
        days:
          type: array
          items:
            type: object
            required: [date, status, slots]
            properties:
              date: { type: string, format: date }
              status: { type: string, enum: [available, closed, too_far, too_soon, no_staff, full] }
              slots:
                type: array
                items:
                  type: object
                  required: [starts_at, ends_at, lines]
                  properties:
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                    lines:
                      type: array
                      items: { $ref: "#/components/schemas/PublicSlotLine" }

    PublicCheckoutRequest:
      type: object
      additionalProperties: false
      required: [branch_uuid, lines, starts_at]
      properties:
        party_size:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
          description: Number of people (restaurant; required when the sector books by party and a service takes a resource). Every resource must seat the party.
        zone:
          type: string
          maxLength: 64
          description: Area of the branch (resource zone) the resources must be in; empty = any.
        branch_uuid: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/PublicLineInput" }
        starts_at: { type: string, format: date-time, description: "A slot start from the availability answer." }
        channel: { $ref: "#/components/schemas/PublicChannel" }

    PublicCheckout:
      type: object
      required: [token, status, channel, branch, starts_at, ends_at, expires_at, lines, reservation_uuid, party_size, zone]
      properties:
        party_size: { type: [integer, "null"], description: Number of people (restaurant). }
        zone: { type: string, description: Area asked for; empty = any. }
        token: { type: string, format: uuid, description: "The checkout token (secret of the client)." }
        status: { type: string, enum: [active, expired, released, booked] }
        channel: { $ref: "#/components/schemas/PublicChannel" }
        branch: { $ref: "#/components/schemas/PublicRef" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PublicSlotLine" }
        reservation_uuid: { type: [string, "null"], format: uuid }

    PublicProduct:
      type: object
      required: [product_uuid, name, variant_uuid, variant_name, price, max_quantity, image_url]
      properties:
        product_uuid: { type: string, format: uuid }
        name: { type: string }
        variant_uuid: { type: [string, "null"], format: uuid }
        variant_name: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        max_quantity: { type: integer, minimum: 1, maximum: 10 }
        image_url: { type: [string, "null"] }

    EnvelopePublicProductList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicProduct" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PublicBookingRequest:
      type: object
      additionalProperties: false
      required: [checkout_token, customer]
      properties:
        checkout_token: { type: string, format: uuid }
        customer:
          type: object
          additionalProperties: false
          required: [first_name, phone]
          properties:
            first_name: { type: string, maxLength: 80 }
            last_name: { type: string, maxLength: 80 }
            phone: { type: string, description: "Any common format; normalized to E.164 (Turkish without a country code)." }
            email: { type: string, maxLength: 254 }
            sms_consent: { type: boolean, default: false }
            email_consent: { type: boolean, default: false }
        payment: { type: string, enum: [on_site, online], description: "Default: on site when the business and every service allow it." }
        customer_note: { type: string, maxLength: 2000 }
        custom_fields:
          type: object
          additionalProperties: true
          description: >-
            Answers to the online questions (`booking.fields`) by key: text,
            number, one of a select's options, or a boolean for a checkbox.
            Missing required answers and bad values are 400
            `custom_fields.<key>`; keys of other questions are dropped.
        website: { type: string, description: "Honeypot: hidden from people, must stay empty." }
        vehicle:
          description: The vehicle of a car wash booking (optional).
          oneOf:
            - $ref: "#/components/schemas/ReservationVehicle"
            - type: "null"
        products:
          type: array
          maxItems: 20
          description: "Optional products from `GET …/products` of the checkout's branch (TEC-919), reserved with the booking. Not enough units: `400` `products[i].quantity` / `insufficient_stock`."
          items:
            type: object
            additionalProperties: false
            required: [product_uuid, quantity]
            properties:
              product_uuid: { type: string, format: uuid }
              variant_uuid: { type: [string, "null"], format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 10 }

    PublicReservation:
      type: object
      required: [uuid, number, status, approval_status, confirmation_status, payment_status, branch, timezone, starts_at, ends_at, total_price, currency, customer_note, answers, expires_at, cancel_reason, can_pay_online, lines, products, created_at, party_size, zone, vehicle]
      properties:
        answers:
          type: array
          description: Answers to the booking form questions asked online (TEC-905).
          items: { $ref: "#/components/schemas/PublicBookingAnswer" }
        party_size: { type: [integer, "null"], description: Number of people (restaurant) or seats of a group class. }
        zone: { type: string, description: Area asked for; empty = any. }
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/ReservationVehicle"
            - type: "null"
        uuid: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { type: string, enum: [requested, active, in_service, completed, cancelled, rejected, no_show] }
        approval_status: { type: string, enum: [pending, accepted, rejected] }
        confirmation_status: { type: string, enum: [not_required, scheduled, pending, confirmed, declined, expired] }
        payment_status: { type: string, enum: [on_site, online_pending, paid, refund_pending, partially_refunded, refunded, failed] }
        branch: { $ref: "#/components/schemas/PublicRef" }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        total_price: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        customer_note: { type: string }
        expires_at: { type: [string, "null"], format: date-time, description: "A request waiting for the business or for payment lets its time go then." }
        cancel_reason: { type: [string, "null"] }
        can_pay_online: { type: boolean, description: "The booking waits for its online payment and the page can be opened now (`POST …/payment`)." }
        lines:
          type: array
          items:
            type: object
            required: [service_uuid, service_name, staff, starts_at, ends_at, duration_minutes, unit_price]
            properties:
              service_uuid: { type: [string, "null"], format: uuid }
              service_name: { type: string }
              staff:
                oneOf:
                  - type: object
                    required: [uuid, name]
                    properties:
                      uuid: { type: [string, "null"], format: uuid }
                      name: { type: string }
                  - type: "null"
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              duration_minutes: { type: integer }
              unit_price: { $ref: "#/components/schemas/MoneyAmount" }
        products:
          type: array
          items:
            type: object
            required: [name, variant_name, quantity, unit_price, status]
            properties:
              name: { type: string }
              variant_name: { type: [string, "null"] }
              quantity: { type: integer }
              unit_price: { $ref: "#/components/schemas/MoneyAmount" }
              status: { type: string, enum: [held, delivered, released] }
        created_at: { type: string, format: date-time }
        access_token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Only in the booking answer; send it as `X-Reservation-Token` to the status route.

    EnvelopePublicBusiness:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PublicBusiness" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePublicBranchList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicBranch" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePublicServiceList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicService" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePublicStaffList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: { $ref: "#/components/schemas/PublicStaff" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePublicAvailability:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PublicAvailability" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePublicCheckout:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PublicCheckout" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OnlinePaymentStart:
      type: object
      required: [payment_uuid, redirect_url, amount, currency, expires_at]
      properties:
        payment_uuid: { type: string, format: uuid }
        redirect_url: { type: string, description: The provider's hosted page; send the browser there. }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        expires_at: { type: string, format: date-time }

    EnvelopeOnlinePaymentStart:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/OnlinePaymentStart" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PaymentNotifyResult:
      type: object
      required: [status, duplicate]
      properties:
        status: { type: string, description: "Integration job status (`succeeded`, `ignored`, `failed`)." }
        duplicate: { type: boolean, description: The notification was handled before; nothing ran again. }

    EnvelopePaymentNotifyResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PaymentNotifyResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    TestPaymentPage:
      type: object
      required: [business, slug, reservation_uuid, reservation_number, amount, currency, status, expires_at]
      properties:
        business: { type: string }
        slug: { type: string }
        reservation_uuid: { type: string, format: uuid }
        reservation_number: { type: integer, format: int64 }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        expires_at: { type: string, format: date-time }

    EnvelopeTestPaymentPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TestPaymentPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PaymentAttempt:
      type: object
      required: [uuid, provider, amount, paid_amount, currency, status, outcome, failure_reason, cash_account, expires_at, completed_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        provider: { type: string }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        paid_amount:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        outcome: { type: string, enum: ["", confirmed, recorded, late], description: "`late`: paid after the visit was cancelled; refund pending." }
        failure_reason: { type: string }
        cash_account:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        expires_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CollectAccount:
      type: object
      required: [uuid, name, kind, currency, branch]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [cash, bank, online] }
        currency: { type: string }
        branch: { type: boolean, description: false = a business-wide account. }

    ReservationPayments:
      type: object
      required: [reservation, status, payment_status, currency, expected, paid, remaining, credit, entries, online, can_collect, collect_accounts, refundable, refunds, can_refund, refund_collections, refund_accounts]
      properties:
        reservation:
          type: object
          required: [uuid, number]
          properties:
            uuid: { type: string, format: uuid }
            number: { type: integer, format: int64 }
        status: { type: string }
        payment_status: { type: string, enum: [on_site, online_pending, paid, refund_pending, partially_refunded, refunded, failed] }
        currency: { type: string }
        expected: { $ref: "#/components/schemas/MoneyAmount" }
        paid: { $ref: "#/components/schemas/MoneyAmount" }
        remaining: { $ref: "#/components/schemas/MoneyAmount" }
        credit: { $ref: "#/components/schemas/MoneyAmount" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        online:
          type: array
          items: { $ref: "#/components/schemas/PaymentAttempt" }
        can_collect: { type: boolean }
        collect_accounts:
          type: array
          items: { $ref: "#/components/schemas/CollectAccount" }
        refundable: { $ref: "#/components/schemas/MoneyAmount" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/Refund" }
        can_refund: { type: boolean }
        refund_collections:
          type: array
          items: { $ref: "#/components/schemas/RefundCollection" }
        refund_accounts:
          type: array
          items: { $ref: "#/components/schemas/CollectAccount" }

    Refund:
      type: object
      description: |
        One refund request with its three steps: the request, the
        provider's answer (`provider_status`, empty for a manual refund) and
        the posting to the books (`ledger_entry_uuid`, `reflected_at`).
        `needs_action`: a provider refund still open after the provider was
        asked (unknown result, or confirmed and not posted yet).
      required: [uuid, channel, provider, method, amount, currency, status, provider_status, provider_refund_id, failure_reason, reason, resolution_note, collection_uuid, cash_account, ledger_entry_uuid, requested_by, provider_answered_at, reflected_at, created_at, needs_action]
      properties:
        uuid: { type: string, format: uuid }
        channel: { type: string, enum: [provider, manual] }
        provider: { type: string }
        method: { type: string, enum: [cash, card, transfer, online, other] }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string }
        status: { type: string, enum: [requested, succeeded, failed] }
        provider_status: { type: string, enum: ["", succeeded, failed, uncertain] }
        provider_refund_id: { type: string }
        failure_reason: { type: string }
        reason: { type: string }
        resolution_note: { type: string }
        collection_uuid: { type: string, format: uuid }
        cash_account:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        ledger_entry_uuid: { type: [string, "null"], format: uuid }
        requested_by:
          oneOf:
            - type: object
              required: [uuid, name]
              properties:
                uuid: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
        provider_answered_at: { type: [string, "null"], format: date-time }
        reflected_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        needs_action: { type: boolean }

    RefundCollection:
      type: object
      required: [uuid, method, entry_date, amount, refunded, pending, refundable, cash_account, provider, provider_refund]
      properties:
        uuid: { type: string, format: uuid }
        method: { type: string }
        entry_date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        refunded: { $ref: "#/components/schemas/MoneyAmount" }
        pending: { $ref: "#/components/schemas/MoneyAmount" }
        refundable: { $ref: "#/components/schemas/MoneyAmount" }
        cash_account:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        provider: { type: string, description: The provider of the online payment behind it ("" = none). }
        provider_refund: { type: boolean, description: The provider's refund API can pay it back. }

    ReservationRefundRequest:
      type: object
      required: [collection_uuid, amount, channel, idempotency_key]
      properties:
        collection_uuid: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/MoneyInput" }
        channel: { type: string, enum: [provider, manual] }
        method: { type: string, enum: [cash, card, transfer, online], description: Manual refunds only. }
        cash_account_uuid: { type: [string, "null"], format: uuid, description: Manual refunds only. }
        reason: { type: string, maxLength: 240 }
        idempotency_key: { type: string, maxLength: 100, pattern: "^[A-Za-z0-9:_\\-.]+$" }

    RefundResult:
      type: object
      required: [refund, payments, replayed]
      properties:
        refund: { $ref: "#/components/schemas/Refund" }
        payments: { $ref: "#/components/schemas/ReservationPayments" }
        replayed: { type: boolean }

    EnvelopeRefundResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/RefundResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PaymentFollowUp:
      type: object
      required: [uuid, number, kind, status, payment_status, cancel_reason, starts_at, branch, customer, currency, charged, collected, refunded, amount, late, open_refunds, last_refund_status, last_refund_failure, last_refund_at, updated_at]
      properties:
        uuid: { type: string, format: uuid, description: The reservation. }
        number: { type: integer, format: int64 }
        kind: { type: string, enum: [refund_pending, refund_failed, refund_unverified, unpaid] }
        status: { type: string }
        payment_status: { type: string, enum: [on_site, online_pending, paid, refund_pending, partially_refunded, refunded, failed] }
        cancel_reason: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        branch:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        customer:
          oneOf:
            - type: object
              required: [uuid, name]
              properties:
                uuid: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
        currency: { type: string }
        charged: { $ref: "#/components/schemas/MoneyAmount" }
        collected: { $ref: "#/components/schemas/MoneyAmount" }
        refunded: { $ref: "#/components/schemas/MoneyAmount" }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        late: { type: boolean, description: An online payment arrived after the visit was cancelled. }
        open_refunds: { type: integer, format: int64 }
        last_refund_status: { type: string, enum: ["", requested, succeeded, failed] }
        last_refund_failure: { type: string }
        last_refund_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentFollowUpPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PaymentFollowUp" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    EnvelopePaymentFollowUpPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PaymentFollowUpPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopePaymentFollowUpFacets:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [kind]
          properties:
            kind:
              type: array
              items:
                type: object
                required: [value, count]
                properties:
                  value: { type: string }
                  count: { type: integer, format: int64 }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeReservationPayments:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ReservationPayments" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ReservationCollectionRequest:
      type: object
      required: [amount, method, cash_account_uuid]
      properties:
        amount: { $ref: "#/components/schemas/MoneyInput" }
        method: { type: string, enum: [cash, card, transfer] }
        cash_account_uuid: { type: string, format: uuid }
        note: { type: string, maxLength: 240 }

    EnvelopePublicReservation:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PublicReservation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CustomerSignInStart:
      type: object
      required: [status, phone_masked, resend_after_seconds, code_ttl_seconds]
      properties:
        status: { type: string, enum: [code_sent_if_known] }
        phone_masked: { type: string, example: "+90532*****33" }
        resend_after_seconds: { type: integer }
        code_ttl_seconds: { type: integer }

    CustomerBusiness:
      type: object
      required: [uuid, slug, name, first_name, last_name, linked_at, reservation_count, history_from, history_until]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        first_name: { type: string, description: "The name this business keeps for the person; empty while `history_from` is set (it may be the previous holder's)." }
        last_name: { type: string }
        linked_at: { type: string, format: date-time }
        reservation_count: { type: integer, format: int64, description: Visits shown (inside the history window). }
        history_from:
          type: [string, "null"]
          format: date-time
          description: Only visits booked from this moment are shown (the number was reassigned to the person, or the record is older than the number's last change of hands).
        history_until:
          type: [string, "null"]
          format: date-time
          description: Only visits booked before this moment are shown (the person moved to another number).

    CustomerDevice:
      type: object
      required: [uuid, current, method, device, ip, created_at, last_seen_at, expires_at]
      properties:
        uuid: { type: string, format: uuid }
        current: { type: boolean, description: The session of this request. }
        method: { type: string, enum: [code, link], description: How the session was opened. }
        device: { type: string, description: "Browser and system from the user agent (\"Chrome · Android\"); empty when unknown." }
        ip: { type: string, description: "Masked address of the sign-in (\"85.105.*.*\")." }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: The earlier of the idle and the hard expiry. }

    CustomerDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerDevice" }

    EnvelopeCustomerDeviceList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerDeviceList" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CustomerProfile:
      type: object
      required: [phone, phone_display, verified_at, session_expires_at, active_sessions, businesses]
      properties:
        phone: { type: string, description: E.164 }
        phone_display: { type: string }
        verified_at: { type: string, format: date-time }
        session_expires_at: { type: string, format: date-time }
        active_sessions: { type: integer, format: int64 }
        businesses:
          type: array
          items: { $ref: "#/components/schemas/CustomerBusiness" }

    CustomerSession:
      type: object
      required: [expires_at, profile]
      properties:
        access_token: { type: string, description: "Customer token (Bearer). The web BFF removes it from the answer and keeps it in an httpOnly cookie." }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        authenticated: { type: boolean, description: Set by the web BFF instead of the token. }
        profile: { $ref: "#/components/schemas/CustomerProfile" }

    CustomerMoney:
      type: object
      required: [total, paid, refunded, balance, currency, method, payment_status]
      description: |
        The recorded payment picture of a visit. Until the payment ledger
        records amounts, an online payment is the full total and a refund
        the full total once refunded (`refunded` is null when unknown).
        `balance` is null for a finished visit paid at the business.
      properties:
        total: { $ref: "#/components/schemas/MoneyAmount" }
        paid: { $ref: "#/components/schemas/MoneyAmount" }
        refunded:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        balance:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        currency: { type: string }
        method: { type: string, enum: [on_site, online] }
        payment_status: { type: string, enum: [on_site, online_pending, paid, refund_pending, partially_refunded, refunded, failed] }

    CustomerRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    CustomerReservationItem:
      type: object
      required: [uuid, number, business, branch, timezone, starts_at, ends_at, upcoming, status, approval_status, confirmation_status, payment_status, cancel_reason, services, staff, money, created_at]
      properties:
        uuid: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        business:
          type: object
          required: [uuid, slug, name]
          properties:
            uuid: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        branch: { $ref: "#/components/schemas/CustomerRef" }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        upcoming: { type: boolean }
        status: { type: string, enum: [requested, active, in_service, completed, cancelled, rejected, no_show] }
        approval_status: { type: string, enum: [pending, accepted, rejected] }
        confirmation_status: { type: string, enum: [not_required, scheduled, pending, confirmed, declined, expired] }
        payment_status: { type: string, enum: [on_site, online_pending, paid, refund_pending, partially_refunded, refunded, failed] }
        cancel_reason: { type: [string, "null"] }
        services:
          type: array
          items: { type: string }
        staff:
          type: array
          items: { type: string }
        money: { $ref: "#/components/schemas/CustomerMoney" }
        created_at: { type: string, format: date-time }

    CustomerAction:
      type: object
      required: [allowed, until, reason]
      properties:
        allowed: { type: boolean }
        until: { type: [string, "null"], format: date-time, description: The last moment the action is allowed. }
        reason:
          type: [string, "null"]
          enum: [status, cutoff, business_unavailable, online_unavailable, services_changed, sign_in_required, not_requested, answered, null]

    CustomerReservation:
      allOf:
        - $ref: "#/components/schemas/CustomerReservationItem"
        - type: object
          required: [branch, version, customer_note, hold_expires_at, lines, policies, actions, history, refunds]
          properties:
            branch:
              type: object
              required: [uuid, name, address, city, district, phone]
              properties:
                uuid: { type: string, format: uuid }
                name: { type: string }
                address: { type: string }
                city: { type: string }
                district: { type: string }
                phone: { type: string }
            version: { type: integer }
            customer_note: { type: string }
            hold_expires_at: { type: [string, "null"], format: date-time }
            lines:
              type: array
              items:
                type: object
                required: [service_name, staff_name, starts_at, ends_at, duration_minutes, unit_price]
                properties:
                  service_name: { type: string }
                  staff_name: { type: [string, "null"] }
                  starts_at: { type: string, format: date-time }
                  ends_at: { type: string, format: date-time }
                  duration_minutes: { type: integer }
                  unit_price: { $ref: "#/components/schemas/MoneyAmount" }
            policies:
              type: object
              required: [cancellation, change, no_show, cancel_cutoff_minutes, change_cutoff_minutes]
              properties:
                cancellation: { type: string }
                change: { type: string }
                no_show: { type: string }
                cancel_cutoff_minutes: { type: [integer, "null"] }
                change_cutoff_minutes: { type: [integer, "null"] }
            actions:
              type: object
              required: [cancel, reschedule, confirm, request_change]
              properties:
                cancel: { $ref: "#/components/schemas/CustomerAction" }
                reschedule: { $ref: "#/components/schemas/CustomerAction" }
                confirm: { $ref: "#/components/schemas/CustomerAction" }
                request_change: { $ref: "#/components/schemas/CustomerAction" }
            confirmation:
              description: The business's confirmation request (TEC-921); null when none was asked.
              oneOf:
                - type: object
                  required: [status, deadline_at, answered_at, change_requested_at]
                  properties:
                    status: { type: string, enum: [not_required, scheduled, pending, confirmed, declined, expired] }
                    deadline_at: { type: string, format: date-time }
                    answered_at: { type: [string, "null"], format: date-time }
                    change_requested_at: { type: [string, "null"], format: date-time }
                - type: "null"
            history:
              type: array
              items:
                type: object
                required: [type, to_status, at]
                properties:
                  type: { type: string }
                  to_status: { type: [string, "null"] }
                  at: { type: string, format: date-time }
            refunds:
              type: array
              description: "Refunds of the visit, newest first: `requested` (under way), `succeeded` (paid back), `failed` (the business follows it up)."
              items:
                type: object
                required: [uuid, amount, currency, status, requested_at, refunded_at]
                properties:
                  uuid: { type: string, format: uuid }
                  amount: { $ref: "#/components/schemas/MoneyAmount" }
                  currency: { type: string }
                  status: { type: string, enum: [requested, succeeded, failed] }
                  requested_at: { type: string, format: date-time }
                  refunded_at: { type: [string, "null"], format: date-time }

    CustomerReservationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerReservationItem" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    CustomerAvailability:
      type: object
      required: [timezone, earliest_start, latest_date, days]
      properties:
        timezone: { type: string }
        earliest_start: { type: string, format: date-time }
        latest_date: { type: [string, "null"], format: date }
        days:
          type: array
          items:
            type: object
            required: [date, status, starts]
            properties:
              date: { type: string, format: date }
              status: { type: string }
              starts:
                type: array
                items: { type: string, format: date-time }

    CustomerPaymentSummary:
      type: object
      required: [totals]
      properties:
        totals:
          type: array
          items:
            type: object
            required: [currency, booked, paid, refund_pending, refunded, reservation_count]
            properties:
              currency: { type: string }
              booked: { $ref: "#/components/schemas/MoneyAmount" }
              paid: { $ref: "#/components/schemas/MoneyAmount" }
              refund_pending: { $ref: "#/components/schemas/MoneyAmount" }
              refunded: { $ref: "#/components/schemas/MoneyAmount" }
              reservation_count: { type: integer, format: int64 }

    EnvelopeCustomerSignInStart:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerSignInStart" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerSession:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerSession" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerProfile:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerProfile" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerReservationPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerReservationPage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerReservation:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerReservation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerAvailability:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerAvailability" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerPaymentSummary:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerPaymentSummary" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
