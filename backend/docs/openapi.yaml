        title: { type: string }
        color: { type: string }
        is_active: { type: boolean }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        duration_minutes: { type: [integer, "null"] }

    TenantServiceCategoryRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    TenantService:
      type: object
      description: |
        A service of the business catalog (TEC-894). `buffer_*` minutes are
        held around a booking; `resource_kinds` are the kinds a booking needs
        (one of each). `image_url` is the API-owned public cover URL.
      required: [uuid, category, name, description, duration_minutes, buffer_before_minutes, buffer_after_minutes, price, currency, payment_mode, staff_mode, resource_kinds, show_online, is_active, sort_order, image_url, offers, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        category:
          oneOf:
            - $ref: "#/components/schemas/TenantServiceCategoryRef"
            - type: "null"
        name: { type: string }
        description: { type: string }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480 }
        price: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string, example: TRY }
        payment_mode: { type: string, enum: [on_site, online, both] }
        staff_mode: { type: string, enum: [required, optional, none] }
        resource_kinds:
          type: array
          items: { type: string, enum: [chair, table, area, room, device, bay] }
        show_online: { type: boolean }
        is_active: { type: boolean }
        sort_order: { type: integer }
        image_url: { type: [string, "null"] }
        offers:
          type: array
          items: { $ref: "#/components/schemas/TenantServiceOffer" }
        staff:
          description: Detail only.
          type: array
          items: { $ref: "#/components/schemas/TenantServiceStaff" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantServiceCreateRequest:
      type: object
      required: [name, duration_minutes, price]
      properties:
        category_uuid: { type: [string, "null"], format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480, default: 0 }
        price: { $ref: "#/components/schemas/MoneyInput" }
        payment_mode: { type: string, enum: [on_site, online, both], default: on_site }
        staff_mode: { type: string, enum: [required, optional, none] }
        resource_kinds:
          type: array
          items: { type: string, enum: [chair, table, area, room, device, bay] }
        show_online: { type: boolean, default: true }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }
        branch_uuids:
          type: array
          items: { type: string, format: uuid }

    TenantServicePatchRequest:
      type: object
      properties:
        category_uuid: { type: [string, "null"], format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 480 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 480 }
        price: { $ref: "#/components/schemas/MoneyInput" }
        payment_mode: { type: string, enum: [on_site, online, both] }
        staff_mode: { type: string, enum: [required, optional, none] }
        resource_kinds:
          type: array
          items: { type: string, enum: [chair, table, area, room, device, bay] }
        show_online: { type: boolean }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }

