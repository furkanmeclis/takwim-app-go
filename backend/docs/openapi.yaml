        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantResource
      summary: Update a resource
      description: |
        `tenant.resources.write`. Omitted fields are unchanged;
        `working_hours: null` falls back to the branch's hours. Moving to
        another branch needs that branch in the caller's scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantResourcePatchRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantResource
      summary: Delete a resource (soft)
      description: "`tenant.resources.write`."
      security:
        - bearerAuth: []
      parameters:
