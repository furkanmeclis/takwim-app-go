  /v1/tenant/branches:
    get:
      tags: [Tenant]
      operationId: getTenantBranches
      summary: List branches of the organization
      description: |
        Branches of the `X-Organization` organization (`tenant.branches.read`).
        `q` searches code, name, city, district, phone and email. A member with
        `branch_scope` = `selected` only sees (and exports, bulk-edits and
        finds in search) its own branches; any other branch answers `404`, and
        creating a branch answers `403`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `code`, `name`, `city`, `prep_minutes`, `is_active`, `created_at`, `updated_at`; prefix `-` for descending. Default `-created_at`."
          schema: { type: string, example: "-created_at" }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: city
          in: query
          description: "Exact city; comma-separate or repeat for several (see `/v1/tenant/branches/facets`)"
          schema: { type: string }
      responses:
        "200":
          description: Branch page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBranchPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantBranch
      summary: Create a branch
      description: |
        `tenant.branches.write`. `code` is upper-cased and must be unique among
        the organization's branches (`409 CONFLICT` with a `code` detail).
        Omitted `working_hours` default to weekdays 09:00–18:00, Saturday
        09:00–14:00, Sunday closed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchCreateRequest"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBranch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/branches/export:
    post:
      tags: [Tenant]
      operationId: postTenantBranchesExport
      summary: Export branches
      description: |
        Queues an export of the organization's branches (`tenant.branches.export`).
        `query` honours `q`, `city` and `is_active`. Poll
        `GET /v1/tenant/exports/{uuid}` and download from `download_url`.
