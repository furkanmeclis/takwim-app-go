  /v1/tenant/payments/follow-ups:
    get:
      tags: [Tenant]
      operationId: getTenantPaymentFollowUps
      summary: Payment follow-up list
      description: |
        Visits whose money needs a person (A14), in the caller's branch
        scope: `refund_pending` (paid and then cancelled or rejected, or an
        online payment that arrived after the visit was cancelled: `late`),
        `refund_unverified` (a provider refund whose result is unknown),
        `refund_failed` (the last refund failed while money is still held)
        and `unpaid` (a completed visit not paid in full). `amount` is what
        is to be refunded (paid less refunded) or, for `unpaid`, what is
        still owed. `q` searches the customer's name or the reservation
        number. Needs the reservations module and one of
        `tenant.payment.refund`, `tenant.payment.collect`,
        `tenant.finance.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `starts_at`, `amount`, `number`, `updated_at`; prefix `-` for descending. Default: latest visit first."
          schema: { type: string }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
        - name: kind
          in: query
          description: "Follow-up kinds; comma-separate or repeat"
          schema: { type: string }
      responses:
        "200":
          description: Follow-up page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePaymentFollowUpPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/{uuid}/accept:
    post:
      tags: [Tenant]
      operationId: postTenantReservationAccept
      summary: Accept a request
      description: |
        A pending request: paid on site it becomes an active booking; with online payment the hold now waits for the payment (payment hold time). Any other state is `409` detail `status` / `invalid_transition`;
        `expected_version` refuses a stale action (`expected_version` / `stale`).
        A member with only `tenant.reservations.own` acts on a visit shared with colleagues only when it serves every staffed line (`409` `lines` / `other_staff`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantReservationActionRequest"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/reservations/{uuid}/reject:
    post:
      tags: [Tenant]
      operationId: postTenantReservationReject
      summary: Reject a request
      description: |
        A pending request is rejected and its capacity freed. Any other state is `409` detail `status` / `invalid_transition`;
        `expected_version` refuses a stale action (`expected_version` / `stale`).
        A member with only `tenant.reservations.own` acts on a visit shared with colleagues only when it serves every staffed line (`409` `lines` / `other_staff`).
