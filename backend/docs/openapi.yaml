    TenantAvailabilitySearchRequest:
      type: object
      additionalProperties: false
      required: [branch_uuid, lines]
      properties:
        party_size:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000
          description: Number of people (restaurant; required when the sector books by party and a service takes a resource). Every resource must seat the party.
        zone:
          type: string
          maxLength: 64
          description: Area of the branch (resource zone) the resources must be in; empty = any.
        branch_uuid: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [service_uuid]
            properties:
              service_uuid: { type: string, format: uuid }
              staff_uuid:
                type: [string, "null"]
                format: uuid
                description: A person who may perform the service in the branch; null = anyone free.
        from: { type: string, format: date, description: "Local date of the branch; default today." }
        to: { type: string, format: date, description: "Inclusive; default from + 6 days, at most 31 days." }
        step_minutes: { type: integer, minimum: 5, maximum: 240, multipleOf: 5, default: 15 }
        channel: { type: string, enum: [panel, online], default: panel }

    TenantAvailabilityRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    TenantAvailabilityResourceRef:
      type: object
      required: [uuid, name, kind]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [chair, table, area, room, device, bay] }

    TenantAvailabilitySlot:
      type: object
      required: [starts_at, ends_at, lines]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: End of the customer's time (buffers excluded). }
        lines:
          type: array
          items:
            type: object
            required: [service_uuid, starts_at, ends_at, staff, resources, seats_left]
            properties:
              service_uuid: { type: string, format: uuid }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              staff:
                oneOf:
                  - $ref: "#/components/schemas/TenantAvailabilityRef"
                  - type: "null"
              resources:
                type: array
                items: { $ref: "#/components/schemas/TenantAvailabilityResourceRef" }
              seats_left:
                type: [integer, "null"]
                description: Group class - free seats of the session before this booking (a running session is joined on its trainer and area). Null for an individual service.

    TenantAvailability:
      type: object
      required: [branch, timezone, channel, earliest_start, latest_date, step_minutes, lines, days]
      properties:
        branch: { $ref: "#/components/schemas/TenantAvailabilityRef" }
        timezone: { type: string, example: Europe/Istanbul }
        channel: { type: string, enum: [panel, online] }
        earliest_start: { type: string, format: date-time }
        latest_date: { type: [string, "null"], format: date }
        step_minutes: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [service_uuid, service_name, duration_minutes, buffer_before_minutes, buffer_after_minutes, staff_mode, resource_kinds, staff, group_capacity]
            properties:
              service_uuid: { type: string, format: uuid }
              service_name: { type: string }
              duration_minutes: { type: integer, description: Branch duration (personal durations may differ per slot). }
              buffer_before_minutes: { type: integer }
              buffer_after_minutes: { type: integer }
              staff_mode: { type: string, enum: [required, optional, none] }
              resource_kinds: { type: array, items: { type: string } }
              staff:
                type: array
                items: { $ref: "#/components/schemas/TenantAvailabilityRef" }
              group_capacity: { type: [integer, "null"], description: "Seats of a group class session (a group class is booked on its own, else lines.N.service_uuid group_alone); null = individual." }
        days:
          type: array
          items:
            type: object
            required: [date, status, slots]
            properties:
              date: { type: string, format: date }
              status: { type: string, enum: [available, closed, too_far, too_soon, no_staff, full] }
              slots:
