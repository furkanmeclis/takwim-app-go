        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200": { $ref: "#/components/responses/IntegrationAccountOK" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/integrations/{uuid}/enable:
    post:
      tags: [Tenant]
      operationId: postTenantIntegrationEnable
      summary: Enable an account
      description: "`tenant.integrations.manage`. `409` when another account of the kind is active."
