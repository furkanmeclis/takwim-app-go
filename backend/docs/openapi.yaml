    OrganizationSettingsVersionSummary:
      type: object
      required: [version, ready_for_online_sales, created_at, created_by]
      properties:
        version: { type: integer }
        ready_for_online_sales: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/OrganizationSettingsActor"
            - type: "null"

    OrganizationSettingsVersionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationSettingsVersionSummary" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    OrganizationSettingsSaveRequest:
      type: object
      required: [settings]
      additionalProperties: false
      properties:
