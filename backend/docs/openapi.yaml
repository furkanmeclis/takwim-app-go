                $ref: "#/components/schemas/EnvelopeTenantProduct"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantProductImage
      summary: Remove the cover image of a product
      description: "`tenant.products.write`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Product without a cover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantProduct"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/products/{uuid}/variants:
    post:
      tags: [Tenant]
      operationId: postTenantProductVariant
      summary: Add a variant to a product
      description: |
        `tenant.products.write`. A variant has its own stock code (unique
        with the product codes, `409`). The first variant needs the product's
        own stock at zero (`409` `has_stock`): from then on stock is kept per
        variant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantProductVariantCreateRequest"
      responses:
        "201":
          description: Product with the new variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantProduct"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/products/{uuid}/variants/{variantUuid}:
    patch:
      tags: [Tenant]
      operationId: patchTenantProductVariant
      summary: Update a variant
      description: "`tenant.products.write`. `price` / `cost` null use the product values."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: variantUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantProductVariantPatchRequest"
      responses:
        "200":
          description: Product with the updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantProduct"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantProductVariant
      summary: Delete a variant (soft)
      description: "`tenant.products.write`. Only without stock in any branch (`409` `has_stock`)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - name: variantUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product without the variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantProduct"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/stock-movements/meta:
    get:
      tags: [Tenant]
      operationId: getTenantStockMovementsMeta
      summary: Stock movement list metadata
      description: Table contract of `GET /v1/tenant/stock-movements` (`tenant.products.read`, `products` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/stock-movements/facets:
    get:
      tags: [Tenant]
      operationId: getTenantStockMovementsFacets
      summary: Stock movement faceted filter options
      description: Kinds, branches and staff in the ledger of the caller's branches, with counts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantStockMovementFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/stock-movements:
    get:
      tags: [Tenant]
      operationId: getTenantStockMovements
      summary: List stock movements
      description: |
        The append-only stock ledger of the caller's branches
        (`tenant.products.read`), newest first. `q` searches the product
        name, stock codes, reason and note.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `occurred_at`, `quantity`, `kind`; prefix `-` for descending. Default: `-occurred_at`."
          schema: { type: string, example: -occurred_at }
        - name: kind
          in: query
          description: "`receipt`, `sale`, `return`, `adjustment`, `transfer_out`, `transfer_in`; comma-separate or repeat"
          schema: { type: string }
        - name: branch
          in: query
          description: "Branch uuids; comma-separate or repeat"
          schema: { type: string }
        - name: product
          in: query
          description: "Product uuids; comma-separate or repeat"
          schema: { type: string }
        - name: staff
          in: query
          description: "Staff uuids (sales credited to them); comma-separate or repeat"
          schema: { type: string }
        - name: from
          in: query
          description: "Movements at or after this time (RFC 3339)"
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "Movements before this time (RFC 3339)"
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Movement page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantStockMovementPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantStockMovement
      summary: Record a stock movement
      description: |
        `sale` needs `tenant.products.sell`; `receipt`, `return`,
        `adjustment` (count) and `transfer` need `tenant.products.stock`.
        Branches must be inside the caller's scope. Stock never goes below
        zero: a sale or transfer takes at most the available units (on hand
        minus reserved; `quantity` `insufficient_stock`). An adjustment
        records `counted_quantity`; the ledger stores the difference. A
        transfer writes `transfer_out` and `transfer_in` rows with the same
        `transfer_uuid`. A product with variants needs `variant_uuid`. A sale
        needs an active product sold in the branch (`not_offered`); its unit
        price defaults to the branch price.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStockMovementRequest"
      responses:
        "201":
          description: Recorded movements and the product with its new stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantStockMovementResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/stock-movements/{uuid}/return:
    post:
      tags: [Tenant]
      operationId: postTenantStockMovementReturn
      summary: Take back the product of a sale
      description: |
        A manager's operation (TEC-913): every unit of a `sale` movement
        comes back to its branch as one `return` movement (`source`
        `sale_return`) and the sale's revenue line is reversed, in one
        transaction. A sale is returned once (`409 STOCK_ALREADY_RETURNED`);
        any other movement is `409 STOCK_NOT_RETURNABLE`. `reason` is
        required. Money paid for it is refunded separately. Needs
        `tenant.products.stock` and `tenant.payment.refund`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: The return movement and the product with its new stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantStockMovementResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/customers/meta:
    get:
      tags: [Tenant]
      operationId: getTenantCustomersMeta
      summary: Customer list metadata
      description: Table contract of `GET /v1/tenant/customers` (`tenant.customers.read`, `customers` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customers/facets:
    get:
      tags: [Tenant]
      operationId: getTenantCustomersFacets
      summary: Customer faceted filter options
      description: Tags and sources (with counts) in use in the organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCustomerFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customers:
    get:
      tags: [Tenant]
      operationId: getTenantCustomers
      summary: List customers of the organization
      description: |
        The business's own customer records (`tenant.customers.read`); every
        reader sees every record of the business. `q` searches the full
        name, the email and, when it looks like a phone fragment, the phone
        (a leading national `0` is ignored). Records of other businesses
        are never listed, even for the same person.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `phone`, `email`, `source`, `created_at`, `updated_at`; prefix `-` for descending. Default: first name, last name."
          schema: { type: string, example: name }
        - name: tag
          in: query
          description: "Tags (exact, any of); comma-separate or repeat"
          schema: { type: string }
        - name: source
          in: query
          description: "Sources (`panel`, `import`, `online`); comma-separate or repeat"
          schema: { type: string }
        - name: verified
          in: query
          description: Linked to a person who proved the phone
          schema: { type: boolean }
        - name: sms_consent
          in: query
          schema: { type: boolean }
        - name: email_consent
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Customer page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCustomerPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantCustomer
      summary: Create a customer
      description: |
        `tenant.customers.write`. The phone is normalized to E.164 (numbers
        without a country code are read as Turkish); one live record per
        phone in a business (`409`, detail `phone` / `taken`). A record
        created here is never verified: only the person proving the phone
        (OTP, customer panel) links it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCustomerCreateRequest"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCustomer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/customers/export:
    post:
      tags: [Tenant]
      operationId: postTenantCustomersExport
      summary: Export customers
      description: |
        Queues an export of the organization's customers
        (`tenant.customers.export`). `query` honours `q`, `tag`, `source`,
        `verified`, `sms_consent` and `email_consent`. Poll `GET /v1/tenant/exports/{uuid}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customers/import:
    post:
      tags: [Tenant]
      operationId: postTenantCustomersImport
      summary: Upload a customer import file
      description: |
        Creates an import job (`tenant.customers.import`). A row whose phone
        matches a live customer updates it, any other row creates one with
        source `import`. Imported phones stay unverified. Continue with
        `/v1/tenant/imports/{uuid}/mapping`, `/preview` and `/confirm`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUploadForm"
      responses:
        "201":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImportJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customers/import/sample:
    get:
      tags: [Tenant]
      operationId: getTenantCustomersImportSample
      summary: Download a customer import sample
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: format
          in: query
          schema: { type: string, enum: [json, xlsx, csv, tsv], default: xlsx }
        - name: locale
          in: query
          schema: { type: string, enum: [tr, en], default: tr }
      responses:
        "200":
          description: Sample file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customers/bulk:
    post:
      tags: [Tenant]
      operationId: postTenantCustomersBulk
      summary: Run a bulk action on customers
      description: |
        Actions `add_tag` and `remove_tag` (`tenant.customers.bulk.tag`,
        the tag in `target.params.tag`) and `delete`
        (`tenant.customers.bulk.delete`, restored on rollback); all
        reversible. Targets are resolved inside the organization only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkExecuteRequest"
      responses:
        "200":
          description: Sync bulk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkSyncResult"
        "202":
          description: Async bulk job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/customers/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantCustomer
      summary: Get a customer
      description: A uuid of another organization answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCustomer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantCustomer
      summary: Update a customer
      description: |
        `tenant.customers.write`. Omitted fields are unchanged; `phone` and
        `birth_date` take `null` to clear. Changes stay in this business.
        Changing the phone of a verified record removes the verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCustomerPatchRequest"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCustomer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantCustomer
      summary: Delete a customer (soft)
      description: "`tenant.customers.write`. The phone becomes free for a new record."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/customers/{uuid}/activity:
    get:
      tags: [Tenant]
      operationId: getTenantCustomerActivity
      summary: Activity of a customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBranchActivityPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/availability/search:
    post:
      tags: [Tenant]
      operationId: postTenantAvailabilitySearch
      summary: Bookable start times
      description: |
        The slot engine (`reservations` module; `tenant.reservations.read`,
        or `tenant.reservations.own` for the caller's own calendar: every
        line that takes a staff member is planned with the caller's staff
        record, another `staff_uuid` is `403`). Answers each local date of
        the branch from `from` to `to` (default today + 6 days, at most 31)
        with a status (`available`, `closed`, `too_far`, `too_soon`,
        `no_staff`, `full`) and the starts every `step_minutes` (default 15)
        counted from the opening. Lines run back to back; each slot names
        the staff member and resources of every line. `staff_uuid` null is
        "anyone free" (the least booked person that day first).

        A person has one calendar across branches: time off and bookings in
        any branch are busy time. `channel` `online` previews what the
        booking page offers: services, staff and resources shown online,
        the minimum notice and maximum advance of the business settings
        (`409` detail `channel` / `online_not_ready` until both are set).
        The panel channel offers every start from now on. A branch outside
        the caller's scope or of another business is `404`; services and
        staff are checked per line (`lines.N.service_uuid` `not_found`,
        `inactive`, `not_offered`; `lines.N.staff_uuid` `not_found`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAvailabilitySearchRequest"
      responses:
        "200":
          description: Days and slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantAvailability"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/availability/holds:
    post:
      tags: [Tenant]
      operationId: postTenantAvailabilityHold
      summary: Hold capacity for a visit
      description: |
        Holds the staff and resources of one visit at `starts_at` until the
        hold time of `reason` passes (`tenant.reservations.write`, or
        `tenant.reservations.own` on the caller's own calendar):
        `checkout` (customer filling in the booking form, 10 minutes),
        `approval` (the business's review window, default 60) or
        `payment` (online payment hold time, default 15); `minutes`
        (1–1440) overrides it. In one transaction under the organization's
        lock: lapsed holds are expired, the slot engine re-plans the start
        on fresh data and the allocations are written. Exclusion constraints
        refuse any overlapping commitment of a person or resource (in every
        branch), so of concurrent requests for the last free time exactly
        one wins; the others get `409` detail `starts_at` / `taken` and
        nothing is written. A lapsed hold stops counting at `expires_at`,
        before the minute sweep marks it `expired`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCapacityHoldCreateRequest"
      responses:
        "201":
          description: Created hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCapacityHold"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/availability/holds/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantAvailabilityHold
      summary: A capacity hold or booking
      description: |
        `tenant.reservations.read` (every hold in the branch scope) or
        `tenant.reservations.own` (holds the caller created). A lapsed,
        not yet swept hold reads as `expired`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCapacityHold"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantAvailabilityHold
      summary: Release a hold or booking
      description: |
        Frees the capacity exactly once (`409` detail `uuid` / `not_active`
        afterwards, `expired` for a lapsed hold).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Released hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCapacityHold"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/availability/holds/{uuid}/extend:
    post:
      tags: [Tenant]
      operationId: postTenantAvailabilityHoldExtend
      summary: Extend a hold
      description: |
        Sets `expires_at` to now + `minutes` (1–1440) for an active hold.
        `409` detail `uuid` / `expired` when it already lapsed (its capacity
        is free again), `not_hold` for a confirmed booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200":
          description: Extended hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantCapacityHold"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/reservations/meta:
    get:
      tags: [Tenant]
      operationId: getTenantReservationsMeta
      summary: Reservation list metadata
      description: Table contract of `GET /v1/tenant/reservations` (`tenant.reservations.read` or `.own`, `reservations` module).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/reservations/facets:
    get:
      tags: [Tenant]
      operationId: getTenantReservationsFacets
      summary: Reservation faceted filter options
      description: Branches (in the caller's branch scope) and staff members with reservations, with counts and names.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/form:
    get:
      tags: [Tenant]
      operationId: getTenantReservationsForm
      summary: Booking form questions
      description: |
        The business's booking form questions and the optional flow steps it
        hides (business settings `booking`, TEC-905), for the panel booking
        form and the reservation detail. Readable with the reservations
        permission (no settings permission needed). The panel form asks the
        questions with `panel: true`; required ones must be answered
        (`custom_fields.<key>` / `required`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationForm"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/calendar:
    get:
      tags: [Tenant]
      operationId: getTenantReservationsCalendar
      summary: Reservation calendar
      description: |
        The calendar of local dates `from`..`to` (at most 7 days). Columns are
        the people (`by=staff`) or resources (`by=resource`) of one branch, or
        the branches of the caller's scope (`by=branch`). Each column carries
        when it works (shifts inside the opening hours, resource or branch
        hours) and its leave or closures; items are the visit lines placed in
        their columns. A person or resource no longer listed keeps a column
        while it has visits; lines without one go to the `unassigned` column.
        Cancelled and rejected visits only with `include_cancelled=true`. A
        member with only `tenant.reservations.own` gets its own column and the
        visits it created or serves.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive; default `from`.
          schema: { type: string, format: date }
        - name: by
          in: query
          schema: { type: string, enum: [staff, resource, branch], default: staff }
        - name: branch
          in: query
          description: Branch uuid; required for `by=staff` and `by=resource`.
          schema: { type: string, format: uuid }
        - name: include_cancelled
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationCalendar"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/agenda:
    get:
      tags: [Tenant]
      operationId: getTenantReservationsAgenda
      summary: My programme
      description: |
        The signed-in member's own programme for local dates `from`..`to` (at
        most 7 days): its staff record, its working periods in every branch of
        its scope (shifts inside the opening hours), its leave and the visit
        lines it serves, with the customer's phone and note. `staff` is null
        and the lists are empty when the member has no staff record. Needs
        `tenant.reservations.read` or `tenant.reservations.own`; either way the
        answer is the member's own. Cancelled and rejected visits only with
        `include_cancelled=true`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - name: from
          in: query
          description: Default today in the business time zone.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive; default `from`.
          schema: { type: string, format: date }
        - name: include_cancelled
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationAgenda"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations:
    get:
      tags: [Tenant]
      operationId: getTenantReservations
      summary: List reservations
      description: |
        Reservations in the caller's branch scope (`tenant.reservations.read`);
        a member with only `tenant.reservations.own` sees the ones it created
        or serves. `q` matches the number (`#1024` or `1024`), the customer's
        name and, from three digits on, the phone. Default order: start,
        newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `starts_at`, `number`, `customer`, `status`, `total_price`, `created_at`; prefix `-` for descending. Default `-starts_at`."
          schema: { type: string, example: -starts_at }
        - name: branch
          in: query
          description: Branch uuids (any of); comma-separate or repeat
          schema: { type: string }
        - name: staff
          in: query
          description: Staff uuids serving a line (any of)
          schema: { type: string }
        - name: customer_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: "`requested`, `active`, `in_service`, `completed`, `cancelled`, `rejected`, `no_show` (any of)"
          schema: { type: string }
        - name: approval_status
          in: query
          description: "`pending`, `accepted`, `rejected` (any of)"
          schema: { type: string }
        - name: confirmation_status
          in: query
          description: "`not_required`, `scheduled`, `pending`, `confirmed`, `declined`, `expired` (any of; TEC-921)"
          schema: { type: string }
        - name: payment_status
          in: query
          description: "`on_site`, `online_pending`, `paid`, `refund_pending`, `partially_refunded`, `refunded`, `failed` (any of)"
          schema: { type: string }
        - name: source
          in: query
          description: "`panel`, `online`, `embed` (any of)"
          schema: { type: string }
        - name: starts_from
          in: query
          description: Start at or after this instant (RFC 3339)
          schema: { type: string, format: date-time }
        - name: starts_to
          in: query
          description: Start before this instant (RFC 3339)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Reservation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Tenant]
      operationId: postTenantReservation
      summary: Book a visit at the counter
      description: |
        A panel booking (`tenant.reservations.write`, or `.own` on the
        caller's own calendar): accepted and active at once, paid at the
        business. The start is planned again with the slot engine under the
        business's lock and the capacity booked in the same transaction as
        the record; a taken start is `409` detail `starts_at` / `taken` with
        nothing written. Each line keeps the service, staff member,
        resources, times and price (personal › branch › list price) of the
        moment. Validation: `customer_uuid` `required` / `not_found`,
        `branch_uuid` `not_found`, `lines.N.*` as the availability search,
        `payment` other than `on_site`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantReservationCreateRequest"
      responses:
        "201":
          description: Created reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/reservations/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantReservation
      summary: A reservation with its lines and history
      description: Another business's uuid, one outside the branch scope or (own calendar) not the caller's is `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantReservation
      summary: Edit notes and form answers
      description: Replaces both notes and the custom field answers; raises the version. `expected_version` refuses a stale edit (`409` detail `expected_version` / `stale`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantReservationNotesRequest"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/reservations/{uuid}/reschedule:
    post:
      tags: [Tenant]
      operationId: postTenantReservationReschedule
      summary: Move a reservation
      description: |
        A request or an active booking moves to `starts_at`, optionally with
        new `lines` (empty = the current services and staff). Every line is
        planned again (staff, resources, hours) after the booking's own
        capacity is let go, in one transaction; when the new time is not
        free nothing changes (`409` `starts_at` / `taken`). Lines with the
        same service and staff member keep their booked price. The version
        rises, so confirmation jobs of the old time no longer apply. A member
        with only `tenant.reservations.own` changes its own lines; a
        colleague's lines keep their service and person and move with the
        visit (`409` `lines` / `other_staff` otherwise).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantReservationRescheduleRequest"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/reservations/{uuid}/payments:
    get:
      tags: [Tenant]
      operationId: getTenantReservationPayments
      summary: Payments of a reservation
      description: |
        What the visit costs and what was paid for it, from the ledger:
        expected, paid, remaining, credit; the money entries (collections,
        refunds and their reversals; sale lines stay in the finance views);
        the online payment attempts. For a member with
        `tenant.payment.collect` and the cash module, `collect_accounts`
        lists the tills and bank accounts of the visit's branch (and the
        business-wide ones) and `can_collect` says whether money can be
        taken now. `refunds` are the refund requests and `refundable` what
        may still be paid back; for a member with `tenant.payment.refund`
        and the cash module, `refund_collections` lists the live
        collections with what is left of each and `refund_accounts` the
        accounts a manual refund may leave (`can_refund`). Needs
        `tenant.reservations.read` or `.own` (own visits).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReservationPayments"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/reservations/{uuid}/collections:
    post:
      tags: [Tenant]
      operationId: postTenantReservationCollection
      summary: Take money at the business
      description: |
        Records money taken at the business for a visit (cash, card or
        transfer; one part or the rest, at most the remaining amount): a
        ledger collection and its cash movement into an active till or bank
        account of the visit's branch or a business-wide one, in the
        reservation's transaction. A visit paid in full becomes `paid`. A
        cancelled or rejected visit answers `409 PAYMENT_NOT_COLLECTABLE`; a
        closed day of the till `409` `cash_account_uuid` / `closed`. Needs
        `tenant.payment.collect`, the cash module and
        `tenant.reservations.read` or `.own`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCollectionRequest"
      responses:
        "201":
          description: Payments after the collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeReservationPayments"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/reservations/{uuid}/refunds:
    post:
      tags: [Tenant]
      operationId: postTenantReservationRefund
      summary: Pay money back
      description: |
        Pays back (part of) one live collection of the visit, at most what
        is left of it (the collection less its refunds and the refunds under
        way; `amount` / `exceeds_refundable`). The request, the provider's
        answer and the posting to the books are recorded apart (`status`,
        `provider_status`, `ledger_entry_uuid` / `reflected_at`).

        - `channel: provider` calls the refund API of the online payment's
          provider (method `online`, out of the payment's online account;
          `channel` / `unsupported` when the provider cannot). A confirmed
          refund is posted at once (`succeeded`), a refusal is `failed`, an
          unknown result (timeout, 5xx) stays `requested` with
          `provider_status: uncertain` and is never sent again: settle it
          with `POST /v1/tenant/refunds/{uuid}/resolve`.
        - `channel: manual` records money handed back (`cash`, `card`,
          `transfer`) or a refund made in the provider's own panel
          (`online`) out of `cash_account_uuid` (an active till, bank or
          online account of the branch or business-wide; a till pays out at
          most what it holds, `409` `insufficient_funds`).

        After the posting the visit's `payment_status` becomes `refunded`
        (nothing paid any more) or `partially_refunded`; the visit itself
        never changes. `idempotency_key` identifies the request: the same key
        answers the same refund with `200` and `replayed: true` (sending
        nothing), the key with another body `409 REFUND_IDEMPOTENCY_REUSED`.
        Needs `tenant.payment.refund`, the cash module and
        `tenant.reservations.read` or `.own`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRefundRequest"
      responses:
        "200":
          description: The same request again (replayed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRefundResult"
        "201":
          description: The refund and the payments after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRefundResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/refunds/{uuid}/resolve:
    post:
      tags: [Tenant]
      operationId: postTenantRefundResolve
      summary: Settle a refund with an unknown result
      description: |
        For a provider refund still `requested` (unknown result, or confirmed
        but not posted) after a person checked the provider's panel:
        `succeeded` posts it now, `failed` ends it (a refund the provider
        confirmed can only be posted: `outcome` / `confirmed`). A settled
        refund is `409 REFUND_NOT_OPEN`. Needs `tenant.payment.refund`, the
        cash module and the reservation's reach.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [succeeded, failed] }
                note: { type: string, maxLength: 240 }
      responses:
        "200":
          description: The refund and the payments after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRefundResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

