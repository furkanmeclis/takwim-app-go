    get:
      tags: [Platform]
      operationId: getPlatformOrganizationEntitlements
      summary: Organization plan, add-ons, limits and usage
      description: |
        Effective entitlements (TEC-883) with the stored limit overrides, the
        current use (branches, staff seats = members + open invitations),
        this month's communication usage and the plan / add-on catalog.
      security:
