          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/MeOrganization"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
