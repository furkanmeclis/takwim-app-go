      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: Authenticator or recovery code when 2FA is enabled
          maxLength: 32

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32

    TOTPStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        confirmed_at: { type: [string, "null"], format: date-time }

    TOTPSetup:
      type: object
