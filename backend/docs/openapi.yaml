    get:
      tags: [Tenant]
      operationId: listTenantReservationProductOptions
      summary: Products that can be added to a visit
      description: |
        Stock items sold in the visit's branch (active products offered there; one row per active variant) with the
        units available (on hand - reserved). `q` matches name, SKU or barcode; at most 50 rows. Needs the products
        module and `tenant.products.sell` besides reservation read or own.
      security:
        - bearerAuth: []
      parameters:
