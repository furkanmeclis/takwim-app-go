          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservationProductOptions"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenant/reservations/{uuid}/products:
    post:
      tags: [Tenant]
      operationId: postTenantReservationProduct
      summary: Add a product to a visit
      description: |
        Adds a product (a variant when it has them) to a requested, active or in-service visit and reserves its
        units in the visit's branch in the same transaction (TEC-919). The price is the variant's own, else the
        branch price, else the catalog price, kept as a snapshot. `staff_uuid` credits the sale (default: the person
        of the first line). Not enough available units is `400` `quantity` / `insufficient_stock`; the last unit is
        never reserved twice. The total grows by the product; a visit paid in full goes back to `on_site` for the
        rest. A finished visit is `409` `status` / `invalid_transition`; a visit waiting for its online payment
        `409` `payment_status` / `online_pending`. Needs the products module and `tenant.products.sell`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantReservationProductRequest"
      responses:
        "200":
          description: Reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantReservation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
