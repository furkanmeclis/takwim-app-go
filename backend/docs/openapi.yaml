    TenantServiceOffer:
      type: object
      description: |
        A branch offering the service. `price` / `duration_minutes` are the
        branch overrides (null = catalog value); `effective_*` are what the
        branch charges and books.
      required: [branch_uuid, branch_name, branch_code, price, duration_minutes, effective_price, effective_duration_minutes, is_active, editable]
      properties:
        branch_uuid: { type: string, format: uuid }
        branch_name: { type: string }
        branch_code: { type: string }
        price:
          oneOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"
        duration_minutes: { type: [integer, "null"] }
        effective_price: { $ref: "#/components/schemas/MoneyAmount" }
        effective_duration_minutes: { type: integer }
        is_active: { type: boolean }
        editable: { type: boolean, description: "False for branches outside the caller's scope" }

    TenantServiceStaff:
      type: object
      required: [staff_uuid, name, title, color, is_active, price, duration_minutes]
      properties:
        staff_uuid: { type: string, format: uuid }
