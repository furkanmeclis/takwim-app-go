              items:
                $ref: "#/components/schemas/RoleSummary"
            auth_methods:
              type: array
              items:
                $ref: "#/components/schemas/UserAuthMethod"

    UserAuthMethod:
      type: object
      required: [kind, linked_at]
      properties:
        kind:
          type: string
          enum: [password, passkey, oauth]
        provider:
          type: string
          description: OAuth provider slug when kind is oauth
          examples: [github, google, facebook, apple]
        label:
          type: [string, "null"]
          description: Optional display label (e.g. passkey name)
        linked_at:
          type: string
          format: date-time

    PublicUserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformUserDetail"
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    RealtimeConnectionToken:
      type: object
