  /v1/tenant/entitlements:
    get:
      tags: [Tenant]
      operationId: getTenantEntitlements
      summary: Plan, add-ons, limits and usage of the organization
      description: |
        Read-only for the organization (`tenant.settings.read`); Takwim
        assigns plans and add-ons. Adding a branch or a staff seat over the
        limit answers `409 PLAN_LIMIT_REACHED` with `{kind, limit, used}`; a
        module route of a module the organization may not use answers
        `403 MODULE_NOT_ENABLED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEntitlementSummary"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/overview:
    get:
      tags: [Tenant]
      operationId: getTenantOverview
      summary: Central panel of the organization
      description: |
        The branches the caller sees (`tenant.branches.read`, branch scope),
        one by one and in total: active and online branches, which are open
        now (today's hours in each branch's time zone, dated exceptions
        first) and how many members can work in each. `X-Branch` narrows it
        to one branch. `totals.members` counts each member once.
      security:
        - bearerAuth: []
