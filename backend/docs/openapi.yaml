        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantOverview"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/activity/facets:
    get:
      tags: [Tenant]
      operationId: getTenantActivityFacets
      summary: Activity history faceted filter options
      description: Resources and actions (with row counts) present in the caller's branch scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantActivityFacets"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/activity:
    get:
      tags: [Tenant]
      operationId: getTenantActivity
      summary: Activity history of the organization
      description: |
        Who changed what and when (`tenant.activity.read`). Updates carry the
        before / after of each changed field in `payload.changes`. A member
        limited to some branches (or with `X-Branch` set) only sees events of
        those branches; business-wide events are hidden from them. `q`
        searches the action, the actor and the branch name.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "`created_at` or `-created_at` (default)."
          schema: { type: string, example: "-created_at" }
        - name: resource
          in: query
          description: "Resource; comma-separate for several (see `/v1/tenant/activity/facets`)"
          schema: { type: string }
        - name: action
          in: query
          description: "Action; comma-separate for several"
          schema: { type: string }
        - name: resource_uuid
          in: query
          description: History of one record.
          schema: { type: string, format: uuid }
        - name: actor_uuid
          in: query
          description: Events of one user.
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: "RFC 3339 time, inclusive"
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: "RFC 3339 time, exclusive"
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantActivityPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/context:
    get:
      tags: [Tenant]
      operationId: getTenantContext
      summary: Current organization scope
      description: |
        Resolves the organization named by `X-Organization` and the caller's
        membership in it, and returns what tenant routes see: the organization,
        the caller's tenant role and its `tenant.*` permissions in this
        organization only. Mounted only when `TENANCY_ENABLED=true`.

        Errors: missing header → `400 ORGANIZATION_REQUIRED`; unknown
        organization or no membership → `403 NO_TENANT_MEMBERSHIP` (same
        answer for both; `super_admin` is not exempt); suspended →
        `403 ORGANIZATION_SUSPENDED`; outside the access window →
        `403 ORGANIZATION_ACCESS_EXPIRED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Organization scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantContext"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/members/meta:
    get:
      tags: [Tenant]
      operationId: getTenantMembersMeta
      summary: Members list metadata
      description: Table contract of `GET /v1/tenant/members` (`tenant.members.read`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/XBranch"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/members:
    get:
      tags: [Tenant]
      operationId: getTenantMembers
      summary: List members of the organization
      description: |
        Members of the `X-Organization` organization with all their roles and
        their branch access (`tenant.members.read`). `q` searches name,
        surname and email. Invitations are managed separately.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          description: "One of `name`, `email`, `branch_scope`, `last_login_at`, `created_at`; prefix `-` for descending. Default `created_at`."
          schema: { type: string, example: "name" }
        - name: role
          in: query
          description: Tenant role uuid; comma-separate or repeat for several (any of them)
          schema: { type: string }
        - name: branch_scope
          in: query
          schema: { type: string, enum: [all, selected] }
      responses:
        "200":
          description: Member page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMemberPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/tenant/members/{userUuid}:
    parameters:
      - name: userUuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tenant]
      operationId: getTenantMember
      summary: Get a member
      description: "`tenant.members.read`. A user who is not a member answers `404`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenant]
      operationId: patchTenantMember
      summary: Change a member's roles and branch access
      description: |
        `tenant.members.write`. `role_uuids` replaces every role of the member
        (at least one; template or organization roles). `branch_scope`
        `selected` needs `branch_uuids` (at least one live branch of the
        organization); `all` clears the selection. The change invalidates the
        cached organization scope immediately.

        Guards (`403 FORBIDDEN`): only owners grant or revoke `owner`; a
        non-owner can only grant roles whose permissions it holds itself; a
        branch-restricted caller can only manage members inside its own
        branches and cannot grant `all`. Demoting the last owner answers
        `409 LAST_ORGANIZATION_OWNER`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantMemberPatchRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tenant]
      operationId: deleteTenantMember
      summary: Remove a member from the organization
      description: "`tenant.members.write`. Only owners remove an owner; the last owner cannot be removed (`409 LAST_ORGANIZATION_OWNER`)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenant/invitations/meta:
    get:
      tags: [Tenant]
      operationId: getTenantInvitationsMeta
      summary: Invitations list metadata
      description: Table contract of `GET /v1/tenant/invitations` (`tenant.members.read`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "400": { $ref: "#/components/responses/OrganizationRequired" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }

  /v1/tenant/invitations:
    get:
      tags: [Tenant]
      operationId: getTenantInvitations
      summary: List staff invitations
      description: |
        Invitations of the organization (`tenant.members.read`), newest first.
        `q` searches the e-mail. Live updates on
        `org:{org_uuid}:resource:tenant.invitations`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/InvitationSort"
        - $ref: "#/components/parameters/InvitationStatus"
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeInvitationPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TenantForbidden" }
    post:
      tags: [Tenant]
      operationId: postTenantInvitation
      summary: Invite a staff member
      description: |
        `tenant.members.write`. E-mails a single-use link
        `${PUBLIC_FRONTEND_URL}/invite/{token}` valid for 7 days; the token
        (32 random bytes) is stored as its sha256 hash and never returned.
        Re-inviting an e-mail revokes its open invitation; inviting a member
        answers `409 ALREADY_MEMBER`.

        Same guards as member updates (`403 FORBIDDEN`): only owners invite
        owners; a non-owner can only grant roles whose permissions it holds;
        a branch-restricted caller cannot grant `all` and only its own
        branches. Rate limited per organization (`429 RATE_LIMITED`).
      security:
        - bearerAuth: []
      parameters:
