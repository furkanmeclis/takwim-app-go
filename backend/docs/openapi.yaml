        description: { type: string, maxLength: 2000 }
        min_capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        capacity: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        combinable: { type: boolean, default: false }
        show_online: { type: boolean, default: true }
        is_active: { type: boolean, default: true }
